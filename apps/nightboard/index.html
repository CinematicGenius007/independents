<body>
<!-- the room behind the screen: drawn by src/ui/backdrop.js, decoration only -->
<!-- for search engines and visitors without scripts; the game draws over it -->
<noscript><main style="position:fixed;inset:0;z-index:99;background:#03060a;color:#d5dce6;font:18px/1.5 system-ui,sans-serif;padding:48px 24px"><h1>Flatline</h1><p>A browser game where you run an emergency department at night as the charge nurse. 19:00 to 07:00: give out beds, call in teams and keep the hospital from jamming. It needs JavaScript to play.</p><p><a style="color:#8db4f0" href="handbook.html">Read the handbook</a></p></main></noscript>
<div id="world" aria-hidden="true">
  <div id="scene">
    <div class="photo back"></div>
    <div class="photo front"></div>
    <canvas id="mid"></canvas>
  </div>
  <canvas id="near"></canvas>
  <div id="grade"></div>
  <div id="grain"></div>
</div>
<div id="vignette"></div>
<div id="stand"></div>
<!-- the game: src/ui/app.js renders PULSE ED into #screen and the desk around it -->
<div id="monitor"><div id="screen"></div></div>
<div id="desk"></div>
<div id="intro"></div>
<div id="guide-layer"></div>
<div id="tut-layer"></div>
<div id="handbook" role="dialog" aria-label="Handbook"></div>
<script type="module" src="./src/main.js"></script>
</body>
