<html lang="en">
<head>

<title>Deadlock</title>
<style>
:root { --ink: #33202a; --grass: #8fbd4b; --sky: #8ecdf2; --cream: #fff6df; --soil: #8b5e3c; --gold: #f7c531; --red: #e3453f;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Nunito", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: #cfe6f1; }
/* specimen sheet */

.sheet-head { max-width: 1180px; margin: 0 auto; padding: 28px 0 8px; }
.sheet-head h1 { margin: 0; font-size: 38px; letter-spacing: -.01em; }
.sheet-head p { margin: 4px 0 8px; opacity: .75; }
.tog { font-size: 14px; opacity: .8; }
#sheet { max-width: 1180px; margin: 0 auto; }
#sheet section { margin: 34px 0; }
#sheet h2 { font-size: 22px; margin: 0 0 4px; }
#sheet section > p { margin: 0 0 14px; max-width: 62ch; opacity: .78; line-height: 1.45; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }

body.game { overflow-x: hidden; background: #8ecdf2; }
#app { min-height: 100dvh; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 14px 6px; position: relative; z-index: 5; }
#trail { display: flex; gap: 8px; overflow-x: auto; padding: 6px 4px 8px; max-width: calc(100vw - 160px); scrollbar-width: none; }
#trail::-webkit-scrollbar { display: none; }
.stone { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%; border: 0; font: 800 15px var(--font); color: var(--ink); cursor: pointer; position: relative;
  background: radial-gradient(circle at 34% 28%, #fff7d8, #e9d6a2 62%, #c8ad72); box-shadow: inset -3px -4px 0 var(--clay-lo), inset 2px 2px 0 var(--clay-hi), 0 4px 0 #8a6c36; }
.stone.here { background: radial-gradient(circle at 34% 28%, #fff1a8, #f7c531 62%, #c98a0b); transform: translateY(-3px) scale(1.12); }
.stone.won s { position: absolute; left: 0; right: 0; bottom: -13px; font-size: 10px; text-decoration: none; color: #e0a30b; letter-spacing: -1px; text-shadow: 0 1px 0 #fff; }
.stone.locked { opacity: .45; filter: grayscale(.6); cursor: default; }
.modes { display: flex; gap: 8px; }
.cbtn { width: 48px; height: 48px; border-radius: 50%; border: 0; display: grid; place-items: center; cursor: pointer; color: var(--ink);
  background: radial-gradient(circle at 34% 28%, #fffaf0, #f3e4c1 62%, #cfb27a); box-shadow: inset -3px -5px 0 var(--clay-lo), inset 3px 3px 0 var(--clay-hi), 0 5px 0 #8a6c36; transition: transform .12s steps(2); }
.cbtn:active, .cbtn.pressed { transform: translateY(4px) scale(1.04, .94); box-shadow: inset -3px -5px 0 var(--clay-lo), inset 3px 3px 0 var(--clay-hi), 0 1px 0 #8a6c36; }
.cbtn.on { background: radial-gradient(circle at 34% 28%, #fff6c0, #f7c531 62%, #c98a0b); }
.cbtn svg { width: 26px; height: 26px; }
.cbtn:focus-visible, .stone:focus-visible, .tok:focus-visible { outline: 4px solid #fff; outline-offset: 3px; box-shadow: 0 0 0 7px #2f74b4; }
.cbtn.sky { background: radial-gradient(circle at 34% 28%, #e9f6ff, #8fd0f4 62%, #4aa2d6); }
.cbtn.coral { background: radial-gradient(circle at 34% 28%, #ffe9e1, #ff9d86 62%, #e0553f); }
.cbtn.leaf { background: radial-gradient(circle at 34% 28%, #f0ffd6, #a6dc62 62%, #5f9c2e); }
.cbtn.big { width: 62px; height: 62px; } .cbtn.big svg { width: 32px; height: 32px; }
#btn-play .ic-pause { display: none; } #btn-play[data-state=pause] .ic-pause { display: block; } #btn-play[data-state=pause] .ic-play { display: none; }
main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 0 14px; align-items: start; }
.stage { position: relative; display: grid; place-items: center; }
#board { width: min(100%, calc((100dvh - 232px) * 1.4286)); min-width: 280px; aspect-ratio: 10 / 7; border-radius: 26px; box-shadow: 0 8px 0 #6e472c, 0 18px 34px rgba(50,30,10,.28); background: #8ecdf2; touch-action: none; display: block; }
#dev { display: none; }

.cell.open { background: #ffe58a; } .cell.now { background: #fff; transform: translateY(-3px); box-shadow: 0 0 0 3px #f7c531, 0 4px 0 #c68a0b; z-index: 2; }

  .cbtn { width: 44px; height: 44px; } .deck { gap: 10px; padding: 10px 10px 18px; } .film { order: -1; flex-basis: 100%; }

<script id="engine-src">
const Engine = (() => {
/* ---- rng ---- */
// mulberry32 + FNV-1a. No Math.random, no clock: a seed names one board forever.
function createRng(seed) {
  let state = seed >>> 0;
  return () => {
    state = (state + 0x6d2b79f5) >>> 0;
    let t = state;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashSeed(text) {
  let hash = 2166136261;
  const s = String(text == null ? '' : text).trim().toUpperCase();
  for (let i = 0; i < s.length; i += 1) {
    hash ^= s.charCodeAt(i);
    hash = Math.imul(hash, 16777619);
  }
  return hash >>> 0;
}
function pickInt(rng, lo, hi) { return lo + Math.floor(rng() * (hi - lo + 1)); }
function pickOne(rng, items) { return items[Math.floor(rng() * items.length)]; }
function shuffled(rng, items) {
  const out = [...items];
  for (let i = out.length - 1; i > 0; i -= 1) {
    const j = Math.floor(rng() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

/* ---- model ---- */
// Level data model + compiler to flat integer ops.
//
// A level is plain JSON:
//   { id, name, seed, rung, family, mode:'lockstep'|'priority', resources:[ids],
//     carts:[{ id, skin, prio, deadline, tape:[{k,...}], tight? }],
//     budget:{hold,loan}, holdTicks, boostTicks, horizon,
//     initial?:{ cartId:{held,pc,blockedOn}, owner:{res:cartId} },
//     layout:{...} }
// Tape ops: lock(r) unlock(r) travel(n) try(r,backoff) work() done()
const OP = { LOCK: 0, UNLOCK: 1, TRAVEL: 2, TRY: 3, WORK: 4, DONE: 5 };
const lock = (r) => ({ k: 'lock', r });
const unlock = (r) => ({ k: 'unlock', r });
const travel = (n) => ({ k: 'travel', n });
const tryLock = (r, backoff) => ({ k: 'try', r, backoff });
const work = () => ({ k: 'work' });
const done = () => ({ k: 'done' });

// State layout (Int32Array): [tick,status,holdLeft,loanLeft, owner[R], per cart x W]
const W = 7; // pc, blk, busyUntil, holdUntil, boostUntil, done, heldMask
const F = { PC: 0, BLK: 1, BUSY: 2, HOLD: 3, BOOST: 4, DONE: 5, HELD: 6 };
const NO_DEADLINE = 1 << 20;

const cache = new WeakMap();
function compile(level) {
  const hit = cache.get(level);
  if (hit) return hit;
  const N = level.carts.length;
  const R = level.resources.length;
  if (R > 30) throw new Error('at most 30 resources (bitmask)');
  const resIdx = {};
  level.resources.forEach((r, i) => { resIdx[r] = i; });
  const cartIdx = {};
  level.carts.forEach((c, i) => { cartIdx[c.id] = i; });
  const ops = level.carts.map((c) => {
    const a = new Int32Array(c.tape.length * 3);
    c.tape.forEach((op, i) => {
      const k = OP[op.k.toUpperCase()];
      a[i * 3] = k;
      if (op.k === 'lock' || op.k === 'unlock') a[i * 3 + 1] = resIdx[op.r];
      if (op.k === 'try') { a[i * 3 + 1] = resIdx[op.r]; a[i * 3 + 2] = op.backoff; }
      if (op.k === 'travel') a[i * 3 + 1] = op.n;
    });
    return a;
  });
  const base = 4 + R;
  const init = new Int32Array(base + N * W);
  init[1] = 0;
  init[2] = level.budget.hold;
  init[3] = level.budget.loan;
  for (let r = 0; r < R; r += 1) init[4 + r] = -1;
  for (let i = 0; i < N; i += 1) init[base + i * W + F.BLK] = -1;
  if (level.initial) {
    level.carts.forEach((c, i) => {
      const ini = level.initial[c.id];
      if (!ini) return;
      const b = base + i * W;
      if (ini.pc != null) init[b + F.PC] = ini.pc;

    ops, init,

}

/* ---- sim ---- */
// The product automaton, flat. One cart = one tape automaton; the monitor is
// owner[] + blocked + timers. step() is a pure function of (compiled, state).
// Disciplines: 'lockstep' (every runnable cart acts on one tick, contention

const RUNNING = 0, WON = 1, DEADLOCK = 2, LIVELOCK = 3, MISSED = 4;

}

function execUnlock(c, S, i, r, ev) {

    if (tick < S[b + F.HOLD]) anyHeld = true;

// ev (optional) collects [type, cartIdx, resIdx] for animation and the log.
function step(c, S, ev) {

function stepPriority(c, S, ev) {

function stepLockstep(c, S, ev) {

  for (const i of run) {
    const b = cb(c, i);
    const ops = c.ops[i];
    const pc = S[b + F.PC];
    if (pc * 3 >= ops.length) { S[b + F.DONE] = 1; continue; }
    const k = ops[pc * 3], a1 = ops[pc * 3 + 1];

    else if (k === OP.TRAVEL) { S[b + F.BUSY] = S[0] + a1 + 1; S[b + F.PC] += 1; if (ev) ev.push(['travel', i, a1]); }
    else if (k === OP.WORK) { S[b + F.PC] += 1; if (ev) ev.push(['work', i, -1]); }

// ---- interventions -------------------------------------------------------
function canHold(c, S, i) {

// ---- readouts (pure functions of a state) --------------------------------

    while (pc * 3 < ops.length && ops[pc * 3] !== OP.LOCK && ops[pc * 3] !== OP.TRY && ops[pc * 3] !== OP.DONE) pc += 1;
    if (pc * 3 >= ops.length) continue;

/* ---- trace ---- */
// replay(level, plan) -> frames. The whole UI is a view over this: the film
// strip, the scrubber, the demo, Dev mode. A plan is a list of
//   { tick, kind:'hold'|'loan', cart:cartId }
// applied before the scheduler step of that tick. Pure and deterministic.


const cbase = (c, i) => c.base + i * W;

  const c = compile(level);

    const b = cbase(c, i);
    const held = [];
    for (let r = 0; r < c.R; r += 1) if ((S[b + F.HELD] >> r) & 1) held.push(r);
    carts.push({
      i, id: level.carts[i].id, pc: S[b + F.PC], held,
      blockedOn: S[b + F.BLK], done: !!S[b + F.DONE],
      busyLeft: Math.max(0, S[b + F.BUSY] - S[0]),
      holdLeft: Math.max(0, S[b + F.HOLD] - S[0]),
      boostLeft: Math.max(0, S[b + F.BOOST] - S[0]),

    tick: S[0], status: S[1], statusName: STATUS_NAMES[S[1]],
    budget: { hold: S[2], loan: S[3] },
    carts, owner, edges, intent, cycle, intentCycle: iCycle,

function replay(level, plan = [], opts = {}) {

  const S = initState(c);
  const pend = plan.map((a, n) => ({ ...a, n })).sort((a, b) => a.tick - b.tick || a.n - b.n);
  const frames = [];

  const sigs = new Map();
  let pi = 0;
  let ev = [];
  for (let t = 0; t <= maxTicks; t += 1) {
    const acts = [];
    while (pi < pend.length && pend[pi].tick === t && S[1] === RUNNING) {
      const a = pend[pi]; pi += 1;
      const i = c.cartIdx[a.cart];
      let ok = false;
      if (i !== undefined) {
        const waiterFor = a.kind === 'loan' ? findWaiter(c, S, i) : -1;
        if (a.kind === 'hold' && canHold(c, S, i)) { applyHold(c, S, i); ok = true; }
        else if (a.kind === 'loan' && canLoan(c, S, i)) { applyLoan(c, S, i); ok = true; }

        applied.push({ ...a, ok });

    frames.push(view);

// Which waiter is the loan lending priority from? (animation only)
function findWaiter(c, S, i) {
  const held = S[cbase(c, i) + F.HELD];
  let best = -1, bp = -1;
  for (let j = 0; j < c.N; j += 1) {
    const b = cbase(c, j);
    const r = S[b + F.BLK];
    if (r >= 0 && !S[b + F.DONE] && ((held >> r) & 1) && c.prio[j] > bp) { best = j; bp = c.prio[j]; }

function failureKind(rep) {
  if (rep.status === DEADLOCK) return 'deadlock';
  if (rep.status === LIVELOCK) return 'livelock';
  if (rep.status === MISSED) {

}

  const c = compile(level);
  const i = c.cartIdx[cartId];
  if (i === undefined) return false;
  return kind === 'hold' ? canHold(c, frame.raw, i) : canLoan(c, frame.raw, i);

/* ---- certify ---- */
// Certifier: lexicographic shortest-plan search over the product automaton.
//   cost = interventions (0-1 BFS: a scheduler step costs 0, a hold/loan costs 1)
// Pruning that keeps it interactive:
//   * tick-free, timer-relative state key (a state at tick 9 is the same state as
//     at tick 5 shifted in time; the earlier one dominates because deadlines are
//     absolute);
//   * budget dominance: (hold>=, loan>=, tick<=) with the same key subsumes;
//   * only *meaningful* interventions are branched: a hold on a cart that is
//     neither done, blocked nor already held; a loan only on a holder some higher
//     priority cart waits on.
// The engine never reads a clock; callers time it.



function certifyFrom(level, S0, opts = {}) {
  const c = compile(level);
  const maxStates = opts.maxStates ?? 120000;
  const budget = opts.budget ?? { hold: S0[2], loan: S0[3] };
  const start = S0.slice();
  start[2] = budget.hold; start[3] = budget.loan;
  const total = budget.hold + budget.loan;

  const dom = new Map(); // dynKey -> [[hold, loan, tick], ...]
  const dominated = (key, S) => {
    const list = dom.get(key);
    if (!list) { dom.set(key, [[S[2], S[3], S[0]]]); return false; }
    for (const e of list) if (e[0] >= S[2] && e[1] >= S[3] && e[2] <= S[0]) return true;
    list.push([S[2], S[3], S[0]]);
    return false;
  };

  const nodes = [{ S: start, parent: -1, act: null }];
  dominated(dynKey(c, start), start);
  const buckets = Array.from({ length: total + 1 }, () => []);
  buckets[0].push(0);

  const plan = (idx) => {

    return out.reverse();

      const t = S[0];

      }
      if (next[1] === RUNNING) push(next, idx, null, used);
      if (used >= total) continue;
      for (let i = 0; i < c.N; i += 1) {
        if (S[2] > 0 && canHold(c, S, i)) {

        S('stop', { offset: '0', 'stop-color': '#79c2ee' }), S('stop', { offset: '.7', 'stop-color': '#c5e6f8' }), S('stop', { offset: '1', 'stop-color': '#eef8e4' })),
      S('linearGradient', { id: 'grassG', x1: '0', y1: '0', x2: '0', y2: '1' },
        S('stop', { offset: '0', 'stop-color': '#a6cf58' }), S('stop', { offset: '1', 'stop-color': '#6aa13a' })),

  // A clay lump: filled path(s) with seam + thumbprint, lit by the clay filter.
  function lump(d, color, o = {}) {
    const g = S('g', { filter: o.small ? 'url(#clay-sm)' : 'url(#clay)' });

  const rrect = (x, y, w, h, r) => ({ tag: 'rect', attrs: { x, y, width: w, height: h, rx: r, ry: r } });

  function shadow(rx = 60, ry = 12, dx = 8, dy = 4) {

  }

  function starPath(r, ri = r * 0.45) {

  /* ---------------- Pad: the mutex. A round clay platform with a lamp. ---------------- */
  function createPad(o = {}) {
    const root = S('g');
    const sh = shadow(112, 40, 10, 18);
    const side = lump(ell(0, 10, 100, 46), { main: PAL.sandDark, dark: '#8a6c36' }, { noThumb: true });
    const top = lump(ell(0, -2, 100, 46), { main: PAL.sand, dark: PAL.sandDark });
    const rim = S('ellipse', { cx: 0, cy: -2, rx: 78, ry: 33, fill: 'none', stroke: '#fff', 'stroke-width': 7, 'stroke-opacity': 0, 'stroke-linecap': 'round' });

  /* ---------------- Rail: two steel rails over sleepers between two points ---------------- */
  function createRail(a, b, o = {}) {

  /* ---------------- Hut: a cart's station / goal ---------------- */
  function createHut(skinIdx, o = {}) {
    const sk = SKINS[skinIdx % 6];
    const root = S('g');
    const inner = S('g');
    const sh = shadow(60, 14, 8, 6);
    const body = lump(rrect(-40, -52, 80, 52, 10), { main: '#fff1d0', dark: '#b79e6b' });
    const roof = lump('M-52,-48 Q-48,-86 0,-92 Q48,-86 52,-48 Q0,-40 -52,-48Z', sk);
    const door = lump(rrect(-12, -34, 24, 34, 12), { main: '#6b4a38', dark: '#3b2a1f' }, { small: true, noThumb: true });
    const pole = S('rect', { x: 30, y: -128, width: 4, height: 44, rx: 2, fill: PAL.rail });
    const flag = S('g', { filter: 'url(#clay-sm)' }, S('path', { d: 'M34,-126 L62,-117 L34,-107Z', fill: sk.main, stroke: sk.dark, 'stroke-opacity': '.5', 'stroke-width': 1.4, 'stroke-linejoin': 'round' }));

      },
    };
  }

  /* ---------------- Yarn: the wait-for arrow. Red = real wait, pink dashed = about to wait ---------------- */
  function createYarn() {
    const root = S('g', { 'pointer-events': 'none' });
    const shade = S('path', { fill: 'none', stroke: '#2b1d12', 'stroke-opacity': '.18', 'stroke-width': 8, 'stroke-linecap': 'round', filter: 'url(#soft)' });
    const rope = S('path', { fill: 'none', stroke: PAL.yarn, 'stroke-width': 8, 'stroke-linecap': 'round' });
    const twist = S('path', { fill: 'none', stroke: PAL.yarnLight, 'stroke-width': 3.2, 'stroke-linecap': 'round', 'stroke-dasharray': '2 8' });
    const bead = S('g', { filter: 'url(#clay-sm)' }, S('circle', { r: 9, fill: PAL.yarn, stroke: '#8d1f1b', 'stroke-opacity': '.5', 'stroke-width': 1.6 }));
    const beadHi = S('circle', { r: 2.6, fill: '#fff', 'fill-opacity': '.8' });
    root.append(shade, S('g', { filter: 'url(#clay-sm)' }, rope), twist, bead, beadHi);

      el: root,
      // a,b world points; taut 0 (slack) .. 1 (taut); ghost = pale dashed "intent" yarn

        const t = p.t || 0;
        const taut = p.taut ?? 1;

        const sag = (1 - taut) * 46 + 4;
        const trem = taut > 0.9 ? jit(t, p.k || 1) * 1.6 : 0;
        const d = `M${a.x.toFixed(1)},${a.y.toFixed(1)} Q${(mx + trem).toFixed(1)},${(my + sag + trem).toFixed(1)} ${b.x.toFixed(1)},${b.y.toFixed(1)}`;

  /* ---------------- Chock (Hold token): a doorstop wedge ---------------- */
  function createChock(o = {}) {
    const root = S('g');
    const sh = shadow(34, 8, 4, 6);
    const cid = nextId();
    const WD = 'M-34,4 L-34,-3 Q-33,-6 -28,-8 L28,-30 Q38,-34 40,-24 L40,0 Q40,4 34,4 Z';
    const wedge = lump(WD, { main: '#f0553f', dark: '#9b2a1c' }, { small: o.small });
    const stripes = S('g', { 'clip-path': `url(#wc${cid})`, opacity: 0.96 }, S('clipPath', { id: `wc${cid}` }, S('path', { d: WD })));
    [-18, -2, 14, 30].forEach((x) => stripes.appendChild(S('path', { d: `M${x},6 L${x + 14},-40`, stroke: '#fff3d6', 'stroke-width': 7, 'stroke-linecap': 'butt' })));

        root.setAttribute('transform', `translate(${p.x || 0} ${p.y || 0}) rotate(${p.rot || 0}) scale(${(p.s || 1) * (1 + sq).toFixed(3)} ${((p.s || 1) * (1 - sq)).toFixed(3)})`);
      },
    };
  }

  /* ---------------- Ticket (Loan token): golden VIP ticket with a lease dot row ---------------- */
  function createTicket(o = {}) {
    const root = S('g');
    const sh = shadow(38, 8, 4, 28);
    const body = lump('M-36,-22 L36,-22 L36,-9 Q27,0 36,9 L36,22 L-36,22 L-36,9 Q-27,0 -36,-9 Z', { main: PAL.gold, dark: PAL.goldDark }, { small: o.small });

    const dots = S('g', { transform: 'translate(2 14)' });
    for (let i = 0; i < 6; i += 1) dots.appendChild(S('circle', { cx: -18 + i * 7.5, cy: 0, r: 2.7, fill: '#8a5a00' }));
    const sparkle = S('g', { opacity: 0 });
    for (let i = 0; i < 4; i += 1) sparkle.appendChild(S('path', { d: starPath(6, 2), fill: '#fff9c8', transform: `translate(${[-40, 42, -28, 36][i]} ${[-24, -18, 24, 26][i]})` }));
    root.append(sh, body, perf, st, dots, sparkle);
    return {
      el: root,
      set(p) {
        const n = p.frac == null ? 6 : Math.ceil(p.frac * 6);

      },
    };
  }

  /* ---------------- Sun / spotlight: the scheduler. It looks at whoever runs. ---------------- */
  function createSun() {
    const root = S('g');
    const beam = S('path', { d: '', fill: 'url(#beam)', opacity: 0.9 });
    const rays = S('g');
    for (let i = 0; i < 10; i += 1) {
      rays.appendChild(lump({ tag: 'rect', attrs: { x: -5, y: -66, width: 10, height: 20, rx: 5, transform: `rotate(${i * 36})` } }, { main: '#ffcf45', dark: '#c98a0b' }, { small: true, noThumb: true }));
    }
    const disc = lump(circ(0, 0, 44), { main: '#ffd54f', dark: '#c88a0a' });

<script>

/* Demo: a wordless, hand-guided tour that runs on the real engine.
 * It never fakes motion: it loads real levels (Engine.levelFor), asks the
 * certifier for the winning move, and a clay hand shows where to drop the
 * token. Every drop goes through App.tryDrop -> Engine.replay.
 * Arc: ring freezes -> rewind -> chock (Hold) -> ring unzips -> VIP wait ->
 * wrong ticket target bounces -> ticket to the holder (Loan) -> everyone home. */
const Demo = (() => {
  const E = Engine, C = Clay;
  const D = { active: false, beat: null, stage: 0, levels: [], hints: [], t0: 0, anim: null, hand: null, carry: null, ov: null, userTouched: false, wrongShown: false, fails: 0, fn: 0 };

    const r = rect(A.board.svg); const p = A.board.lastPos[i]; const sc = A.board.scale;

  };

  const ease = C.ease;

  function setBeat(name) { D.beat = name; D.t0 = performance.now() / 1000; D.userTouched = false; D.anim = null; D.carry = null; D.fn = 0; }
  const idx = (A, cartId) => A.level.carts.findIndex((c) => c.id === cartId);

  // keyframes: [{p:()=>{x,y}, d:seconds to reach, mode, press, carry}] looped
  function anim(keys, tail = 1.2) { D.anim = { keys, tail, t0: performance.now() / 1000 }; }
  function sampleAnim(t) {
    const an = D.anim; if (!an) return null;
    const total = an.keys.reduce((s, k) => s + k.d, 0) + an.tail;
    let lt = (t - an.t0) % total; const loops = Math.floor((t - an.t0) / total);
    let prev = an.keys[0].p(); let pm = an.keys[0].mode || 'point';

    D.active = true; A.demo = API; D.A = A; D.stage = 0; D.fails = 0;
    document.body.classList.add('demo');

      D.ov = document.getElementById('overlay');
      D.ov.replaceChildren(C.defs());
      D.hand = C.createHand(); D.ov.appendChild(D.hand.el);
      D.tok = { hold: C.createChock(), loan: C.createTicket() };
      D.tokG = C.S('g'); D.tokG.append(D.tok.hold.el, D.tok.loan.el); D.ov.insertBefore(D.tokG, D.hand.el);
    }
    D.levels = [E.levelFor('DEMO', 0).level, E.levelFor('DEMO', 1).level];
    D.hints = D.levels.map((l) => E.analyse(l).plan[0]);

  }
  function enterStage(A, s) {
    D.stage = s; D.fails = 0; D.wrongShown = false;

  function stop(go = true) {
    D.active = false; A_off(); document.body.classList.remove('demo');

      case 'hold': {
        if (!D.anim) {
          const keys = [{ p: () => ({ x: window.innerWidth + 60, y: window.innerHeight + 60 }), d: 0.01 }, { p: () => tokenPx(A, kind), d: 0.8, mode: 'point' }, { p: () => tokenPx(A, kind), d: 0.35, mode: 'grab', carry: kind }];
          if (stage === 1) keys.push({ p: () => cartPx(A, wrongI), d: 0.9, mode: 'grab', carry: kind }, { p: () => cartPx(A, wrongI), d: 0.5, mode: 'grab', carry: kind, press: true }, { p: () => tokenPx(A, kind), d: 0.8, mode: 'grab', carry: kind });

  function skeleton(A) {

      <section><h3>Machine</h3><div id="d-machine"></div></section>
      <section><h3>Threads <small>cart = thread, pad = mutex</small></h3><div id="d-threads"></div></section>
      <section><h3>Product automaton <small>carts × monitor</small></h3><div id="d-cert"></div></section>
      <section><h3>Plan</h3><div id="d-plan"></div></section>
      <section><h3>Seed</h3>
        <form id="d-seedform" class="seedrow"><input id="d-seed" value="${esc(A.seed)}" spellcheck="false" aria-label="seed"><select id="d-rung" aria-label="rung"></select><button type="submit">build</button></form>
        <div id="d-level" class="mono"></div>
        <div class="seedrow"><input id="d-link" readonly aria-label="share link"><button id="d-copy" type="button">copy</button></div>
      </section>`;

    $('#d-seedform').addEventListener('submit', (e) => { e.preventDefault(); A.go(+sel.value, $('#d-seed').value); });
    sel.addEventListener('change', () => A.go(+sel.value, $('#d-seed').value));

/* App: state, transport, film strip, drag-and-drop tokens, modes, persistence.

      if (e.target.matches('input, textarea')) return;
      if (e.key === ' ') { e.preventDefault(); A.playing ? A.pause() : A.play(); }
      else if (e.key === 'ArrowRight') A.scrub(Math.round(A.tf) + 1);
      else if (e.key === 'ArrowLeft') A.scrub(Math.round(A.tf) - 1);
      else if (e.key === 'Home') A.rewind();
      else if (e.key.toLowerCase() === 'd') A.setMode(A.mode === 'dev' ? 'player' : 'dev');
    });
    bindFilm();
    els.help.addEventListener('click', () => Demo.start(A));
    els.skip.addEventListener('click', () => { Demo.stop(); A.seenDemo = true; store.save({ ...saved, won: A.progress, seenDemo: true }); A.go(A.rung); });
    const h = parseHash();
    A.seed = (h.s || 'CLAY').toUpperCase();
    const startRung = Math.max(0, Math.min(E.LADDER.length - 1, +(h.r || 0) || 0));
    // cover: frozen ring behind the mode choice
    $('#cover').querySelectorAll('[data-pick]').forEach((b) => b.addEventListener('click', () => {
      $('#cover').classList.add('gone'); A.started = true; A.setMode(b.dataset.pick);
      if (!A.seenDemo && b.dataset.pick === 'player' && !h.r) Demo.start(A); else A.go(startRung);
    }));
    A.go(startRung);
    // the cover shows the real engine's deadlock, frozen
    A.scrub(A.nFrames() - 1);
    if (A.rep.status === 0) A.tf = A.nFrames() - 1;
    A.setMode(h.dev ? 'dev' : 'player');
    if (h.r != null || h.dev) { /* deep link: skip the cover */ $('#cover').classList.add('gone'); A.started = true; if (h.dev) A.setMode('dev'); }
    requestAnimationFrame(loop);
    window.__app = A;
  };
  A.overlay = () => overlay;
  A.markSeenDemo = () => { A.seenDemo = true; store.save({ ...saved, won: A.progress, seenDemo: true }); };
  return A;
})();

App.boot();
</script>
