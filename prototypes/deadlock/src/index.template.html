<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deadlock</title>
<style>
/*{{CSS}}*/
</style>
</head>
<body class="game">
<div id="app" data-mode="player">
  <header class="top">
    <nav id="trail" aria-label="boards"></nav>
    <div class="modes" role="group" aria-label="mode">
      <button class="cbtn" id="btn-help" aria-label="show me" title="demo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#fff6df" stroke="#33202a" stroke-width="2"/><path d="M9.2 9.2a2.9 2.9 0 1 1 4.2 2.6c-.9.5-1.4 1-1.4 2" fill="none" stroke="#33202a" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="17.4" r="1.4" fill="#33202a"/></svg></button>
      <button class="cbtn mode-btn on" data-mode="player" aria-label="player mode" title="Player"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f3b53a" stroke="#33202a" stroke-width="2"/><circle cx="8.6" cy="10" r="2.2" fill="#fff" stroke="#33202a" stroke-width="1.3"/><circle cx="15.4" cy="10" r="2.2" fill="#fff" stroke="#33202a" stroke-width="1.3"/><circle cx="8.9" cy="10.2" r="1" fill="#33202a"/><circle cx="15.7" cy="10.2" r="1" fill="#33202a"/><path d="M8 15c2.4 2.2 5.6 2.2 8 0" fill="none" stroke="#33202a" stroke-width="2" stroke-linecap="round"/></svg></button>
      <button class="cbtn mode-btn" data-mode="dev" aria-label="dev mode" title="Dev"><svg viewBox="0 0 24 24"><g fill="#fff6df" stroke="#33202a" stroke-width="1.8"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/></g><g fill="none" stroke="#d11" stroke-width="2" stroke-linecap="round"><path d="M10.4 7.6L6.6 15.4M8 18h8M17.4 15.4L13.6 7.6"/></g></svg></button>
      <button class="cbtn" id="btn-skip" aria-label="skip" title="skip"><svg viewBox="0 0 24 24"><path d="M5 5l9 7-9 7zM16 5v14" fill="#33202a" stroke="#33202a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <main>
    <section class="stage"><svg id="board" role="img" aria-label="clay railway diorama"></svg></section>
    <aside id="dev" aria-label="dev panel"></aside>
  </main>
  <footer class="deck">
    <div class="tray" id="tray" aria-label="tokens"></div>
    <div class="transport">
      <button class="cbtn sky big" id="btn-rewind" aria-label="rewind"><svg viewBox="0 0 24 24"><path d="M5 5v14M20 5l-10 7 10 7z" fill="#33202a" stroke="#33202a" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg></button>
      <button class="cbtn leaf big" id="btn-play" aria-label="play" data-state="play"><svg class="ic-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#33202a" stroke="#33202a" stroke-width="2.4" stroke-linejoin="round"/></svg><svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5v14M17 5v14" stroke="#33202a" stroke-width="4.6" stroke-linecap="round"/></svg></button>
      <button class="cbtn coral big" id="btn-reset" aria-label="clear moves"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.2-5.1M19 4v5h-5" fill="none" stroke="#33202a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div class="film" id="film" aria-label="timeline"></div>
  </footer>
</div>
<div id="cover">
  <h1>Deadlock</h1>
  <div class="picks">
    <button class="pick p" data-pick="player" aria-label="Play"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#f3b53a" stroke="#33202a" stroke-width="1.6"/><circle cx="8.6" cy="10" r="2.4" fill="#fff" stroke="#33202a" stroke-width="1.1"/><circle cx="15.4" cy="10" r="2.4" fill="#fff" stroke="#33202a" stroke-width="1.1"/><circle cx="8.9" cy="10.2" r="1.1" fill="#33202a"/><circle cx="15.7" cy="10.2" r="1.1" fill="#33202a"/><path d="M8 15c2.4 2.2 5.6 2.2 8 0" fill="none" stroke="#33202a" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <button class="pick d" data-pick="dev" aria-label="Dev"><svg viewBox="0 0 24 24"><g fill="#fff6df" stroke="#33202a" stroke-width="1.6"><circle cx="12" cy="5" r="3"/><circle cx="5" cy="18" r="3"/><circle cx="19" cy="18" r="3"/></g><g fill="none" stroke="#d11" stroke-width="1.9" stroke-linecap="round"><path d="M10.4 7.6L6.6 15.4M8 18h8M17.4 15.4L13.6 7.6"/></g></svg></button>
  </div>
</div>
<svg id="overlay" class="overlay" aria-hidden="true"></svg>
<div class="sr" id="sr" aria-live="polite"></div>
<script id="engine-src">
/*{{ENGINE}}*/
</script>
<script>
/*{{ART}}*/
</script>
<script>
/*{{UI}}*/
App.boot();
</script>
</body>
</html>
