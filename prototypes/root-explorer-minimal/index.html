<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>independents — scattered works (minimal sleeve)</title>
<meta name="description" content="Root Explorer prototype, minimal variation: a charcoal vinyl liner-notes sleeve with a flat chalk world in 3D perspective. Nineteen upright monoline landmarks, one tracklist, and a live micro-board that pops up beside each one.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap">
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
}}
</script>
<style>
:root{
  --plaster:#DCDAD7; --card:#151516; --chalk:#EAE8E3; --mute:#8E8D8A; --accent:#EE6A3C;
  --hair:rgba(234,232,227,.42); --hair2:rgba(234,232,227,.2);
  --mono:'IBM Plex Mono','Space Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html{background:
    radial-gradient(ellipse 70% 55% at 50% 38%,rgba(255,255,255,.34),rgba(255,255,255,0) 70%),
    radial-gradient(ellipse 120% 100% at 50% 50%,rgba(0,0,0,0) 52%,rgba(52,47,40,.34) 100%),
    var(--plaster);
  background-attachment:fixed;min-height:100%}
body{margin:0;min-height:100vh;color:var(--chalk);font:400 13px/1.55 var(--mono);letter-spacing:.04em;text-transform:uppercase;
  background:none;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* plaster tooth: a fixed turbulence layer, multiplied into the stone */
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='360' height='360'><filter id='p' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' seed='4'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .53  0 0 0 0 .5  0 0 0 .55 -.12'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>")}
a{color:inherit;text-decoration:none}
button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}

/* ---- petals on the plaster ------------------------------------------------ */
.petal{position:fixed;z-index:0;pointer-events:none;width:var(--w);height:calc(var(--w) * .62);left:var(--x);top:var(--y);right:var(--xr);bottom:var(--yb);
  transform:rotate(var(--r));filter:drop-shadow(0 7px 9px rgba(44,40,34,.24));opacity:.82}
.petal svg{width:100%;height:100%;display:block;overflow:visible;animation:drift var(--t,19s) ease-in-out infinite alternate}
@keyframes drift{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(4px,-6px,0) rotate(2.2deg)}}

/* ---- the sleeve ------------------------------------------------------------ */
.sleeve{position:relative;z-index:1;width:min(1180px,calc(100vw - 40px));margin:clamp(20px,5vw,60px) auto clamp(28px,6vw,72px);
  padding:clamp(22px,3.6vw,46px) clamp(20px,3.8vw,50px) clamp(22px,3vw,38px);background:var(--card);
  box-shadow:0 0 0 1px rgba(255,255,255,.035) inset,0 1px 2px rgba(0,0,0,.4),0 14px 26px -6px rgba(36,32,26,.42),0 46px 90px -28px rgba(36,32,26,.55)}
.sleeve::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;opacity:.9;background-size:512px 512px,300px 300px;background-image:var(--grain,none),
  url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='g' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='2' seed='11'/><feColorMatrix values='0 0 0 0 .92  0 0 0 0 .91  0 0 0 0 .88  0 0 0 .5 -.14'/></filter><rect width='100%' height='100%' filter='url(%23g)'/></svg>")}
.sleeve::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 60% 40% at 18% 12%,rgba(234,232,227,.045),transparent 70%),radial-gradient(ellipse 50% 36% at 84% 88%,rgba(234,232,227,.04),transparent 70%),linear-gradient(180deg,rgba(0,0,0,.0),rgba(0,0,0,.18))}
.sleeve>*{position:relative;z-index:1}
h1{margin:0;font-weight:500;font-size:13px;letter-spacing:.78em;word-spacing:1.25em;line-height:1.7}
.stage{display:grid;grid-template-columns:minmax(0,1.34fr) minmax(0,1fr);gap:clamp(24px,3.6vw,52px);margin-top:clamp(24px,3.4vw,40px);align-items:start}

/* ---- the world ------------------------------------------------------------- */
#world{margin:0;position:relative}
#frame{position:relative;aspect-ratio:21/20;min-height:340px;max-height:78vh;width:100%;touch-action:none}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;outline:none;touch-action:none;cursor:crosshair;
  -webkit-mask-image:radial-gradient(ellipse 76% 74% at 50% 50%,#000 58%,transparent 100%);mask-image:radial-gradient(ellipse 76% 74% at 50% 50%,#000 58%,transparent 100%)}
.reg{position:absolute;width:15px;height:15px;pointer-events:none;border:0 solid var(--hair)}
.reg.tl{left:0;top:0;border-width:1px 0 0 1px}.reg.tr{right:0;top:0;border-width:1px 1px 0 0}
.reg.bl{left:0;bottom:0;border-width:0 0 1px 1px}.reg.br{right:0;bottom:0;border-width:0 1px 1px 0}
#tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;white-space:nowrap;font-size:10px;letter-spacing:.14em;color:var(--mute);opacity:0;will-change:transform,opacity;transform:translate3d(-999px,0,0)}
.tag b{font-weight:600;color:var(--chalk)}
.mapmode .tag:not(.on):not(.lm) span{display:none}.tag.lm b,.tag.lm{color:var(--chalk)}
.tag.on{color:var(--accent)}.tag.on b{color:var(--accent)}
.tag.bd{color:var(--accent);letter-spacing:.2em}
#where{position:absolute;left:22px;top:20px;font-size:10px;letter-spacing:.2em;color:var(--mute);pointer-events:none}
#where b{color:var(--chalk);font-weight:600}
#toast{position:absolute;left:22px;top:38px;font-size:10px;letter-spacing:.2em;color:var(--accent);opacity:0;transition:opacity .35s;pointer-events:none}
#toast.show{opacity:1}
#hint{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;margin-top:14px;min-height:4.6em}
#hintText{font-size:10px;line-height:1.55;letter-spacing:.1em;color:var(--mute);max-width:56ch;text-transform:none}
.play{white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.2em;padding:7px 11px 6px;border:1px solid var(--hair);transition:border-color .2s,color .2s,background .2s,opacity .2s}
.play:hover:not(:disabled),.play:focus-visible{border-color:var(--accent);color:var(--accent)}
.play:disabled{opacity:.28;cursor:default}
.play.go{border-color:var(--chalk)}
figcaption{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.16em;color:var(--mute)}
.keys{display:flex;flex-wrap:wrap;gap:6px 14px}
.keys button{color:var(--mute);border-bottom:1px solid var(--hair2);padding-bottom:1px;transition:color .2s,border-color .2s}
.keys button:hover,.keys button.on{color:var(--chalk);border-color:var(--accent)}
.keys kbd{font:inherit;color:var(--chalk)}
#nogl{display:none;position:absolute;inset:0;align-items:center;justify-content:center;text-align:center;padding:30px;color:var(--mute);font-size:11px;letter-spacing:.14em}
body.nogl #nogl{display:flex}body.nogl #gl,body.nogl #tags{display:none}

/* ---- tracklist ------------------------------------------------------------- */
.side{margin:0 0 6px;font-weight:400;font-size:11px;letter-spacing:.5em;color:var(--mute)}
ol.tracks{list-style:none;margin:0 0 24px;padding:0}
.trk{display:flex;align-items:baseline;gap:0;padding:2.5px 6px 2px;margin:0 -6px;border-left:1px solid transparent;transition:background .2s,border-color .2s}
.trk .n{flex:0 0 3.1ch;color:var(--mute);transition:color .2s}
.trk .t{font-weight:600;white-space:nowrap}
.trk .lead{flex:1 1 14px;min-width:14px;height:1px;margin:0 10px;background:var(--hair);transform:translateY(-.34em);transition:background .2s}
.trk .d{white-space:nowrap;text-align:right}
.trk .d em{font-style:normal;color:var(--mute);margin-left:.7ch}
.trk:hover,.trk:focus-visible{background:rgba(234,232,227,.05);outline:none}
.trk.hot .n,.trk.on .n{color:var(--chalk)}.trk.hot .lead{background:var(--chalk)}
.trk.on{border-left-color:var(--accent);background:rgba(238,106,60,.07)}
.trk.on .n,.trk.on .t{color:var(--accent)}.trk.on .lead{background:var(--accent)}
.trk.off .t{color:var(--mute)}

/* ---- liner-note credits ---------------------------------------------------- */
.credits{display:grid;grid-template-columns:1fr 1fr;gap:6px clamp(24px,4vw,56px);margin-top:clamp(26px,4vw,48px)}
.cr{display:flex;align-items:baseline;gap:10px;padding:1px 0;min-height:1.55em}
.cr b{font-weight:600;white-space:nowrap}
.cr i{flex:0 0 clamp(26px,3.6vw,50px);height:1px;background:var(--hair);transform:translateY(-.34em)}
.cr span{min-width:0;overflow-wrap:anywhere;transition:color .25s}
.cr.guest{margin-top:1.1em}.cr.guest b{font-weight:600;text-transform:none;letter-spacing:.05em}
.credits .play{margin-top:14px;align-self:flex-start}
.credits .col{display:flex;flex-direction:column}

/* ---- footer ---------------------------------------------------------------- */
footer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:clamp(14px,3vw,34px);align-items:end;margin-top:clamp(32px,5vw,64px);font-size:10px;line-height:1.55;letter-spacing:.08em;color:var(--chalk)}
footer .mark{font-weight:600;font-size:15px;line-height:1.05;letter-spacing:.06em;border:1px solid var(--chalk);padding:7px 9px 6px;text-align:center}
footer .mark small{display:block;font-size:8.5px;font-weight:500;letter-spacing:.28em;margin-top:3px}
footer p{margin:0 0 7px;text-transform:none}
footer .cat{color:var(--chalk)}
#sigil{width:clamp(70px,9vw,100px);height:auto;display:block;cursor:pointer;overflow:visible;-webkit-tap-highlight-color:transparent}
#sigil *{fill:none;stroke:var(--chalk);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round}
#sigil .tick.on{stroke:var(--accent)}
#sigil .dot{fill:var(--accent);stroke:none}

@media (max-width:980px){
  .stage{grid-template-columns:minmax(0,1fr)}
  #frame{aspect-ratio:1/1;max-height:none}
}
@media (max-width:620px){
  body{font-size:12px}
  h1{letter-spacing:.42em;word-spacing:.9em;font-size:11.5px}
  .credits{grid-template-columns:1fr}
  .trk .d em{display:none}
  footer{grid-template-columns:1fr auto}footer .fine{grid-column:1/-1;order:3}
  #hint{flex-direction:column;align-items:flex-start;gap:10px;min-height:0}
}
@media (prefers-reduced-motion:reduce){.petal svg{animation:none}}
</style>
</head>
<body>

<!-- botanical petals on the plaster, peeking out around the sleeve -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="pf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset=".6" stop-color="#f1efec" stop-opacity=".8"/><stop offset="1" stop-color="#cdcac5" stop-opacity=".62"/></linearGradient>
  <filter id="pb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation=".7"/></filter>
  <symbol id="pt" viewBox="0 0 160 100"><path d="M3 64C4 30 40 3 94 2c36-1 62 17 58 43-4 28-52 52-98 46C26 88 2 80 3 64Z" fill="url(#pf)" filter="url(#pb)"/><path d="M3 64C30 56 96 50 150 40C120 62 70 78 30 84C14 80 3 74 3 64Z" fill="rgba(70,64,56,.07)"/><path d="M12 62C50 54 96 46 146 36" stroke="rgba(60,56,50,.14)" stroke-width="1" fill="none"/><path d="M30 76C62 68 98 58 128 48" stroke="rgba(60,56,50,.08)" stroke-width="1" fill="none"/><ellipse cx="86" cy="26" rx="34" ry="10" fill="rgba(255,255,255,.55)" transform="rotate(-12 86 26)"/></symbol>
</defs></svg>
<div class="petal" style="--w:190px;--x:-58px;--y:-22px;--r:-24deg"><svg><use href="#pt"/></svg></div>
<div class="petal" style="--w:130px;--x:-34px;--y:120px;--r:34deg;--t:23s"><svg><use href="#pt"/></svg></div>
<div class="petal" style="--w:98px;--x:calc(100vw - 54px);--y:-26px;--r:152deg;--t:17s"><svg><use href="#pt"/></svg></div>
<div class="petal" style="--w:210px;--xr:-70px;--yb:-34px;--r:-168deg;--t:21s"><svg><use href="#pt"/></svg></div>
<div class="petal" style="--w:120px;--x:-30px;--yb:-18px;--r:12deg;--t:25s"><svg><use href="#pt"/></svg></div>
<div class="petal" style="--w:104px;--xr:-26px;--y:42vh;--r:196deg;--t:18s"><svg><use href="#pt"/></svg></div>

<main class="sleeve" id="sleeve">
  <h1 aria-label="Independents — Scattered Works">Independents — Scattered Works</h1>

  <div class="stage">
    <figure id="world">
      <div id="frame">
        <canvas id="gl" tabindex="0" aria-label="A flat chalk landscape seen in 3D perspective. Nineteen upright monoline landmarks stand on it, one per game. Walk with WASD or the arrow keys, click the ground to walk, click a landmark or a track to open its live micro-board. The tracklist is the same set of links."></canvas>
        <div id="tags" aria-hidden="true"></div>
        <i class="reg tl"></i><i class="reg tr"></i><i class="reg bl"></i><i class="reg br"></i>
        <div id="where" aria-live="polite"></div>
        <div id="toast" role="status"></div>
        <div id="nogl"><div><b>WebGL is unavailable.</b><br>The tracklist beside this world is the whole site: every game stays one link away.</div></div>
      </div>
      <div id="hint"><div id="hintText"></div><button class="play" id="playA" disabled>▶ Play track ↵</button></div>
      <figcaption>
        <span>Fig. 1 — the ground is flat, the tracks stand up</span>
        <span class="keys"><button id="kThreads" title="Space"><kbd>Space</kbd> Threads</button><button id="kMap" title="O"><kbd>O</kbd> Map</button><button id="kBack" title="Esc"><kbd>Esc</kbd> Back</button></span>
      </figcaption>
    </figure>

    <section aria-label="Tracklist">
      <h2 class="side">Side A — Shipped</h2>

      <h2 class="side">Side B — Prototypes</h2>
      <ol class="tracks" id="sideB" start="10"></ol>
    </section>

  <section class="credits" aria-label="Liner notes" aria-live="polite">

    </div>
    <svg id="sigil" viewBox="-52 -52 104 104" role="button" tabindex="0" aria-label="Sigil: click to toggle the constellation threads"><title>Sigil — click toggles threads</title>
      <g id="sgRing"><circle r="43"/></g><g id="sgMid"><circle r="25"/></g><g id="sgIn"></g>
    </svg>
  </footer>
</main>

<script type="module">
import * as THREE from 'three';
import { LineSegments2 } from 'three/addons/lines/LineSegments2.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';

/* =====================================================================
   0. UTILITIES
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const easeOut = t => 1 - Math.pow(1 - t, 3);
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function h32(a, b) { let h = Math.imul(a ^ 0x9E3779B9, 0x85EBCA6B) ^ Math.imul(b + 0x7F4A7C15, 0xC2B2AE35); h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; return h >>> 0; }

// SHA-256 (constants derived from primes, checked against the "abc" test vector in the build notes)
const SHA = (() => {
  const primes = []; for (let n = 2; primes.length < 64; n++) if (primes.every(p => n % p)) primes.push(n);
  const fr = x => Math.floor((x - Math.floor(x)) * 2 ** 32) >>> 0;
  const H0 = primes.slice(0, 8).map(p => fr(Math.sqrt(p))), K = primes.map(p => fr(Math.cbrt(p)));
  const rr = (v, s) => (v >>> s) | (v << (32 - s));
  return function sha256(str) {
    const m = new TextEncoder().encode(str), l = m.length, n = ((l + 9 + 63) >> 6) << 4, w = new Uint32Array(n);
    for (let i = 0; i < l; i++) w[i >> 2] |= m[i] << (24 - 8 * (i & 3));
    w[l >> 2] |= 0x80 << (24 - 8 * (l & 3)); w[n - 1] = l * 8;
    const h = H0.slice(), x = new Uint32Array(64);
    for (let o = 0; o < n; o += 16) {
      for (let i = 0; i < 16; i++) x[i] = w[o + i];
      for (let i = 16; i < 64; i++) { const a = rr(x[i - 15], 7) ^ rr(x[i - 15], 18) ^ (x[i - 15] >>> 3), b = rr(x[i - 2], 17) ^ rr(x[i - 2], 19) ^ (x[i - 2] >>> 10); x[i] = (x[i - 16] + a + x[i - 7] + b) >>> 0; }
      let [a, b, c, d, e, f, g, hh] = h;
      for (let i = 0; i < 64; i++) {
        const t1 = (hh + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + x[i]) >>> 0, t2 = ((rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0;
        hh = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0;
      }
      [a, b, c, d, e, f, g, hh].forEach((v, i) => h[i] = (h[i] + v) >>> 0);
    }
    return h.map(v => v.toString(16).padStart(8, '0')).join('');
  };
})();
const hash8 = o => SHA(JSON.stringify(o)).slice(0, 8);
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

/* springs: semi-implicit Euler with small substeps, so interrupted moves re-aim smoothly */
class Spring {
  constructor(v = 0, k = 90, zeta = .85) { this.x = v; this.v = 0; this.t = v; this.set(k, zeta); }
  set(k, zeta) { this.k = REDUCED ? k * 2.5 : k; this.c = 2 * Math.sqrt(this.k) * (REDUCED ? 1 : zeta); return this; }
  step(dt) { const n = Math.max(1, Math.ceil(dt / .008)), h = dt / n; for (let i = 0; i < n; i++) { this.v += (-this.k * (this.x - this.t) - this.c * this.v) * h; this.x += this.v * h; } return this.x; }
  get energy() { return Math.abs(this.v) + Math.abs(this.x - this.t); }
}
class SpringV3 {
  constructor(v, k, z) { this.s = [new Spring(v.x, k, z), new Spring(v.y, k, z), new Spring(v.z, k, z)]; }
  to(v) { this.s[0].t = v.x; this.s[1].t = v.y; this.s[2].t = v.z; return this; }
  snap(v) { this.s.forEach((s, i) => { s.x = s.t = [v.x, v.y, v.z][i]; s.v = 0; }); return this; }
  set(k, z) { this.s.forEach(s => s.set(k, z)); return this; }
  step(dt) { this.s.forEach(s => s.step(dt)); return this; }
  write(o) { o.set(this.s[0].x, this.s[1].x, this.s[2].x); return o; }
  get energy() { return this.s[0].energy + this.s[1].energy + this.s[2].energy; }
}

/* =====================================================================
   1. REGISTRY — in the shipped site this is built from independents.manifest.json files
   ===================================================================== */
const FAM = {
  seal:     { name: 'Commit-Reveal Crypto',  short: 'SEAL',     sub: 'commit · reveal',      color: '#35c9e0' },
  p2p:      { name: 'WebRTC P2P',            short: 'P2P',      sub: 'data channels',        color: '#ff6b5a' },
  automata: { name: 'Automata / Grammars',   short: 'GRAMMAR',  sub: 'automata · rewriting', color: '#f2b84b' },
  lockstep: { name: '60 Hz Fixed-Point Sim', short: 'LOCKSTEP', sub: 'integers at 60 Hz',    color: '#a58bff' },
  cellular: { name: 'Cellular / Emergent',   short: 'CELLULAR', sub: 'local rule, global',   color: '#58e6a9' },
};
const FAMS = Object.keys(FAM);

const REG = [

/* ---- Fogwalk: belief-set sliding on a fixed 7x7 board ---- */
const FOG = ['.......', '.#..#..', '...#...', '.#...#.', '...#...', '..#..#.', '.......'];

const FSOL = (() => { // breadth-first search over belief states: par and the mark are computed, not authored
  const key = s => s.join(','); const seen = new Set([key(FCELLS)]); let q = [[FCELLS, []]];
  while (q.length) { const nq = []; for (const [s, w] of q) for (let d = 0; d < 4; d++) { const n = [...new Set(s.map(i => fSlide(i, d)))].sort((a, b) => a - b), k = key(n); if (seen.has(k)) continue; seen.add(k); if (n.length === 1) return { cell: n[0], par: w.length + 1 }; nq.push([n, [...w, d]]); } q = nq; }
  return { cell: 0, par: 0 };
})();

/* ---- Bloomwright: real L-system expansion + turtle + box-counting dimension ---- */
const BW = [
  { name: 'A · bracket weed', axiom: 'X', rules: { X: 'F+[[X]-X]-F[-FX]+X', F: 'FF' }, angle: 25 },
  { name: 'B · fern', axiom: 'F', rules: { F: 'F[+F]F[-F]F' }, angle: 25.7 },
  { name: 'C · thicket', axiom: 'F', rules: { F: 'FF+[+F-F-F]-[-F+F+F]' }, angle: 22.5 },

  const R = BW[rule]; let str = R.axiom;
  for (let g = 0; g < gen; g++) { let n = ''; for (const c of str) n += R.rules[c] ?? c; if (n.length > 60000) break; str = n; }
  const seg = []; let x = 0, y = 0, a = Math.PI / 2, d = 0; const st = [], A = angle * Math.PI / 180;
  for (const c of str) {
    if (c === 'F' || c === 'G') { const nx = x + Math.cos(a), ny = y + Math.sin(a); if (c === 'F') seg.push([x, y, nx, ny, d]); x = nx; y = ny; }
    else if (c === '+') a += A; else if (c === '-') a -= A;
    else if (c === '[') { st.push([x, y, a]); d++; } else if (c === ']') { [x, y, a] = st.pop(); d--; }

  const sc = Math.max(mxx - mnx, mxy - mny) || 1; const pts = [];
  for (const q of seg) { const L = Math.hypot(q[2] - q[0], q[3] - q[1]) / sc, n = Math.min(40, Math.ceil(L * 128) + 1); for (let i = 0; i <= n; i++) { const t = i / n; pts.push([(lerp(q[0], q[2], t) - mnx) / sc, (lerp(q[1], q[3], t) - mny) / sc]); } }
  const xs = [], ys = [];
  for (const m of [4, 8, 16, 32, 64]) { const s = new Set(); for (const p of pts) s.add(Math.min(m - 1, p[0] * m | 0) * 1000 + Math.min(m - 1, p[1] * m | 0)); xs.push(Math.log(m)); ys.push(Math.log(s.size)); }
  const mx = xs.reduce((a, b) => a + b) / 5, my = ys.reduce((a, b) => a + b) / 5; let num = 0, den = 0; xs.forEach((v, i) => { num += (v - mx) * (ys[i] - my); den += (v - mx) ** 2; });
  const out = { seg, len: str.length, bbox: [mnx, mny, mxx, mxy], dim: seg.length > 1 ? num / den : 0 };
  bwCache.set(k, out); return out;
}

  stepSim(n = 1, dt = 1 / 60, render = true) { for (let i = 0; i < n; i++) { for (const a of ART) a.session.tick?.(); simT += dt; world?.update(dt, simT, !(render && i === n - 1)); } },
  skipIntro() { FOC.intro = false; FOC.map = false; render(false); }, dive, pin, unpin, toggleThreads, toggleMap, setHover, handoffUrl, inkCv,
};
