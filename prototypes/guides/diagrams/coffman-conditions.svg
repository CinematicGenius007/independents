<svg xmlns="http://www.w3.org/2000/svg" class="ondine ondine-flowchart" viewBox="0 0 392 716" width="392" height="716" style="max-width:100%;height:auto;--_bg:var(--ondine-bg,#fff);--_fg:var(--ondine-fg,#000);--_m:var(--ondine-muted,var(--_fg));--_l:var(--ondine-line,var(--_fg));--_s:var(--ondine-surface,var(--_bg));--_a:var(--ondine-surface-alt,color-mix(in srgb,var(--_fg) 20%,var(--_bg)));--_b:var(--ondine-border,var(--_fg));--_c:var(--ondine-accent,var(--_fg));--_sw:var(--ondine-stroke,2px);stroke-width:var(--_sw);color:var(--_fg);--_r:var(--ondine-radius,0);--_fm:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font:16px monospace;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font-kerning:none;font-variant-ligatures:none;text-rendering:geometricPrecision" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="ondine-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="ondine-edge" data-id="L_M_H_0"><path d="M204.4,104L204.4,170"/><path class="ondine-marker" d="M204.4,177L201.04,169L207.76,169Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_H_N_0"><path d="M204.4,273L204.4,339"/><path class="ondine-marker" d="M204.4,346L201.04,338L207.76,338Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_N_C_0"><path d="M204.4,442L204.4,508"/><path class="ondine-marker" d="M204.4,515L201.04,507L207.76,507Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_C_D_0"><path d="M106.4,587L106.4,653"/><path class="ondine-marker" d="M106.4,660L103.04,652L109.76,652Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_C_F_0"><path d="M302.4,587L302.4,653" stroke-dasharray="3 4"/><path class="ondine-marker" d="M302.4,660L299.04,652L305.76,652Z" fill="var(--_l)" stroke="none"/></g></g><g class="ondine-edge-labels" font-size="14"><g class="ondine-edge-label" data-id="L_M_H_0"><rect x="183.6" y="126.5" width="41.6" height="21" rx="3" fill="var(--_bg)"/><text x="204.4" y="141.9" text-anchor="middle">plus</text></g><g class="ondine-edge-label" data-id="L_H_N_0"><rect x="183.6" y="295.5" width="41.6" height="21" rx="3" fill="var(--_bg)"/><text x="204.4" y="310.9" text-anchor="middle">plus</text></g><g class="ondine-edge-label" data-id="L_N_C_0"><rect x="183.6" y="464.5" width="41.6" height="21" rx="3" fill="var(--_bg)"/><text x="204.4" y="479.9" text-anchor="middle">plus</text></g><g class="ondine-edge-label" data-id="L_C_D_0"><rect x="10" y="609.5" width="192.8" height="21" rx="3" fill="var(--_bg)"/><text x="106.4" y="624.9" text-anchor="middle">all four true together</text></g><g class="ondine-edge-label" data-id="L_C_F_0"><rect x="222.8" y="609.5" width="159.2" height="21" rx="3" fill="var(--_bg)"/><text x="302.4" y="624.9" text-anchor="middle">break any one link</text></g></g><g class="ondine-nodes"><g class="ondine-node ondine-shape-rect" data-id="M" transform="translate(204.4,56)"><rect x="-109.2" y="-48" width="218.4" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">1 Mutual exclusion:</tspan><tspan x="0" y="5.6">a section holds one</tspan><tspan x="0" y="29.6">cart</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="H" transform="translate(204.4,225)"><rect x="-94.8" y="-48" width="189.6" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">2 Hold and wait:</tspan><tspan x="0" y="5.6">keep yours while</tspan><tspan x="0" y="29.6">asking for more</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="N" transform="translate(204.4,394)"><rect x="-104.4" y="-48" width="208.8" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">3 No preemption:</tspan><tspan x="0" y="5.6">nobody can force a</tspan><tspan x="0" y="29.6">release</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="C" transform="translate(204.4,551)"><rect x="-114" y="-36" width="228" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">4 Circular wait: the</tspan><tspan x="0" y="17.6">chain loops back</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="D" transform="translate(106.4,684)"><rect x="-56.4" y="-24" width="112.8" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="0" y="5.6" text-anchor="middle">Deadlock</text></g><g class="ondine-node ondine-shape-rect" data-id="F" transform="translate(302.4,684)"><rect x="-61.2" y="-24" width="122.4" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="0" y="5.6" text-anchor="middle">Free flow</text></g></g></svg>