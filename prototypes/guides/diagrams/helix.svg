<svg xmlns="http://www.w3.org/2000/svg" class="ondine ondine-flowchart" viewBox="0 0 458 610" width="458" height="610" style="max-width:100%;height:auto;--_bg:var(--ondine-bg,#fff);--_fg:var(--ondine-fg,#000);--_m:var(--ondine-muted,var(--_fg));--_l:var(--ondine-line,var(--_fg));--_s:var(--ondine-surface,var(--_bg));--_a:var(--ondine-surface-alt,color-mix(in srgb,var(--_fg) 20%,var(--_bg)));--_b:var(--ondine-border,var(--_fg));--_c:var(--ondine-accent,var(--_fg));--_sw:var(--ondine-stroke,2px);stroke-width:var(--_sw);color:var(--_fg);--_r:var(--ondine-radius,0);--_fm:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font:16px monospace;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font-kerning:none;font-variant-ligatures:none;text-rendering:geometricPrecision" fill="var(--_fg)" role="graphics-document document" aria-roledescription="flowchart"><g class="ondine-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="ondine-edge" data-id="L_flow_s_0"><path d="M232,80L232,167"/><path class="ondine-marker" d="M232,174L228.64,166L235.36,166Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_s_phi_0"><path d="M179.6,246C179.6,256.25 117.2,256.25 117.2,266.5L117.2,345"/><path class="ondine-marker" d="M117.2,352L113.84,344L120.56,344Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_phi_pos_0"><path d="M117.2,424L117.2,523"/><path class="ondine-marker" d="M117.2,530L113.84,522L120.56,522Z" fill="var(--_l)" stroke="none"/></g><g class="ondine-edge" data-id="L_s_fade_0"><path d="M284.4,246C284.4,256.25 346.8,256.25 346.8,266.5L346.8,333"/><path class="ondine-marker" d="M346.8,340L343.44,332L350.16,332Z" fill="var(--_l)" stroke="none"/></g></g><g class="ondine-edge-labels" font-size="14"><g class="ondine-edge-label" data-id="L_flow_s_0"><rect x="160.8" y="102.5" width="142.4" height="42" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="232" y="117.9">add each plate's</tspan><tspan x="232" y="138.9">station number q</tspan></text></g><g class="ondine-edge-label" data-id="L_s_phi_0"><rect x="16.6" y="268.5" width="201.2" height="42" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="117.2" y="283.9">seven stations per full</tspan><tspan x="117.2" y="304.9">turn</tspan></text></g><g class="ondine-edge-label" data-id="L_phi_pos_0"><rect x="29.2" y="458.5" width="176" height="42" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="117.2" y="473.9">sin and cos place it</tspan><tspan x="117.2" y="494.9">round the axis</tspan></text></g><g class="ondine-edge-label" data-id="L_s_fade_0"><rect x="246.2" y="279" width="201.2" height="21" rx="3" fill="var(--_bg)"/><text x="346.8" y="294.4" text-anchor="middle">fade near the loop seam</text></g></g><g class="ondine-nodes"><g class="ondine-node ondine-shape-rect" data-id="flow" transform="translate(232,44)"><rect x="-99.6" y="-36" width="199.2" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">flow: how far the</tspan><tspan x="0" y="17.6">spiral has risen</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="s" transform="translate(232,210)"><rect x="-104.4" y="-36" width="208.8" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">s = (q + flow) mod</tspan><tspan x="0" y="17.6">LOOP</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="phi" transform="translate(117.2,388)"><rect x="-94.8" y="-36" width="189.6" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">angle phi = (s -</tspan><tspan x="0" y="17.6">LOOP/2) x 2pi/7</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="pos" transform="translate(117.2,566)"><rect x="-109.2" y="-36" width="218.4" height="72" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-6.4">position x, y, z on</tspan><tspan x="0" y="17.6">the helix</tspan></text></g><g class="ondine-node ondine-shape-rect" data-id="fade" transform="translate(346.8,388)"><rect x="-94.8" y="-48" width="189.6" height="96" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-18.4">scale and dim to</tspan><tspan x="0" y="5.6">zero, so nothing</tspan><tspan x="0" y="29.6">pops</tspan></text></g></g></svg>