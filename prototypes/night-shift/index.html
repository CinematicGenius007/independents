/* ---- patient ---- */
/* One patient: identity, chart, and a simple physiology model.
 * "sev" runs from 0 (well) to 1 (cardiac arrest). Vital signs are read off it by
 * sliding between the case's well and collapse values, so a number on the monitor
 * always means the same thing as the number driving the simulation. */



function makePatient(state, caseKey, at) {
  const c = CASES[caseKey];
  const sex = c.sex === 'any' ? (rnd(state) < 0.5 ? 'M' : 'F') : c.sex;
  const id = state.nextPid++;
  const p = {
    id, case: caseKey, sex,
    name: `${pick(state, NAMES.L)}, ${pick(state, NAMES[sex])}`,
    age: rint(state, c.age[0], c.age[1]),
    mrn: String(10400000 + rint(state, 1000, 899999)),
    esi: c.esi, cc: c.cc, via: c.via,
    arriveAt: at, placedAt: null, seenAt: null, leftAt: null,
    status: 'waiting',            // expected | waiting | active | admitted | home | died | lwbs
    loc: null, using: [], preplaced: false,
    stepIdx: 0, stepState: 'need', stepLeft: 0, reqAt: at,
    prio: false, hold: false,
    sev: c.sev0, rate: c.rate, peak: c.sev0,
    arrest: null, arrested: false,
    clocks: {}, labs: [], results: [], notes: [], outcome: null, newsBand: 0,
  };
  for (const k of c.clocks || []) p.clocks[k.key] = { label: k.label, limit: k.limit, at: null, met: null };
  p.notes.push({ t: at, kind: 'Triage', author: 'Tariq Aziz RN', text: c.triage });
  return p;
}

const lerp = (a, b, k) => a + (b - a) * k;

/** Vital signs at minute t. Pure: the same patient and minute always give the same reading. */
function vitalsOf(p, t) {
  if (p.arrest) return { hr: 0, sbp: 0, dbp: 0, rr: 0, spo2: 0, temp: 36.0, gcs: 3, o2: true, arrest: true };
  const c = CASES[p.case], k = Math.max(0, Math.min(1, p.sev));
  const j = (i, amp) => jitter(p.id * 31 + i, Math.floor(t / 3)) * amp;
  const o2 = (p.placedAt !== null || p.via === 'ems') && c.vit.c.spo2 < 92 && k > 0.3;
  const spo2 = Math.round(Math.min(100, lerp(c.vit.s.spo2, c.vit.c.spo2, k) + (o2 ? 3 : 0) + j(5, 0.8)));
  return {
    hr: Math.round(lerp(c.vit.s.hr, c.vit.c.hr, k) + j(1, 3)),
    sbp: Math.round(lerp(c.vit.s.sbp, c.vit.c.sbp, k) + j(2, 4)),
    dbp: Math.round(lerp(c.vit.s.dbp, c.vit.c.dbp, k) + j(3, 3)),
    rr: Math.max(2, Math.round(lerp(c.vit.s.rr, c.vit.c.rr, k) + j(4, 1))),
    spo2,
    temp: Math.round((lerp(c.vit.s.temp, c.vit.c.temp, k) + j(6, 0.1)) * 10) / 10,
    gcs: Math.round(lerp(c.vit.s.gcs, c.vit.c.gcs, k)),
    o2, arrest: false,
  };
}

const newsOf = (p, t) => news2(vitalsOf(p, t));
const caseOf = (p) => CASES[p.case];
const stepOf = (p) => CASES[p.case].steps[p.stepIdx] || null;
const isBoarding = (p) => { const s = stepOf(p); return !!s && s.end === 'admit' && p.stepState === 'need'; };
const inDepartment = (p) => p.status === 'waiting' || p.status === 'active';

/* ---- scenario ---- */
/* The night: who arrives when. Scripted set pieces carry the lessons; seeded random
 * arrivals around them keep the department busy and make each seed a different shift.
 * Times are minutes after 19:00. Negative times are the day shift's leftovers. */


/** [minute, case]. Ambulance cases are announced `pre` minutes before they arrive. */
const SET_PIECES = [
  [14, 'stemi'],            // 19:14  cath team is at home: call in on the pre-alert
  [52, 'colic'], [58, 'stroke'],   // a kidney stone reaches the CT queue just before the stroke
  [95, 'anaphylaxis'],      // walks in, sits in the waiting room
  [128, 'trauma'], [150, 'sepsis'],
  [185, 'ectopic'],         // under-triaged, deteriorates in the waiting room
  [215, 'gibleed'], [262, 'overdose'], [300, 'chf'], [330, 'psych'],
  [352, 'appendicitis'],
  [395, 'rebleed'],         // 01:35  ICU patient needs the OR while the OR patient needs an ICU bed
  [402, 'trauma'],
  [455, 'stemi'], [470, 'dka'],
  // 03:00 bus crash: a surge
  [480, 'trauma'], [483, 'hip'], [485, 'laceration'], [487, 'forearm'], [489, 'trauma'], [492, 'ankle'], [495, 'laceration'],
  [560, 'stroke'], [600, 'sepsis'], [640, 'chf'], [675, 'overdose'],
];

/** Unscripted arrivals per hour, 19:00 to 07:00. Evenings are the busiest. */
const PER_HOUR = [8, 8, 7, 7, 6, 5, 4, 4, 3, 4, 5, 6];
const WARMUP = ['hip', 'appendicitis', 'chf', 'colic', 'hip', 'laceration', 'dka', 'colic', 'forearm', 'appendicitis', 'ankle', 'laceration', 'colic', 'ankle'];

function weighted(state, allow) {
  const keys = Object.keys(CASE_WEIGHTS).filter(allow);
  let roll = rnd(state) * keys.reduce((a, k) => a + CASE_WEIGHTS[k], 0);
  for (const k of keys) { roll -= CASE_WEIGHTS[k]; if (roll <= 0) return k; }
  return keys[0];
}

function buildSchedule(state) {
  const out = [];
  WARMUP.forEach((k, i) => out.push({ at: -70 + i * 5 + rint(state, 0, 3), case: k }));
  for (const [at, k] of SET_PIECES) out.push({ at, case: k });
  PER_HOUR.forEach((n, h) => {
    for (let i = 0; i < n; i += 1) {
      // first hour stays gentle: minor cases only, so the opening teaches placing and queues
      const k = weighted(state, (c) => (h === 0 ? CASES[c].esi >= 3 : true));
      out.push({ at: h * 60 + rint(state, 0, 59), case: k });
    }
  });
  for (const e of out) {
    const c = CASES[e.case];
    e.pre = c.via === 'ems' ? (c.prealert ? rint(state, 7, 10) : rint(state, 3, 5)) : 0;
  }
  return out.sort((a, b) => a.at - a.pre - (b.at - b.pre));
}

/** Inpatient beds that free up on their own overnight (very few do). [minute, kind] */
const BED_RELEASES = [[70, 'ward'], [130, 'icu'], [160, 'ward'], [250, 'icu'], [300, 'ward'], [340, 'ward'], [420, 'icu'], [500, 'ward'], [540, 'icu'], [570, 'psych'], [610, 'ward'], [660, 'icu']];

/* ---- sim ---- */
/* The simulation. One tick is one minute of the night.
 *
 * The rule that makes a hospital jam is the same rule that makes software deadlock:
 *   a care step starts only when EVERYTHING it needs is free at the same moment,
 *   and a patient keeps the place they are in until the next place is theirs.
 * The charge nurse never treats anyone. They decide who gets which bed, who goes
 * first, what is held back, who is called in, and when to swap. */





const CODE_MINUTES = 8;

function newShift(seed = 'HARBOURSIDE') {
  const state = {
    seed, rng: seedFrom(seed), t: -96, nextPid: 1, nextAlert: 1, over: false,
    units: buildUnits(), patients: {}, schedule: [], timers: [], alerts: [], log: [],
    stock: { ...START_STOCK }, phone: { stepdown: 7, discharge: 8, blood: false },
    called: {}, divertUntil: -1, divertReadyAt: 0, diverted: 0, gridlocks: [],
  };
  state.schedule = buildSchedule(state);
  for (const [at, kind] of BED_RELEASES) state.timers.push({ at, type: 'bedFree', kind });
  while (state.t < 0) { autopilot(state); tick(state); }   // the day shift hands over a working department
  state.alerts = [];
  return state;
}

const patientsOf = (state) => Object.values(state.patients);
const unitsOfKinds = (state, kinds) => Object.values(state.units).filter((u) => kinds.includes(u.kind));
const say = (state, pid, text, type = 'event') => state.log.push({ t: state.t, pid, type, text });
const note = (state, p, kind, author, text) => p.notes.push({ t: state.t, kind, author, text });

function alert(state, level, key, pid, title, text) {
  if (state.alerts.some((a) => a.key === key)) return;
  state.alerts.unshift({ id: state.nextAlert++, t: state.t, level, key, pid, title, text, ack: false });
  if (state.alerts.length > 80) state.alerts.length = 80;
}

/* ---------- resources ---------- */

function release(state, uid, pid) {
  const u = state.units[uid];
  if (u && u.holder === pid) u.holder = null;
}

/** ED bed kinds this patient may be placed in. Boarders may also go to the hallway. */
function allowedKinds(p) {
  const base = [...caseOf(p).bed];
  if (base.includes('acute') && !base.includes('resus')) base.push('resus');
  if (isBoarding(p) && !base.includes('hall')) base.push('hall');
  return base;
}

/** Try to take everything a step needs. Returns the units, or null and takes nothing. */
function tryAcquire(state, p, step) {
  if (!p.resume && step.blood && state.stock.prbc < step.blood) return null;
  const got = [];
  let skipPlace = p.preplaced && step.place;
  for (const need of step.needs) {
    const kinds = need.split('|');
    if (skipPlace && kinds.includes(step.place)) { skipPlace = false; continue; }
    const free = unitsOfKinds(state, kinds).filter((u) => !u.holder && !got.includes(u) && (!u.reservedFor || u.reservedFor === p.id));
    const u = free.find((x) => x.reservedFor === p.id) || free[0];
    if (!u) return null;
    got.push(u);
  }
  return got;
}

/** Why can this patient not move on? One entry per missing thing, with who holds it. */
function blockers(state, p) {
  if (p.status === 'expected') return [];
  if (p.status === 'waiting') return [{ need: 'bed', kinds: [], label: `No bed yet. Suitable: ${caseOf(p).bed.map((k) => KINDS[k].label.toLowerCase()).join(' or ')}`, holders: [], absent: false }];
  const step = stepOf(p);
  if (!step || p.stepState !== 'need') return [];
  const out = [], taken = [];
  let skipPlace = p.preplaced && step.place;
  for (const need of step.needs) {
    const kinds = need.split('|');
    if (skipPlace && kinds.includes(step.place)) { skipPlace = false; continue; }
    const all = unitsOfKinds(state, kinds);
    const u = all.find((x) => !x.holder && !taken.includes(x) && (!x.reservedFor || x.reservedFor === p.id));
    if (u) { taken.push(u); continue; }
    out.push({
      need, kinds, label: kinds.map((k) => KINDS[k].label).join(' or '), absent: all.length === 0,
      holders: all.map((x) => ({ unit: x.id, name: x.name, pid: x.holder === 'bg' ? null : x.holder, bg: x.holder === 'bg', reservedFor: x.holder ? null : x.reservedFor })),
    });
  }
  if (!p.resume && step.blood && state.stock.prbc < step.blood) out.push({ need: 'blood', kinds: [], label: `Red cells: needs ${step.blood} units, ${state.stock.prbc} in the fridge`, holders: [], absent: true });
  return out;
}

/* ---------- care steps ---------- */

function startStep(state, p, step, got) {
  const t = state.t, c = caseOf(p);
  for (const u of got) { u.holder = p.id; if (u.reservedFor === p.id) u.reservedFor = null; }
  const placeU = step.place ? got.find((u) => u.kind === step.place) : null;
  if (placeU) { release(state, p.loc, p.id); p.loc = placeU.id; }
  if (step.place) p.preplaced = false;
  p.using = got.filter((u) => u !== placeU).map((u) => u.id);
  for (const q of patientsOf(state)) {   // somebody who asked earlier for the same thing was passed over
    if (q !== p && q.status === 'active' && q.stepState === 'need' && !q.hold && q.reqAt < p.reqAt) {
      const qs = stepOf(q);
      if (qs && qs.needs.some((n) => got.some((u) => n.split('|').includes(u.kind)))) q.passed = (q.passed || 0) + 1;
    }
  }
  if (!p.resume) {
    const hall = state.units[p.loc] && state.units[p.loc].kind === 'hall';
    p.stepLeft = Math.round((step.dur || 0) * (hall ? 1.3 : 1));
    if (step.blood) state.stock.prbc -= step.blood;
    if (step.rate !== undefined) p.rate = step.rate;
    const doc = got.find((u) => ['md', 'pa', 'surg', 'cards', 'neuro', 'ob', 'gi', 'psy'].includes(u.kind));
    p.author = doc ? doc.name : (got.find((u) => u.kind === 'rn') || { name: 'ED nursing' }).name;
    if (p.seenAt === null && doc) p.seenAt = t;
    markClock(state, p, step, 'start');
    say(state, p.id, `${step.label} started`);
  }
  p.resume = false; p.passed = 0; p.stepState = 'run';
  if (p.stepLeft <= 0) finishStep(state, p);
}

function markClock(state, p, step, when) {
  for (const k of caseOf(p).clocks || []) {
    if (k.step !== step.key || (k.on || 'start') !== when || p.clocks[k.key].at !== null) continue;
    const took = state.t + (k.lead || 0) - p.arriveAt;
    p.clocks[k.key].at = took; p.clocks[k.key].met = took <= k.limit;
    if (!p.clocks[k.key].met) alert(state, 'warn', `clockmiss:${p.id}:${k.key}`, p.id, `${k.label} missed`, `${p.name}: ${took} min against a ${k.limit} min target.`);
  }
}

function finishStep(state, p) {
  const step = stepOf(p);
  for (const uid of p.using) release(state, uid, p.id);
  p.using = [];
  if (step.sev) p.sev = Math.max(0, p.sev + step.sev);
  if (step.note) note(state, p, step.place ? 'Procedure' : 'Provider', p.author, step.note);
  if (step.result) { p.results.push({ t: state.t, name: step.result[0], text: step.result[1] }); note(state, p, 'Result', step.result[0], step.result[1]); }
  markClock(state, p, step, 'end');
  if (step.end === 'admit') {
    state.units[p.loc].holder = 'bg';
    leave(state, p, 'admitted', `Admitted to ${state.units[p.loc].name}`);
  } else if (step.end === 'home') {
    release(state, p.loc, p.id);
    leave(state, p, 'home', 'Discharged home');
  } else { p.stepIdx += 1; p.stepState = 'need'; p.reqAt = state.t; }
}

function leave(state, p, status, text) {
  const c = caseOf(p);
  for (const u of Object.values(state.units)) if (u.reservedFor === p.id) u.reservedFor = null;
  for (const x of state.alerts) if (x.pid === p.id && !/^(death|lwbs|clockmiss)/.test(x.key)) x.ack = true;   // nothing left to act on
  p.dest = p.loc ? state.units[p.loc].name : null;
  p.status = status; p.leftAt = state.t; p.loc = null; p.using = [];
  if (status === 'died') p.outcome = { grade: 'died', text };
  else if (status === 'lwbs') p.outcome = { grade: 'harm', text: 'Left without being seen after a long wait.' };
  else {
    const missed = Object.values(p.clocks).some((k) => k.met === false);
    const bad = p.arrested || missed || p.peak >= 0.92;
    p.outcome = { grade: bad ? 'harm' : 'good', text: bad ? c.harm : c.good };
  }
  say(state, p.id, text, status);
}

function interrupt(state, q, why) {
  for (const uid of q.using) release(state, uid, q.id);
  q.using = []; q.stepState = 'need'; q.resume = true; q.stepLeft += 2;
  note(state, q, 'Nursing', 'ED nursing', `Care interrupted: ${why}. Step will resume when the team is back.`);
}

/* ---------- cardiac arrest ---------- */

function startArrest(state, p) {
  const step = stepOf(p);
  const stuck = blockers(state, p).map((b) => b.label).join('; ');
  p.why = p.status === 'waiting' ? 'Arrested without ever getting a bed.' : stuck ? `Arrested while waiting for: ${stuck}.` : 'Arrested during treatment.';
  p.arrest = { at: state.t, teamAt: null, team: [] };
  p.arrested = true;
  if (p.stepState === 'run' && step && step.place) p.arrest.teamAt = state.t;      // already surrounded by a team
  else if (p.stepState === 'run') interrupt(state, p, 'cardiac arrest');
  alert(state, 'crit', `code:${p.id}:${state.t}`, p.id, 'CODE BLUE', `${p.name}, ${p.loc ? state.units[p.loc].name : 'waiting room'}. Cardiac arrest.`);
  note(state, p, 'Nursing', 'ED nursing', 'Unresponsive, no pulse. CPR started. Code Blue called.');
  say(state, p.id, 'Cardiac arrest', 'code');
}

function codeTeam(state, p) {
  const team = [];
  for (const kind of ['md', 'rn']) {
    let u = unitsOfKinds(state, [kind]).find((x) => !x.holder);
    if (!u) {   // pull a team member off the least urgent patient
      const victims = patientsOf(state).filter((q) => q.status === 'active' && q.stepState === 'run' && !q.arrest && !stepOf(q).place && q.using.some((id) => state.units[id].kind === kind));
      victims.sort((a, b) => b.esi - a.esi);
      if (victims[0]) { interrupt(state, victims[0], `team pulled to the Code Blue for ${p.name}`); u = unitsOfKinds(state, [kind]).find((x) => !x.holder); }
    }
    if (!u) { for (const x of team) x.holder = null; return null; }
    u.holder = p.id; team.push(u);
  }
  return team.map((u) => u.id);
}

function codeTick(state, p) {
  const a = p.arrest, c = caseOf(p);
  if (a.teamAt === null) {
    const team = codeTeam(state, p);
    if (team) { a.teamAt = state.t; a.team = team; }
    else if (state.t - a.at >= 10) die(state, p, `Cardiac arrest. Nobody was free to run the code. ${p.why}`);
    return;
  }
  if (state.t - a.teamAt < CODE_MINUTES) return;
  for (const uid of a.team) release(state, uid, p.id);
  const chance = (c.arrestP ?? 0.3) * Math.max(0, 1 - 0.15 * (a.teamAt - a.at));
  if (rnd(state) < chance) {
    p.arrest = null; p.sev = 0.8; p.rate *= 0.6;
    note(state, p, 'Provider', 'Code team', 'Return of spontaneous circulation after 3 cycles of CPR and epinephrine 1 mg x2. Post-arrest care started.');
    alert(state, 'info', `rosc:${p.id}:${state.t}`, p.id, 'ROSC', `${p.name}: pulse back. Still critical.`);
    say(state, p.id, 'Return of spontaneous circulation', 'event');
  } else die(state, p, `Died after cardiac arrest. ${p.why}`);
}

function die(state, p, text) {
  for (const uid of [...p.using, ...(p.arrest ? p.arrest.team : [])]) release(state, uid, p.id);
  release(state, p.loc, p.id);
  p.arrest = null;
  note(state, p, 'Provider', 'Code team', 'Resuscitation stopped. Time of death recorded. Family informed.');
  alert(state, 'crit', `death:${p.id}`, p.id, 'Patient died', `${p.name}. ${text}`);
  leave(state, p, 'died', text);
}

/* ---------- the minute ---------- */

function arrivals(state) {
  const t = state.t;
  while (state.schedule.length && state.schedule[0].at - state.schedule[0].pre <= t) {
    const e = state.schedule.shift(), c = CASES[e.case];
    if (c.via === 'ems' && t < state.divertUntil) { state.diverted += 1; say(state, null, `Ambulance diverted to another hospital (${c.cc})`, 'divert'); continue; }
    const p = makePatient(state, e.case, e.at);
    state.patients[p.id] = p;
    if (c.via === 'house') {
      const u = unitsOfKinds(state, ['icu']).find((x) => x.holder === 'bg');
      if (!u) { delete state.patients[p.id]; continue; }
      u.holder = p.id; p.loc = u.id; p.status = 'active'; p.placedAt = t; p.arriveAt = t; p.reqAt = t; p.name += ' (ICU)';
      p.labs = c.labs.map((l) => ({ l, at: t + l[5] }));
      alert(state, 'crit', `house:${p.id}`, p.id, 'ICU: return to theatre', `${p.name} in ${u.name} is bleeding and needs an operating room.`);
    } else if (e.pre > 0) {
      p.status = 'expected';
      alert(state, c.prealert ? 'crit' : 'info', `pre:${p.id}`, p.id, c.prealert ? `${c.prealert} inbound` : 'Ambulance inbound', `ETA ${e.at - t} min. ${p.age} ${p.sex}, ${c.cc.toLowerCase()}.`);
    } else say(state, p.id, 'Walked in, triaged', 'arrive');
  }
  for (const p of patientsOf(state)) {
    if (p.status === 'expected' && t >= p.arriveAt) { p.status = 'waiting'; p.reqAt = t; say(state, p.id, 'Ambulance arrived', 'arrive'); for (const x of state.alerts) if (x.key === `pre:${p.id}`) x.ack = true; alert(state, p.esi <= 2 ? 'warn' : 'info', `door:${p.id}`, p.id, 'Ambulance at the door', `${p.name}, ESI ${p.esi}. Needs a bed.`); }
  }
}

function runTimers(state) {
  const due = state.timers.filter((x) => x.at <= state.t);
  state.timers = state.timers.filter((x) => x.at > state.t);
  for (const x of due) {
    if (x.type === 'bedFree') {
      const u = unitsOfKinds(state, [x.kind]).find((y) => y.holder === 'bg');
      if (u) { u.holder = null; alert(state, 'info', `free:${u.id}:${state.t}`, null, `${u.name} is free`, x.why || 'An inpatient was discharged.'); }
    } else if (x.type === 'arrive') {
      const u = ON_CALL[x.kind].unit();
      state.units[u.id] = u; state.called[x.kind].here = true;
      alert(state, 'info', `here:${x.kind}`, null, `${u.name} is in house`, ON_CALL[x.kind].label);
    } else if (x.type === 'blood') { state.stock.prbc += 6; state.phone.blood = false; alert(state, 'info', `blood:${state.t}`, null, 'Blood delivered', '6 units of red cells from the blood bank.'); }
  }
}

function physiology(state, p) {
  if (p.arrest) return codeTick(state, p);
  const c = caseOf(p);
  const hall = p.loc && state.units[p.loc].kind === 'hall';
  p.sev = Math.max(0, Math.min(c.cap ?? 1.05, p.sev + p.rate * (hall ? 1.2 : 1)));
  p.peak = Math.max(p.peak, p.sev);
  if (p.sev >= 1) startArrest(state, p);
}

function postLabs(state, p) {
  for (const x of p.labs) {
    if (x.done || x.at > state.t) continue;
    x.done = true;
    const [name, val, unit, , flag] = x.l;
    if (flag === 'HH' || flag === 'LL') alert(state, 'warn', `lab:${p.id}:${name}`, p.id, 'Critical result', `${p.name}: ${name} ${val} ${unit}`.trim());
  }
}

function watch(state) {
  const t = state.t;
  for (const p of patientsOf(state)) {
    if (!inDepartment(p)) continue;
    const c = caseOf(p);
    if (p.status === 'waiting' && c.patience && t - p.arriveAt > c.patience) { leave(state, p, 'lwbs', 'Left without being seen'); alert(state, 'warn', `lwbs:${p.id}`, p.id, 'Left without being seen', `${p.name} walked out after ${Math.round((t - p.arriveAt) / 60)} h in the waiting room.`); continue; }
    if (p.arrest) continue;
    const n = newsOf(p, t).score, band = n >= 7 ? 2 : n >= 5 ? 1 : 0;
    if (band > p.newsBand && (t - p.arriveAt > 3)) {
      const where = p.status === 'waiting' ? 'Waiting room' : state.units[p.loc].name;
      if (band === 2) alert(state, 'crit', `news7:${p.id}`, p.id, `Deteriorating: NEWS ${n}`, `${p.name}, ${where}. Emergency review needed.`);
      else if (p.status === 'waiting') alert(state, 'warn', `news5:${p.id}`, p.id, `Waiting room recheck: NEWS ${n}`, `${p.name} is getting worse while waiting.`);
    }
    p.newsBand = Math.max(p.newsBand, band);
    if (p.status === 'waiting' && p.esi <= 2 && t - Math.max(p.arriveAt, 0) >= 8) alert(state, 'warn', `nobed:${p.id}`, p.id, `ESI ${p.esi} without a bed`, `${p.name} has waited ${t - p.arriveAt} min.`);
    for (const k of c.clocks || []) {
      const ck = p.clocks[k.key];
      if (ck.at === null && t - p.arriveAt >= Math.round(k.limit * 0.7)) alert(state, 'warn', `clock:${p.id}:${k.key}`, p.id, `${k.label} at risk`, `${p.name}: ${t - p.arriveAt} of ${k.limit} min used.`);
    }
    if (p.status === 'active' && p.stepState === 'need' && !p.hold && (p.passed || 0) >= 3 && t - p.reqAt >= 40) alert(state, 'warn', `forgot:${p.id}:${p.stepIdx}`, p.id, 'Passed over', `${p.name} has waited ${t - p.reqAt} min while ${p.passed} others went ahead.`);
  }
  if (state.stock.prbc <= 2 && !state.phone.blood) alert(state, 'warn', `lowblood:${Math.floor(t / 30)}`, null, 'Blood fridge low', `${state.stock.prbc} units of red cells left. Phone the blood bank.`);
  state.gridlocks = findGridlocks(state);
  for (const cyc of state.gridlocks) {
    const names = cyc.map((id) => state.patients[id].name.split(',')[0]);
    alert(state, 'crit', `grid:${[...cyc].sort().join('-')}`, cyc[0], 'Gridlock', `${names.join(' and ')} each hold what the other needs. Nothing will move until you swap them.`);
  }
}

function tick(state) {
  if (state.over) return state;
  state.t += 1;
  runTimers(state);
  arrivals(state);
  for (const p of patientsOf(state)) if (inDepartment(p)) { physiology(state, p); if (inDepartment(p)) postLabs(state, p); }
  for (const p of patientsOf(state)) {
    if (p.status === 'active' && p.stepState === 'run' && !p.arrest) { p.stepLeft -= 1; if (p.stepLeft <= 0) finishStep(state, p); }
  }
  acquirePass(state);
  watch(state);
  if (state.t >= SHIFT_MINUTES) { state.over = true; say(state, null, 'Handover at 07:00', 'end'); }
  return state;
}

function acquirePass(state) {
  const queue = patientsOf(state).filter((p) => p.status === 'active' && p.stepState === 'need' && !p.hold && !p.arrest);
  queue.sort((a, b) => (b.prio - a.prio) || (a.reqAt - b.reqAt) || (a.id - b.id));
  for (const p of queue) {
    const step = stepOf(p);
    const got = step && tryAcquire(state, p, step);
    if (got) startStep(state, p, step, got);
  }
}

/* ---------- gridlock (the engineer's word: deadlock) ---------- */

/** Cycles of patients who each sit in the place the next one needs. [[pid, pid, ...]] */
function findGridlocks(state) {
  const waiting = patientsOf(state).filter((p) => p.status === 'active' && p.stepState === 'need' && !p.hold && !p.arrest);
  const edges = new Map();
  for (const p of waiting) {
    const step = stepOf(p);
    if (!step || !step.place || p.preplaced) continue;
    const b = blockers(state, p).find((x) => x.kinds.includes(step.place));
    if (!b || b.holders.some((h) => !h.pid && !h.bg)) continue;    // a free (reserved) unit: not stuck on people
    const targets = b.holders.filter((h) => h.pid && waiting.some((q) => q.id === h.pid && q.loc === h.unit)).map((h) => h.pid);
    const moving = b.holders.some((h) => h.pid && !targets.includes(h.pid));   // someone there is mid-treatment and will leave
    if (!moving && targets.length) edges.set(p.id, targets);
  }
  const cycles = [], seen = new Set();
  for (const start of edges.keys()) {
    const path = [start];
    const walk = (id) => {
      for (const nx of edges.get(id) || []) {
        if (nx === start) { const key = [...path].sort().join('-'); if (!seen.has(key)) { seen.add(key); cycles.push([...path]); } return true; }
        if (!path.includes(nx) && path.length < 5) { path.push(nx); if (walk(nx)) return true; path.pop(); }
      }
      return false;
    };
    walk(start);
  }
  return cycles;
}

/* ---------- what the charge nurse can do ---------- */

const fail = (msg) => ({ ok: false, msg });
const done = (msg) => ({ ok: true, msg });

function act(state, a) {
  const p = a.pid ? state.patients[a.pid] : null, t = state.t;
  switch (a.type) {
    case 'place': case 'move': {
      const u = state.units[a.unit];
      if (!p || !u || u.holder) return fail('That bed is not free.');
      if (u.reservedFor && u.reservedFor !== p.id) return fail(`${u.name} is reserved for ${state.patients[u.reservedFor].name}.`);
      if (!allowedKinds(p).includes(u.kind)) return fail(`${u.name} is not suitable for this patient.`);
      if (a.type === 'place') {
        if (p.status !== 'waiting') return fail('Patient is not waiting for a bed.');
        p.status = 'active'; p.placedAt = t; p.reqAt = t;
        for (const x of state.alerts) if (x.key === `door:${p.id}` || x.key === `nobed:${p.id}` || x.key === `news5:${p.id}`) x.ack = true;
        p.labs = caseOf(p).labs.map((l) => ({ l, at: t + l[5] }));
      } else {
        if (p.status !== 'active' || !p.loc || !KINDS[state.units[p.loc].kind].ed) return fail('Patient cannot be moved now.');
        if (p.stepState === 'run' && stepOf(p).needs.length) return fail('In the middle of a procedure. Wait until it ends.');
        release(state, p.loc, p.id);
      }
      u.holder = p.id; u.reservedFor = null; p.loc = u.id;
      note(state, p, 'Charge', 'J. Alvarez RN', `${a.type === 'place' ? 'Roomed in' : 'Moved to'} ${u.name}.`);
      say(state, p.id, `${a.type === 'place' ? 'Placed in' : 'Moved to'} ${u.name}`, 'charge');
      acquirePass(state);
      return done(`${p.name} is in ${u.name}.`);
    }
    case 'expedite': if (!p) return fail('No patient.'); p.prio = !p.prio; if (p.prio) say(state, p.id, 'Expedited: first in every queue', 'charge'); acquirePass(state); return done(p.prio ? `${p.name} goes first.` : 'Back to normal order.');
    case 'hold': if (!p) return fail('No patient.'); p.hold = !p.hold; if (p.hold) say(state, p.id, 'Held: will not claim the next step', 'charge'); acquirePass(state); return done(p.hold ? `${p.name} is on hold.` : 'Hold released.');
    case 'reserve': {
      const u = a.unit ? state.units[a.unit] : unitsOfKinds(state, [a.kind]).filter((x) => !x.reservedFor && x.holder !== 'bg').sort((x, y) => !!x.holder - !!y.holder)[0];
      if (!p || !u) return fail('Nothing to reserve.');
      if (u.reservedFor && u.reservedFor !== p.id) return fail(`${u.name} is already reserved.`);
      u.reservedFor = p.id; say(state, p.id, `${u.name} reserved`, 'charge');
      return done(`${u.name} is reserved for ${p.name}${u.holder ? ' as soon as it is free' : ''}.`);
    }
    case 'unreserve': { const u = state.units[a.unit]; if (u) u.reservedFor = null; acquirePass(state); return done('Reservation released.'); }
    case 'callIn': {
      const oc = ON_CALL[a.kind];
      if (!oc || state.called[a.kind]) return fail('Already called.');
      state.called[a.kind] = { at: t, eta: t + oc.eta, here: false };
      state.timers.push({ at: t + oc.eta, type: 'arrive', kind: a.kind });
      say(state, null, `Called in: ${oc.label}. In house at ${clock(t + oc.eta)}`, 'charge');
      return done(`${oc.label} called. Here in ${oc.eta} min.`);
    }
    case 'phone': {
      if (a.what === 'stepdown') {
        if (state.phone.stepdown <= 0) return fail('ICU has nobody else fit to step down tonight.');
        const w = unitsOfKinds(state, ['ward']).find((u) => !u.holder && !u.reservedFor);
        if (!w) return fail('ICU can step a patient down, but there is no free ward bed to send them to.');
        w.holder = 'bg'; state.phone.stepdown -= 1;
        state.timers.push({ at: t + 20, type: 'bedFree', kind: 'icu', why: 'ICU stepped a patient down to the ward.' });
        say(state, null, `ICU step-down arranged into ${w.name}`, 'charge');
        return done('ICU will step a patient down. Bed free in 20 min.');
      }
      if (a.what === 'discharge') {
        if (state.phone.discharge <= 0) return fail('No more ward patients can go home tonight.');
        state.phone.discharge -= 1;
        state.timers.push({ at: t + 30, type: 'bedFree', kind: 'ward', why: 'Bed management sent a ward patient home.' });
        say(state, null, 'Bed management: early ward discharge arranged', 'charge');
        return done('Ward discharge arranged. Bed free in 30 min.');
      }
      if (a.what === 'blood') {
        if (state.phone.blood) return fail('Blood is already on its way.');
        state.phone.blood = true; state.timers.push({ at: t + 15, type: 'blood' });
        return done('Blood bank sending 6 units. Here in 15 min.');
      }
      return fail('Unknown call.');
    }
    case 'divert': {
      if (t < state.divertUntil) { state.divertUntil = t; return done('Diversion lifted.'); }
      if (t < state.divertReadyAt) return fail(`Diversion cannot be called again before ${clock(state.divertReadyAt)}.`);
      state.divertUntil = t + 60; state.divertReadyAt = t + 180;
      say(state, null, 'Ambulance diversion declared for 60 min', 'charge');
      return done('On diversion for 60 min. Ambulances go elsewhere; walk-ins still come.');
    }
    case 'huddle': {
      const cyc = (a.pids || []).map((id) => state.patients[id]);
      const n = cyc.length;
      if (n < 2) return fail('Nothing to swap.');
      for (let i = 0; i < n; i += 1) {
        const s = stepOf(cyc[i]), nextLoc = state.units[cyc[(i + 1) % n].loc];
        if (!s || cyc[i].stepState !== 'need' || !nextLoc || s.place !== nextLoc.kind) return fail('The swap no longer lines up.');
      }
      const locs = cyc.map((q) => q.loc);
      cyc.forEach((q, i) => { q.loc = locs[(i + 1) % n]; state.units[q.loc].holder = q.id; q.preplaced = true; note(state, q, 'Charge', 'J. Alvarez RN', `Bed huddle: moved to ${state.units[q.loc].name} in a coordinated swap.`); });
      say(state, cyc[0].id, `Bed huddle: ${cyc.map((q) => q.name.split(',')[0]).join(' and ')} swapped in one move`, 'charge');
      acquirePass(state);
      return done('Swapped. Both can move on.');
    }
    case 'ack': { for (const x of state.alerts) if (a.id === 'all' || x.id === a.id) x.ack = true; return done(''); }
    default: return fail('Unknown action.');
  }
}

/** The moves that make sense for this patient right now, ready for buttons. */
function actionsFor(state, p) {
  const out = [], step = stepOf(p), block = blockers(state, p);
  const freeBeds = () => Object.values(state.units).filter((u) => KINDS[u.kind].ed && !u.holder && (!u.reservedFor || u.reservedFor === p.id) && allowedKinds(p).includes(u.kind));
  if (p.status === 'waiting') {
    out.push({ key: 'place', label: 'Assign bed', primary: true, choices: freeBeds().map((u) => ({ label: u.name, hint: KINDS[u.kind].label, action: { type: 'place', pid: p.id, unit: u.id } })), empty: 'No suitable bed is free. Move a boarder to the hallway or wait.' });
  }
  if (p.status === 'expected') {
    const beds = Object.values(state.units).filter((u) => caseOf(p).bed.includes(u.kind) && !u.reservedFor && u.holder !== 'bg');
    out.push({ key: 'reserveBed', label: 'Reserve a bed for arrival', primary: true, choices: beds.map((u) => ({ label: u.name, hint: u.holder ? `in use by ${state.patients[u.holder].name}` : 'free', action: { type: 'reserve', pid: p.id, unit: u.id } })), empty: 'No bed to reserve.' });
  }
  for (const cyc of state.gridlocks) if (cyc.includes(p.id)) out.push({ key: 'huddle', label: `Bed huddle: swap ${cyc.map((id) => state.patients[id].name.split(',')[0]).join(' and ')}`, primary: true, action: { type: 'huddle', pids: cyc } });
  // people and places the pathway will need that are not in the building or not free
  const ahead = caseOf(p).steps.slice(p.stepIdx).flatMap((s) => s.needs);
  for (const k of Object.keys(ON_CALL)) {
    if (k === 'rn' || state.called[k] || !ahead.some((n) => n.split('|').includes(k))) continue;
    if ((k === 'surg' || k === 'anes') && !block.some((b) => b.kinds.includes(k))) continue;
    out.push({ key: `call:${k}`, label: `Call in ${ON_CALL[k].label}`, hint: `${ON_CALL[k].eta} min`, primary: !unitsOfKinds(state, [k]).length, action: { type: 'callIn', kind: k } });
  }
  if (p.status === 'active') {
    for (const b of block) {
      if (b.kinds.includes('icu')) out.push({ key: 'stepdown', label: 'Phone ICU: step a patient down', hint: `${state.phone.stepdown} left`, action: { type: 'phone', what: 'stepdown' } });
      if (b.kinds.includes('ward')) out.push({ key: 'discharge', label: 'Phone bed management: send a ward patient home', hint: `${state.phone.discharge} left`, action: { type: 'phone', what: 'discharge' } });
      if (b.need === 'blood') out.push({ key: 'blood', label: 'Phone blood bank: 6 units', hint: '15 min', action: { type: 'phone', what: 'blood' } });
    }
    const next = p.stepState === 'need' ? step : caseOf(p).steps[p.stepIdx + 1];
    if (next) for (const need of next.needs) {
      const k = need.split('|')[0];
      if (KINDS[k].staff || !unitsOfKinds(state, [k]).length || unitsOfKinds(state, [k]).some((u) => u.reservedFor === p.id)) continue;
      out.push({ key: `res:${k}`, label: `Reserve ${KINDS[k].label.toLowerCase()}`, hint: 'kept for this patient', action: { type: 'reserve', pid: p.id, kind: k } });
    }
    out.push({ key: 'expedite', label: p.prio ? 'Stop expediting' : 'Expedite: first in every queue', on: p.prio, action: { type: 'expedite', pid: p.id } });
    out.push({ key: 'hold', label: p.hold ? 'Release hold' : 'Hold: do not claim the next step', on: p.hold, action: { type: 'hold', pid: p.id } });
    if (p.loc && KINDS[state.units[p.loc].kind].ed) out.push({ key: 'move', label: isBoarding(p) ? 'Move (board in hallway)' : 'Move to another bed', choices: freeBeds().map((u) => ({ label: u.name, hint: KINDS[u.kind].label, action: { type: 'move', pid: p.id, unit: u.id } })), empty: 'No other suitable bed is free.' });
  }
  return out;
}

/** Plays the obvious moves: sickest waiting patient into the best free bed. Used to warm the
 * department up before 19:00 and as the baseline in tests. */
function autopilot(state) {
  const waiting = patientsOf(state).filter((p) => p.status === 'waiting').sort((a, b) => a.esi - b.esi || a.arriveAt - b.arriveAt);
  for (const p of waiting) {
    for (const kind of allowedKinds(p)) {
      const u = unitsOfKinds(state, [kind]).find((x) => !x.holder && (!x.reservedFor || x.reservedFor === p.id));
      if (u) { act(state, { type: 'place', pid: p.id, unit: u.id }); break; }
    }
  }
}

/** Numbers for the header and the end-of-shift review. */
function summary(state) {
  const all = patientsOf(state).filter((p) => p.arriveAt >= -200 && p.status !== 'expected');
  const seen = all.filter((p) => p.seenAt !== null && p.arriveAt >= 0).map((p) => p.seenAt - p.arriveAt).sort((a, b) => a - b);
  const clocks = all.flatMap((p) => Object.values(p.clocks)).filter((k) => k.met !== null);
  const here = all.filter(inDepartment);
  return {
    census: here.filter((p) => p.status === 'active' && p.loc && KINDS[state.units[p.loc].kind].ed).length,
    edBeds: Object.values(state.units).filter((u) => KINDS[u.kind].ed).length,
    waiting: here.filter((p) => p.status === 'waiting').length,
    boarding: here.filter((p) => p.status === 'active' && isBoarding(p)).length,
    died: all.filter((p) => p.status === 'died').length,
    lwbs: all.filter((p) => p.status === 'lwbs').length,
    good: all.filter((p) => p.outcome && p.outcome.grade === 'good').length,
    harm: all.filter((p) => p.outcome && p.outcome.grade === 'harm').length,
    clocksMet: clocks.filter((k) => k.met).length, clocksTotal: clocks.length,
    doorToDoc: seen.length ? seen[Math.floor(seen.length / 2)] : 0,
    diverted: state.diverted,
  };
}


return { seedFrom, rnd, rint, pick, jitter, news2, KINDS, ON_CALL, buildUnits, START_STOCK, SHIFT_START, SHIFT_MINUTES, clock, hm, CASES, CASE_WEIGHTS, NAMES, makePatient, vitalsOf, newsOf, caseOf, stepOf, isBoarding, inDepartment, buildSchedule, BED_RELEASES, newShift, patientsOf, allowedKinds, blockers, tick, findGridlocks, act, actionsFor, autopilot, summary };
})();
</script>
<script>
/* The department behind the screen. A photograph of the floor, out of focus, with a live
 * layer of people on top of it. Nothing here affects the game.
 *
 *   .photo        the floor, once at mid blur and once at heavy blur for the near desk
 *   #mid          480x270 canvas: staff, gurneys and light, placed in photo coordinates
 *   #near         160x90 canvas: people crossing right in front of the camera
 *
 * The people who walk are cut out of the photograph itself, with feathered edges, so they
 * have real colour and light. Drawn figures looked like cartoons next to it.
 *
 * The low canvas resolutions are the depth of field: stretched to the window they are soft
 * for free. Lanes are the walkable parts of the photo, so people stay on the floor. */
const Backdrop = (() => {
  const PW = 1376, PH = 768;       // the photograph
  const OVER = 1.06;               // layers overscan the window so the sway never shows an edge
  const MIDW = 480, MIDH = 270, NEARW = 160, NEARH = 90;
  // [x, y, w, h] of people standing clear in the photograph
  const CUTOUTS = [[722, 278, 112, 244], [1150, 305, 112, 315], [205, 262, 112, 248], [535, 282, 106, 208], [798, 212, 40, 112], [648, 216, 48, 122], [895, 222, 44, 116]];
  const DOOR = [703, 232];
  const GLOWS = [[175, 224, '#58e08a'], [1262, 226, '#58e08a'], [350, 214, '#8fd0ff'], [1073, 178, '#ffffff']];

  // Where people can walk, in photo pixels. Left and right aisles are the parts the monitor leaves visible.
  const LANES = [
    { x0: -150, x1: 470, y0: 470, y1: 438 },
    { x0: -180, x1: 330, y0: 600, y1: 560 },
    { x0: 1500, x1: 980, y0: 455, y1: 400 },
    { x0: 1560, x1: 1120, y0: 610, y1: 560 },
    { x0: 170, x1: 620, y0: 362, y1: 356 },
    { x0: 1240, x1: 840, y0: 360, y1: 350 },
  ];

  let canvas, mc, nc, photos = [], W = 0, H = 0, sc = 1, px = 0, py = 0;
  let busy = 0.4, strobe = 0, code = 0, time = 0, prev = 0, nearIn = 3, stamp = 0;
  let walkers = [], nears = [], sprites = [];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const rand = (a, b) => a + Math.random() * (b - a);
  
  function fit() {
    W = innerWidth * OVER; H = innerHeight * OVER;
    sc = Math.max(W / PW, H / PH);
    px = (W - PW * sc) / 2; py = (H - PH * sc) / 2;
    if (canvas.mid.width !== MIDW) { canvas.mid.width = MIDW; canvas.mid.height = MIDH; canvas.near.width = NEARW; canvas.near.height = NEARH; }
  }
  // photo pixels -> mid canvas pixels
  const X = (x) => ((px + x * sc) / W) * MIDW;
  const Y = (y) => ((py + y * sc) / H) * MIDH;
  const S_ = (d) => ((d * sc) / W) * MIDW;
  const heightAt = (y) => 96 + Math.max(0, y - 330) * 0.78;   // figures grow as they come towards the camera

  function makeSprites(img) {
    sprites = CUTOUTS.map(([x, y, w, h]) => {
      const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
      const c = cv.getContext('2d');
      c.drawImage(img, x, y, w, h, 0, 0, w, h);
      // keep a soft body-shaped column, so the floor around the person falls away
      c.globalCompositeOperation = 'destination-in';
      c.filter = `blur(${Math.max(3, w * 0.09)}px)`;
      c.beginPath(); c.ellipse(w / 2, h * 0.11, w * 0.2, h * 0.1, 0, 0, 6.3); c.fill();
      c.beginPath(); c.ellipse(w / 2, h * 0.55, w * 0.36, h * 0.42, 0, 0, 6.3); c.fill();
      return cv;
    });
  }
  const person = () => ({ sprite: Math.floor(Math.random() * CUTOUTS.length), ph: rand(0, 6.28), flip: Math.random() < 0.5 });
  function spawn(opts = {}) {
    const lane = opts.lane ?? LANES[Math.floor(Math.random() * LANES.length)];
    const out = opts.out ?? Math.random() < 0.5;
    const speed = (opts.speed || rand(0.05, 0.1));
    walkers.push({ lane, u: out ? 1 : 0, dir: out ? -speed : speed, kind: opts.kind || 'walk', crew: opts.crew || [person()], ttl: 60, pause: !opts.kind && Math.random() < 0.25 ? rand(1.5, 5) : 0, pauseAt: rand(0.55, 0.95) });
  }

  function drawPerson(c, x, y, h, p, t, going) {
    if (!sprites.length) return;
    const sp = sprites[p.sprite], w = (sp.width / sp.height) * h, step = Math.sin(t * 7 + p.ph) * going;
    c.save();
    c.translate(x, y - Math.abs(step) * h * 0.014);
    c.rotate(step * 0.022);
    if (p.flip) c.scale(-1, 1);
    c.drawImage(sp, -w / 2, -h, w, h);
    c.restore();
  }
  function drawGurney(c, x, y, h, dirSign) {
    const len = h * 0.95, deck = y - h * 0.3;
    c.strokeStyle = '#8c949c'; c.lineWidth = h * 0.02;
    c.beginPath(); c.moveTo(x - len * 0.35, deck); c.lineTo(x - len * 0.35, y - 2); c.moveTo(x + len * 0.35, deck); c.lineTo(x + len * 0.35, y - 2); c.stroke();
    c.fillStyle = '#222a31'; c.beginPath(); c.arc(x - len * 0.35, y - 2, h * 0.025, 0, 6.3); c.arc(x + len * 0.35, y - 2, h * 0.025, 0, 6.3); c.fill();
    c.fillStyle = '#e4e8ea'; c.fillRect(x - len / 2, deck - h * 0.06, len, h * 0.075);    // mattress
    c.fillStyle = '#b8d0d8'; c.beginPath(); c.ellipse(x - dirSign * len * 0.08, deck - h * 0.08, len * 0.34, h * 0.06, 0, 0, 6.3); c.fill();   // blanket over the patient
    c.fillStyle = '#b9805a'; c.beginPath(); c.arc(x + dirSign * len * 0.38, deck - h * 0.1, h * 0.045, 0, 6.3); c.fill();
    c.strokeStyle = '#9aa4ad'; c.lineWidth = h * 0.012; c.beginPath(); c.moveTo(x + dirSign * len * 0.5, deck); c.lineTo(x + dirSign * len * 0.5, deck - h * 0.6); c.stroke();   // IV pole
    c.fillStyle = '#cfe6ee'; c.fillRect(x + dirSign * len * 0.5 - h * 0.03, deck - h * 0.6, h * 0.06, h * 0.09);
  }
  function drawCrashCart(c, x, y, h) {
    c.fillStyle = '#b12a2c'; c.fillRect(x - h * 0.15, y - h * 0.5, h * 0.3, h * 0.46);
    c.fillStyle = '#7d1c1e'; for (let i = 1; i < 4; i += 1) c.fillRect(x - h * 0.15, y - h * 0.5 + (i * h) / 8.4, h * 0.3, h * 0.012);
    c.fillStyle = '#20262c'; c.fillRect(x - h * 0.15, y - h * 0.04, h * 0.3, h * 0.04);
  }

  function drawMid(dt) {
    const c = mc;
    c.clearRect(0, 0, MIDW, MIDH);
    // furthest away first, so nearer people overlap
    walkers.sort((a, b) => laneY(a) - laneY(b));
    for (const w of walkers) {
      const y = laneY(w), x = w.lane.x0 + (w.lane.x1 - w.lane.x0) * w.u, h = S_(heightAt(y));
      const sx = X(x), sy = Y(y), going = w.pause > 0 && Math.abs(w.u - w.pauseAt) < 0.01 ? 0.1 : 1;
      c.fillStyle = 'rgba(8,12,16,.28)'; c.beginPath(); c.ellipse(sx, sy, h * (w.kind === 'walk' ? 0.2 : 0.6), h * 0.04, 0, 0, 6.3); c.fill();
      const dirSign = Math.sign((w.lane.x1 - w.lane.x0) * w.dir) || 1;
      if (w.kind === 'gurney') {
        drawGurney(c, sx, sy, h, dirSign);
        drawPerson(c, sx - dirSign * h * 0.68, sy, h, w.crew[0], time, going);
        if (w.crew[1]) drawPerson(c, sx + dirSign * h * 0.68, sy - 1, h, w.crew[1], time, going);
      } else if (w.kind === 'cart') {
        drawCrashCart(c, sx + dirSign * h * 0.34, sy, h);
        drawPerson(c, sx, sy, h, w.crew[0], time, going);
      } else {
        drawPerson(c, sx, sy, h, w.crew[0], time, going);
      }
    }
    // the small lit things in the room: bedside monitors, the odd lamp
    c.globalCompositeOperation = 'lighter';
    for (const [i, [gx, gy, col]] of GLOWS.entries()) {
      const a = 0.16 + 0.1 * Math.sin(time * (1.3 + i * 0.4) + i), r = S_(70);
      const g = c.createRadialGradient(X(gx), Y(gy), 0, X(gx), Y(gy), r);
      g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = a; c.fillStyle = g; c.fillRect(X(gx) - r, Y(gy) - r, r * 2, r * 2);
    }
    // ambulance lights thrown across the floor from the bay doors
    if (strobe > 0) {
      const beat = Math.floor(time * 3.2) % 2, flick = Math.sin(time * 26) > -0.2 ? 1 : 0.55;
      const dx = X(DOOR[0]), dy = Y(DOOR[1]), r = MIDW * 0.82;
      const g = c.createRadialGradient(dx, dy, 0, dx, dy, r);
      g.addColorStop(0, beat ? 'rgba(255,40,50,1)' : 'rgba(60,110,255,1)');
      g.addColorStop(0.5, beat ? 'rgba(160,20,40,.45)' : 'rgba(30,60,190,.45)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      c.globalAlpha = Math.min(1, strobe / 2) * 0.5 * flick; c.fillStyle = g; c.fillRect(0, 0, MIDW, MIDH);
    }
    if (code > 0) {
      c.globalAlpha = Math.min(1, code) * (0.1 + 0.09 * Math.sin(time * 6.2)); c.fillStyle = '#ff2436'; c.fillRect(0, 0, MIDW, MIDH);
    }
    c.globalAlpha = 1; c.globalCompositeOperation = 'source-over';
    strobe = Math.max(0, strobe - dt); code = Math.max(0, code - dt);
  }
  const laneY = (w) => w.lane.y0 + (w.lane.y1 - w.lane.y0) * w.u;

  function drawNear(dt) {
    const c = nc;
    c.clearRect(0, 0, NEARW, NEARH);
    if (sprites.length) for (const n of nears) {
      n.x += n.v * dt;
      const sp = sprites[n.sprite], w = (sp.width / sp.height) * n.h;
      c.drawImage(sp, n.x - w / 2, NEARH - n.h * 0.72, w, n.h);
    }
    nears = nears.filter((n) => n.x > -60 && n.x < NEARW + 60);
    nearIn -= dt;
    if (nearIn <= 0) {
      const fromLeft = Math.random() < 0.5, hurry = code > 0 ? 2.2 : 1;
      nears.push({ x: fromLeft ? -40 : NEARW + 40, v: (fromLeft ? 1 : -1) * rand(26, 46) * hurry, h: rand(120, 170), sprite: Math.floor(Math.random() * 4) });
      nearIn = (code > 0 ? rand(0.6, 1.4) : rand(5, 13)) / (0.6 + busy);
    }
  }

  function advance(dt) {
    const want = Math.round(6 + busy * 12);
    if (walkers.length < want && Math.random() < dt * 2) spawn();
    for (const w of walkers) {
      if (w.pause > 0 && Math.abs(w.u - w.pauseAt) < 0.01) { w.pause -= dt; continue; }
      w.u += w.dir * dt;
    }
    walkers = walkers.filter((w) => w.u >= -0.02 && w.u <= 1.02);
  }

  function frame(ms) {
    requestAnimationFrame(frame);
    if (innerWidth < 1000 || innerHeight <= 520) return;   // the app covers the room at these sizes
    if (ms - stamp < 33) return;                           // 30 fps is plenty for something this far out of focus
    const dt = Math.min(0.1, (ms - prev) / 1000 || 0.03); prev = ms; stamp = ms; time += dt;
    advance(dt); drawMid(dt); drawNear(dt);
    // a little handheld drift, like a camera on someone's shoulder
    const sx = Math.sin(time * 0.31) * 5 + Math.sin(time * 0.83) * 2, sy = Math.cos(time * 0.23) * 3 + Math.sin(time * 0.71) * 1.4;
    canvas.scene.style.transform = `translate(${sx.toFixed(2)}px,${sy.toFixed(2)}px)`;
    canvas.near.style.transform = `translate(${(sx * 2.4).toFixed(2)}px,${(sy * 2.4).toFixed(2)}px)`;
  }

  return {
    start(root) {
      canvas = { mid: root.querySelector('#mid'), near: root.querySelector('#near'), scene: root.querySelector('#scene') };
      mc = canvas.mid.getContext('2d'); nc = canvas.near.getContext('2d');
      photos = [...root.querySelectorAll('.photo')];
      fit(); addEventListener('resize', fit);
      if (still) { canvas.mid.remove(); canvas.near.remove(); return; }
      const src = getComputedStyle(photos[0]).backgroundImage.slice(5, -2), img = new Image();
      img.onload = () => makeSprites(img); img.src = src;
      for (let i = 0; i < 8; i += 1) { spawn(); walkers[i].u = rand(0.05, 0.95); }
      requestAnimationFrame(frame);
    },
    ambulance() {
      if (still || !walkers) return;
      strobe = 12;
      for (const lane of [LANES[0], LANES[2]]) spawn({ lane, out: false, kind: 'gurney', speed: 0.16, crew: [person(), person()] });
    },
    codeBlue() {
      if (still) return;
      code = 10; nearIn = 0.3;
      for (const lane of [LANES[0], LANES[1], LANES[2], LANES[3]]) spawn({ lane, out: false, speed: 0.34, crew: [person()] });
      spawn({ lane: LANES[0], out: false, kind: 'cart', speed: 0.3, crew: [person()] });
      spawn({ lane: LANES[2], out: false, kind: 'cart', speed: 0.3, crew: [person()] });
    },
    setBusy(v) { busy = Math.max(0, Math.min(1, v)); },
  };
})();

/* Bedside monitor traces. Every <canvas data-wave="ecg|pleth|resp"> on the page is
 * redrawn each frame from the values in its data attributes, so the app can rebuild
 * its HTML freely and the traces keep scrolling without a flicker.
 * Shapes are synthesized from the patient's actual rate and rhythm:
 *   sinus  P wave, narrow QRS, T wave
 *   stemi  the same with the ST segment lifted into the T wave
 *   af     no P waves, irregular R-R intervals, fibrillating baseline
 *   vf     chaotic, no complexes (cardiac arrest) */
const Waves = (() => {
  const gauss = (x, mu, sd) => Math.exp(-((x - mu) ** 2) / (2 * sd * sd));
  const hash = (n) => { const s = Math.sin(n * 127.1) * 43758.5453; return s - Math.floor(s); };

  function ecg(time, hr, rhythm) {
    if (rhythm === 'vf' || hr <= 0) return 0.32 * Math.sin(time * 31) * Math.sin(time * 7.3) + 0.2 * Math.sin(time * 19.7 + 1) + 0.1 * Math.sin(time * 47);
    const beats = (time * hr) / 60 + 1000, n = Math.floor(beats); let ph = beats - n;
    if (rhythm === 'af') { ph = Math.min(0.999, ph * (0.78 + 0.5 * hash(n))); }
    let y = 0;
    if (rhythm !== 'af') y += 0.12 * gauss(ph, 0.14, 0.025); else y += 0.035 * Math.sin(time * 41) + 0.025 * Math.sin(time * 67);
    y += -0.1 * gauss(ph, 0.255, 0.008) + 1.0 * gauss(ph, 0.28, 0.011) - 0.24 * gauss(ph, 0.305, 0.01);
    y += 0.28 * gauss(ph, 0.5, 0.05);
    if (rhythm === 'stemi') y += 0.3 * (1 / (1 + Math.exp(-(ph - 0.315) * 220))) * (1 / (1 + Math.exp((ph - 0.5) * 40)));
    return y;
  }
  function pleth(time, hr, spo2) {
    if (hr <= 0) return 0.02 * Math.sin(time * 9);
    const ph = ((((time * hr) / 60 + 0.22) % 1) + 1) % 1, amp = Math.max(0.25, (spo2 - 60) / 40);
    return amp * (gauss(ph, 0.2, 0.09) + 0.42 * gauss(ph, 0.45, 0.11));
  }
  const resp = (time, rr) => (rr <= 0 ? 0 : 0.5 + 0.5 * Math.sin((time * rr * Math.PI * 2) / 60));

  function draw(cv, now) {
    const w = cv.clientWidth, h = cv.clientHeight;
    if (!w) return;
    if (cv.width !== w * 2) { cv.width = w * 2; cv.height = h * 2; }
    const c = cv.getContext('2d'), d = cv.dataset, kind = d.wave;
    const hr = +d.hr, rr = +d.rr, spo2 = +d.spo2, secs = +(d.secs || 6);
    c.clearRect(0, 0, cv.width, cv.height);
    c.strokeStyle = kind === 'ecg' ? '#4dff5e' : kind === 'pleth' ? '#45d7ff' : '#ffe14d';
    c.lineWidth = 2.4; c.lineJoin = 'round'; c.beginPath();
    const W2 = cv.width, H2 = cv.height;
    for (let x = 0; x < W2; x += 2) {
      const time = now - ((W2 - x) / W2) * secs;
      let v;
      if (kind === 'ecg') v = 0.72 - ecg(time, hr, d.rhythm) * 0.56;
      else if (kind === 'pleth') v = 0.86 - pleth(time, hr, spo2) * 0.7;
      else v = 0.85 - resp(time, rr) * 0.7;
      const y = v * H2;
      if (x === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.stroke();
  }
  function loop(ms) {
    const now = ms / 1000;
    for (const cv of document.querySelectorAll('canvas[data-wave]')) draw(cv, now);
    requestAnimationFrame(loop);
  }
  return { start() { requestAnimationFrame(loop); } };
})();

/* The in-game manual. HANDBOOK is compiled by build.mjs from docs/HANDBOOK.md, the case book and
 * the Guide Mode text. This file only draws it: sidebar (chips on a phone), article and search. */
const Handbook = (() => {
  let el, nav, main, input, cur = null, opened = false, prevFocus = null;
  const sections = HANDBOOK.sections;
  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));

  function drawNav() { nav.innerHTML = sections.map((s) => `<button data-ui="hb:${s.id}" class="${s.id === cur ? 'on' : ''}">${esc(s.title)}</button>`).join(''); }
  function show(id) {
    const s = sections.find((x) => x.id === id) || sections[0];
    cur = s.id; input.value = '';
    main.innerHTML = `<article class="prose">${s.html}</article>`;
    main.scrollTop = 0;
    drawNav();
    const b = nav.querySelector('.on'); if (b) b.scrollIntoView({ block: 'nearest', inline: 'center' });
  }
  function search(q) {
    q = q.trim();
    if (q.length < 2) { show(cur); return; }
    const low = q.toLowerCase(), mark = (t) => t.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig'), (m) => `<mark>${m}</mark>`);
    const hits = sections.filter((s) => s.text.toLowerCase().includes(low));
    main.innerHTML = `<div class="prose"><h1>Search: ${esc(q)}</h1>${hits.map((s) => {
      const i = s.text.toLowerCase().indexOf(low), from = Math.max(0, i - 70);
      return `<button class="hb-hit" data-ui="hb:${s.id}"><b>${esc(s.title)}</b><small>${mark(esc(s.text.slice(from, i + q.length + 90)))}</small></button>`;
    }).join('') || '<p>Nothing found. Try a simpler word.</p>'}</div>`;
    main.scrollTop = 0;
  }
  function open(id) {
    prevFocus = document.activeElement;
    opened = true; el.classList.add('open');
    show(id || cur || 'start');
    if (matchMedia('(hover: hover)').matches) input.focus({ preventScroll: true });
  }
  function close() {
    opened = false; el.classList.remove('open');
    if (prevFocus && prevFocus.focus) prevFocus.focus({ preventScroll: true });
  }
  return {
    init(api) {
      el = document.getElementById('handbook');
      el.innerHTML = `<div class="hb-top"><b>Night Shift Handbook</b><input type="search" placeholder="Search the handbook" aria-label="Search the handbook"><button data-ui="hbx:1">Back to the game</button></div><div class="hb-wrap"><nav class="hb-nav" aria-label="Sections"></nav><div class="hb-main"></div></div>`;
      nav = el.querySelector('.hb-nav'); main = el.querySelector('.hb-main'); input = el.querySelector('input');
      input.addEventListener('input', () => search(input.value));
      api.on('hb', (v) => open(v));
      api.on('hbx', () => close());
    },
    open, close,
    isOpen: () => opened,
  };
})();

/* Guide Mode: while it is on, the clock stops and every tagged element (data-g) explains itself.
 * Mouse: hover shows a popover next to the element, and clicks still work.
 * Touch: a tap opens a bottom sheet instead of acting, with a button to do the thing anyway.
 * Keyboard: focus shows the same popover. */
const Guide = (() => {
  let api, layer, hl, tip, bar;
  let at = null, shown = '', tap = null, sheet = false;
  const touchOnly = matchMedia('(hover: none)').matches;
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const on = () => api.ui.guide;

  function entryHtml(el) {
    const key = el.dataset.g, e = GUIDE[key];
    if (!e) return '';
    const [where, title, what, todo] = e;
    const now = el.dataset.gl || api.liveFor(key, el.dataset.gp);
    return `<div class="crumb">${esc(where)}</div><h5>${esc(title)}</h5><p>${esc(what)}</p>${todo ? `<p class="todo"><b>What to do:</b> ${esc(todo)}</p>` : ''}${now ? `<p class="now">${esc(now)}</p>` : ''}`;
  }
  function paint(el) {
    if (!el || !GUIDE[el.dataset.g]) { hide(); return; }
    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) { hide(); return; }
    hl.style.cssText = `display:block;left:${r.left - 2}px;top:${r.top - 2}px;width:${r.width + 4}px;height:${r.height + 4}px`;
    const html = `${entryHtml(el)}<p class="more">Press H to read more in the handbook.</p>`;
    if (html !== shown) { tip.innerHTML = html; shown = html; }
    tip.classList.remove('sheet');
    tip.style.display = 'block';
    const w = tip.offsetWidth, h = tip.offsetHeight, vw = innerWidth, vh = innerHeight, gap = 10;
    let x = r.left, y = r.bottom + gap;
    if (y + h > vh - 8) y = r.top - h - gap;
    if (y < 8) { y = Math.min(vh - h - 8, Math.max(8, r.top)); x = r.right + gap; if (x + w > vw - 8) x = r.left - w - gap; }
    tip.style.left = `${Math.max(8, Math.min(vw - w - 8, x))}px`;
    tip.style.top = `${Math.max(8, Math.min(vh - h - 8, y))}px`;
  }
  function hide() { hl.style.display = 'none'; tip.style.display = 'none'; tip.classList.remove('sheet'); sheet = false; shown = ''; }
  function underPointer() {
    if (!at) return null;
    const el = document.elementFromPoint(at.x, at.y);
    return el && !el.closest('#gtip, #gbar') ? el.closest('[data-g]') : null;
  }
  function openSheet(el, press) {
    const r = el.getBoundingClientRect();
    hl.style.cssText = `display:block;left:${r.left - 2}px;top:${r.top - 2}px;width:${r.width + 4}px;height:${r.height + 4}px`;
    const canUse = press.act || press.ui;
    tip.innerHTML = `${entryHtml(el)}<div class="sheet-acts">${canUse ? '<button data-ui="gd:do">Use this control</button>' : ''}<button data-ui="gd:book">Read more</button><button data-ui="gd:close">Close</button></div>`;
    tip.style.cssText = 'display:block';
    tip.classList.add('sheet');
    shown = ''; sheet = true; tap = press; tap.topic = (GUIDE[el.dataset.g] || [])[4];
  }
  function toggle() {
    api.ui.guide = !api.ui.guide;
    document.body.classList.toggle('guide', api.ui.guide);
    bar.style.display = api.ui.guide ? 'flex' : 'none';
    if (!api.ui.guide) { hide(); at = null; }
    api.render();
  }
  return {
    init(a) {
      api = a; layer = document.getElementById('guide-layer');
      layer.innerHTML = `<div id="ghl"></div><div id="gtip" role="tooltip"></div><div id="gbar" style="display:none"><span>Guide Mode. ${touchOnly ? 'Tap' : 'Point at'} anything. The clock is stopped.</span><button data-ui="guide:1">Exit</button></div>`;
      hl = layer.querySelector('#ghl'); tip = layer.querySelector('#gtip'); bar = layer.querySelector('#gbar');
      document.addEventListener('pointermove', (ev) => {
        if (!on() || ev.pointerType !== 'mouse') return;
        at = { x: ev.clientX, y: ev.clientY };
        paint(ev.target.closest && !ev.target.closest('#gtip, #gbar') ? ev.target.closest('[data-g]') : null);
      }, { passive: true });
      document.addEventListener('focusin', (ev) => { if (on() && !sheet && ev.target.matches('[data-g]')) { at = null; paint(ev.target); } });
      api.on('gd', (v) => {
        const t = tap; hide(); tap = null;
        if (v === 'do' && t) api.dispatch(t.act, t.ui, t.outside);
        if (v === 'book' && t) Handbook.open(t.topic);
      });
    },
    toggle,
    refresh() { if (!on() || sheet) return; if (at) paint(underPointer()); },
    /* A tap in Guide Mode explains instead of acting. Returns true if it used up the tap. */
    captureTap(press) {
      if (!on() || press.target.closest('#gtip, #gbar, #handbook')) return false;
      if (press.guideEl && press.guideEl.dataset.g === 'tool.guide') return false;
      if (press.guideEl && GUIDE[press.guideEl.dataset.g]) { openSheet(press.guideEl, press); return true; }
      hide(); return true;
    },
    openTopic() {
      const el = underPointer() || document.activeElement;
      const e = el && el.dataset && GUIDE[el.dataset.g];
      Handbook.open(e ? e[4] : 'controls');
    },
  };
})();

/* Orientation: a spotlight tour of the real screen, on a practice night that is thrown away
 * afterwards. A shift already in progress is set aside and comes back untouched.
 *
 * A step is { ch, gk | t+b, target, before(), do: { text, ok, check(), allow, run } }.
 *   gk      borrow the title, text and target from the Guide Mode entry of that name
 *   target  CSS selector, or several joined by commas: the spotlight covers all of them
 *   before  put the screen in the state this step talks about. Must be safe to run twice.
 *   do      the player has to do something real. Next unlocks when check() is true.
 *           run: true lets the clock run, and it stops by itself once check() passes.
 * A target that is not on screen at this window size just shows the card in the middle. */
const Tutorial = (() => {
  const CH = ['The job', 'The screen', 'One patient', 'Your first patients', 'The other screens', 'The desk', 'When it jams'];
  const KEY = 'night-shift.orientation';
  const store = { get() { try { return +localStorage.getItem(KEY) || 0; } catch { return 0; } }, set(v) { try { localStorage.setItem(KEY, String(v)); } catch { /* private window */ } } };
  let api, hole, card, on = false, i = 0, setAside = null, menu = false, wasDone = null, lastKey = '';
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const G = (k) => `[data-g="${k}"]`;

  /* ---- the practice night's cast ---- */
  const ps = () => api.E.patientsOf(api.S);
  const stemi = () => ps().find((p) => p.case === 'stemi');
  const stuck = () => ps().find((p) => p.status === 'active' && p.stepState === 'need' && api.E.KINDS[api.kindOf(p)].ed && !api.E.isBoarding(p)) || ps().find((p) => p.status === 'active');
  let walkInId = null;
  const walkIn = () => { const w = ps().find((p) => p.id === walkInId); if (w) return w; const n = ps().filter((p) => p.status === 'waiting' && p.esi >= 3 && p.case !== 'stemi').sort((a, b) => b.esi - a.esi)[0]; walkInId = n ? n.id : null; return n; };
  const walker = () => ps().find((p) => p.id === walkInId);

  /* ---- what each step needs on screen ---- */

  const usable = (n) => !STEPS[n].skip || !STEPS[n].skip();
  const step = () => STEPS[i];
  const textOf = (s) => {
    const g = s.gk ? GUIDE[s.gk] : null;
    return { title: s.t || (g ? g[1] : ''), body: s.b || (g ? g[2] : ''), todo: s.b || !g ? '' : g[3] };
  };
  const selectorOf = (s) => (s.target !== undefined ? s.target : s.gk ? G(s.gk) : '');
  const done = () => !!step().do && !!step().do.check();
  const canNext = () => !step().do || done();

  function rectOf(sel) {
    if (!sel) return null;
    let l = 1e9, t = 1e9, r = -1e9, b = -1e9, n = 0;
    const screenR = { w: innerWidth, h: innerHeight };
    for (const el of document.querySelectorAll(sel)) {
      const q = el.getBoundingClientRect();
      if (q.width < 2 || q.height < 2 || q.right < 0 || q.bottom < 0 || q.left > screenR.w || q.top > screenR.h) continue;
      l = Math.min(l, q.left); t = Math.min(t, q.top); r = Math.max(r, q.right); b = Math.max(b, q.bottom); n += 1;
    }
    return n ? { l, t, r, b, w: r - l, h: b - t } : null;
  }
  function drawCard() {
    const s = step(), x = textOf(s), total = STEPS.length, d = s.do;
    const stepsInCh = STEPS.filter((q) => q.ch === s.ch), nth = stepsInCh.indexOf(s) + 1;
    card.innerHTML = `<div class="ch"><span>${s.ch + 1} of ${CH.length} &middot; ${esc(CH[s.ch])} &middot; ${nth}/${stepsInCh.length}</span><button data-ui="tut:menu">${menu ? 'Close' : 'Chapters'}</button></div>
      ${menu ? `<div id="tut-menu">${CH.map((c, n) => `<button data-ui="tut:ch${n}" class="${n === s.ch ? 'on' : ''}">${n + 1}. ${esc(c)}</button>`).join('')}</div>` : ''}
      <h5>${esc(x.title)}</h5>${s.html ? s.html() : ''}<p>${x.body}</p>${x.todo ? `<p class="todo"><b>What to do:</b> ${esc(x.todo)}</p>` : ''}
      ${selectorOf(s) && !rectOf(selectorOf(s)) ? '<p class="nofit">Your screen is too small to show this part. It appears on a wider screen.</p>' : ''}
      ${d ? `<div class="do ${done() ? 'ok' : ''}">${done() ? `&#10003; ${esc(d.ok)}` : esc(d.text)}</div>` : ''}
      <div class="bar"><i style="width:${((i + 1) / total) * 100}%"></i></div>
      <div class="nav"><button data-ui="tut:exit">Exit</button><span class="sp">${i + 1} / ${total}</span><button data-ui="tut:back" ${i ? '' : 'disabled'}>Back</button><button class="next" data-ui="tut:next" ${canNext() ? '' : 'disabled'}>${s.last ? (setAside ? 'Back to your shift' : 'Take handover') : 'Next'}</button></div>`;
  }
  function layout() {
    const s = step(), sel = selectorOf(s), r = rectOf(sel);
    hole.classList.toggle('none', !r);
    if (r) { const pad = 4; hole.style.left = `${r.l - pad}px`; hole.style.top = `${r.t - pad}px`; hole.style.width = `${r.w + pad * 2}px`; hole.style.height = `${r.h + pad * 2}px`; }
    card.classList.remove('dock-top');
    if (U().isPhone) { if (r && r.t + r.h / 2 > innerHeight * 0.48) card.classList.add('dock-top'); card.style.left = ''; card.style.top = ''; return; }
    const w = card.offsetWidth, h = card.offsetHeight, vw = innerWidth, vh = innerHeight, gap = 14;
    let x, y;
    if (!r) { x = (vw - w) / 2; y = (vh - h) * 0.4; }
    else if (r.b + gap + h < vh - 8) { x = r.l; y = r.b + gap; }
    else if (r.t - gap - h > 8) { x = r.l; y = r.t - gap - h; }
    else if (r.r + gap + w < vw - 8) { x = r.r + gap; y = r.t; }
    else if (r.l - gap - w > 8) { x = r.l - gap - w; y = r.t; }
    else { x = vw - w - 16; y = vh - h - 16; }
    card.style.left = `${Math.max(8, Math.min(vw - w - 8, x))}px`;
    card.style.top = `${Math.max(8, Math.min(vh - h - 8, y))}px`;
  }
  function enter(n, dir = 1) {
    while (n >= 0 && n < STEPS.length && !usable(n)) n += dir;
    if (n < 0 || n >= STEPS.length) return;
    i = n; menu = false; U().speed = 0;
    const s = step();
    if (s.before) s.before();
    wasDone = null; lastKey = '';
    store.set(s.ch);
    api.render();
    const first = selectorOf(s) && document.querySelector(selectorOf(s).split(',')[0]);
    if (first && first.scrollIntoView) first.scrollIntoView({ block: U().isPhone ? 'start' : 'nearest', inline: 'nearest' });
    drawCard(); layout();
    setTimeout(() => { if (on) layout(); }, 240);   // once the spotlight and any scrolling have settled
  }
  function next() { if (!canNext()) return; if (step().last) finish(true); else enter(i + 1, 1); }
  function finish(completed) {
    on = false; U().speed = 0;
    hole.style.display = 'none'; card.style.display = 'none';
    store.set(0);
    if (setAside) { const s = setAside; setAside = null; api.setShift(s); api.finishOrientation(true); return; }
    if (completed) api.startRealShift();
    else { api.setShift(api.E.newShift(new URLSearchParams(location.search).get('seed') || 'HARBOURSIDE')); api.finishOrientation(false); }
  }
  function begin() {
    if (api.ui.guide) Guide.toggle();
    setAside = api.ui.started ? api.S : null;
    api.setShift(api.E.newShift('ORIENTATION'));
    api.tick(5);
    walkInId = null;
    on = true; hole.style.display = 'block'; card.style.display = 'block';
    const ch = store.get();
    enter(ch ? STEPS.findIndex((s) => s.ch === ch) : 0);
  }
  return {
    init(a) {
      api = a;
      const layer = document.getElementById('tut-layer');
      layer.innerHTML = '<div id="tut-hole" style="display:none"></div><div id="tut-card" style="display:none" role="dialog" aria-label="Orientation"></div>';
      hole = layer.querySelector('#tut-hole'); card = layer.querySelector('#tut-card');
      api.on('tut', (v) => {
        if (v === 'next') next();
        else if (v === 'back') enter(i - 1, -1);
        else if (v === 'exit') finish(false);
        else if (v === 'menu') { menu = !menu; drawCard(); layout(); }
        else if (v.startsWith('ch')) { menu = false; enter(STEPS.findIndex((s) => s.ch === +v.slice(2))); }
      });
    },
    begin,
    active: () => on,
    saved: () => store.get() > 0,
    allows(target) {
      if (!on) return true;
      if (target.closest('#tut-card, #handbook')) return true;
      const s = step();
      if (!s.do || done()) return false;
      return !!target.closest(s.do.allow || selectorOf(s));
    },
    refresh() {
      if (!on) return;
      const s = step(), d = !!s.do && done(), key = `${s.do ? s.do.text : ''}${d}`;
      if (s.do && s.do.run && d && U().speed) U().speed = 0;
      if (key !== lastKey || d !== wasDone) { wasDone = d; lastKey = key; drawCard(); }
      layout();
    },
    key(ev) {
      if (!on || Handbook.isOpen()) return false;
      if (ev.key === 'ArrowRight' || (ev.key === 'Enter' && !ev.target.closest('button'))) next();
      else if (ev.key === 'ArrowLeft') enter(i - 1, -1);
      else if (ev.key === 'Escape') finish(false);
      else if (ev.key === '?') return false;
      return true;
    },
  };
})();

/* PULSE ED: the charge nurse's screen, plus the desk around it.
 * The engine owns every rule. This file only draws state and forwards clicks. */
const App = (() => {
  const E = Engine;
  const seed = new URLSearchParams(location.search).get('seed') || 'HARBOURSIDE';
  let S = E.newShift(seed);
  const phoneQuery = matchMedia('(max-width: 719px), (max-height: 520px)');
  const ui = { sel: null, view: 'all', tab: 'overview', speed: 0, menu: null, open: null, toast: null, lens: false, intro: true, phone: false, logSeen: S.log.length, sheet: false, guide: false, started: false, isPhone: phoneQuery.matches };
  const LENS = { grid: 'deadlock', forgot: 'starvation', news5: 'priority inversion', nobed: 'priority inversion', code: 'preemption', clock: 'deadline', lowblood: 'resource exhaustion' };

  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  const act = (o) => `data-act="${esc(JSON.stringify(o))}"`;
  const set = (k, v) => `data-ui="${k}:${v}"`;
  const g = (key, pid, live) => ` data-g="${key}"${pid != null ? ` data-gp="${pid}"` : ''}${live ? ` data-gl="${esc(live)}"` : ''}`;
  const hm = (m) => `${Math.floor(Math.max(0, m) / 60)}:${String(Math.max(0, m) % 60).padStart(2, '0')}`;
  const last = (name) => name.split(',')[0];
  const low = (label) => label.replace(/^[A-Z][a-z]/, (m) => m.toLowerCase());   // keeps ED, ICU, CT, IM as written
  const P = (id) => S.patients[id];
  const unitOrder = Object.keys(S.units);
  const kindOf = (p) => (p.loc ? S.units[p.loc].kind : null);

  /* ---------- reading a patient ---------- */
  function describe(q) {
    if (q.arrest) return `${q.name} (Code Blue)`;
    const st = E.stepOf(q);
    if (q.stepState === 'run') return `${q.name} (${low(st.label)}, ${q.stepLeft} min left)`;
    const b = E.blockers(S, q)[0];
    return `${q.name}, who is waiting for ${b ? low(b.label) : 'the next step'}`;
  }
  function explain(b) {
    if (b.need === 'bed' || b.need === 'blood') return b.label + '.';
    if (b.absent) {
      const k = b.kinds.find((x) => S.called[x]);
      return `${b.label}: nobody in the building. ${k ? `Called in, here at ${E.clock(S.called[k].eta)}.` : 'Call them in.'}`;
    }
    const held = b.holders.filter((h) => h.pid).map((h) => `${h.name} has ${describe(P(h.pid))}`);
    const res = b.holders.filter((h) => h.reservedFor).map((h) => `${h.name} is reserved for ${P(h.reservedFor).name}`);
    const bg = b.holders.filter((h) => h.bg).length;
    return `${b.label}: none free. ${[...held.slice(0, 3), ...res].join('. ')}${held.length > 3 ? ` and ${held.length - 3} more` : ''}${bg ? `${held.length ? '. ' : ''}${bg} occupied by inpatients` : ''}.`;
  }
  function statusOf(p) {
    if (p.status === 'expected') return { c: 'grey', cls: 'exp', text: `Ambulance ETA ${p.arriveAt - S.t} min` };
    if (p.arrest) return { c: 'red', cls: 'code', text: p.arrest.teamAt === null ? 'CODE BLUE: no team free yet' : 'CODE BLUE: CPR in progress' };
    if (p.status === 'waiting') return { c: p.esi <= 2 ? 'red' : 'amber-f', cls: p.esi <= 2 ? 'bad' : '', text: `${p.via === 'ems' ? 'On ambulance stretcher' : 'Waiting room'}. No bed for ${S.t - p.arriveAt} min` };
    const st = E.stepOf(p);
    if (p.hold) return { c: 'grey', text: 'On hold (your order)' };
    if (p.stepState === 'run') return { c: st.needs.length ? 'green' : 'grey', text: `${st.label}, ${p.stepLeft} min left` };
    const b = E.blockers(S, p);
    if (S.gridlocks.some((g) => g.includes(p.id))) return { c: 'red', cls: 'bad', text: 'GRIDLOCK: needs a bed huddle' };
    if (E.isBoarding(p)) return { c: 'sky', text: `Boarding ${hm(S.t - p.reqAt)}. Needs ${b[0] ? low(b[0].label) : 'a bed'}` };
    return { c: 'amber-f', text: `Waiting ${S.t - p.reqAt} min for ${b.map((x) => low(x.label)).join(', ') || 'the team'}` };
  }
  const newsCell = (p) => { if (p.status === 'expected') return ''; const n = E.newsOf(p, S.t).score; return `<span class="${n >= 7 ? 'r' : n >= 5 ? 'a' : ''}">${p.arrest ? 'ARREST' : n}</span>`; };
  function dispoOf(p) { const end = E.caseOf(p).steps.at(-1); return end.end === 'home' ? 'Home' : { icu: 'ICU', ward: 'Ward', psych: 'Psych' }[end.place] || ''; }
  function labCell(p) { if (!p.labs.length) return ''; const dn = p.labs.filter((x) => x.done); const ab = dn.filter((x) => x.l[4]).length; return `<span class="${dn.some((x) => /HH|LL/.test(x.l[4])) ? 'r' : ''}">[${dn.length}/${p.labs.length}/${ab}]</span>`; }

  /* ---------- track board ---------- */

        <td class="c-md"${g('col.md', id)}>${p.author && p.seenAt !== null ? esc(p.author.replace(/^Dr\. /, '').split(' ').at(-1 - (/PA-C|RN/.test(p.author) ? 1 : 0)).slice(0, 4).toUpperCase()) : (p.status === 'expected' ? '' : '<span class="r">none</span>')}</td>
        <td class="c c-news"${g('col.news', id)}>${newsCell(p)}</td><td class="c-lab"${g('col.lab', id)}>${labCell(p)}</td><td class="c-dispo"${g('col.dispo', id)}>${dispoOf(p)}</td><td class="c-status ${s.c === 'red' ? 'r' : ''}"${g('col.status', id)}>${esc(s.text)}</td></tr>`;
    }).join('');

    return `<div class="board" id="boardscroll"><table><thead><tr><th${g('col.dot')}></th>${th('c-bed', 'col.bed', 'Bed')}${th('c-acu', 'col.acu', 'Acu')}${th('c-name', 'col.name', 'Patient')}${th('c-age', 'col.age', 'Age')}${th('c-cc', 'col.cc', 'Complaint')}${th('c-los', 'col.los', 'LOS')}${th('c-md', 'col.md', 'MD')}${th('c-news', 'col.news', 'NEWS')}${th('c-lab', 'col.lab', 'Lab')}${th('c-dispo', 'col.dispo', 'Dispo')}${th('c-status', 'col.status', 'Status', ' style="width:36%"')}</tr></thead><tbody>${body || '<tr><td colspan="12" class="m" style="padding:14px">Nobody in this view.</td></tr>'}</tbody></table></div>`;
  }

  /* ---------- report pane ---------- */
  function monitorPanel(p, big) {
    const v = E.vitalsOf(p, S.t), c = E.caseOf(p), k = kindOf(p);
    const wired = p.status === 'active' && E.KINDS[k].monitored;
    const rhythm = p.arrest ? 'vf' : c.rhythm;
    const alarms = [];
    if (p.arrest) alarms.push(['hi', '*** VENTRICULAR FIBRILLATION  NO PULSE']);
    else {
      if (v.hr > 130 || v.hr < 40) alarms.push(['hi', `*** HR ${v.hr > 130 ? 'HIGH' : 'LOW'} ${v.hr}`]);
      if (v.spo2 < 90) alarms.push(['hi', `*** SpO2 LOW ${v.spo2}`]);
      if (v.sbp < 90) alarms.push(['hi', `*** NIBP LOW ${v.sbp}/${v.dbp}`]);
      if (v.rr > 30 || v.rr < 8) alarms.push(['med', `** RESP ${v.rr > 30 ? 'HIGH' : 'LOW'} ${v.rr}`]);
    }
    const a = alarms[0] || ['', wired ? `${rhythm === 'af' ? 'ATRIAL FIBRILLATION' : rhythm === 'stemi' ? 'SINUS RHYTHM  ST ELEVATION' : v.hr > 100 ? 'SINUS TACHYCARDIA' : 'SINUS RHYTHM'}` : 'SPOT CHECK ONLY: NOT ON CONTINUOUS MONITORING HERE'];
    const data = `data-hr="${v.hr}" data-rr="${v.rr}" data-spo2="${v.spo2}" data-rhythm="${rhythm}"`;
    const map = Math.round((v.sbp + 2 * v.dbp) / 3);

    const wave = (w) => (wired ? `<canvas data-wave="${w}" ${data}${g(`mon.${w}`, p.id)}></canvas>` : `<div style="height:48px"${g(`mon.${w}`, p.id)}></div>`);
    return `<div class="mon"><div class="alarm ${a[0]}"${g('mon.alarm', p.id)}>${esc(p.name)} &middot; ${p.loc || 'waiting room'} &middot; ${a[1]}</div>
      ${wave('ecg')}<div class="num hr"${g('mon.hr', p.id)}><small>HR  bpm  ${wired ? 'II' : ''}</small><b>${p.arrest ? '---' : v.hr}</b></div>
      ${wave('pleth')}<div class="num sp"${g('mon.sp', p.id)}><small>SpO2 %${v.o2 ? '  on O2' : '  room air'}</small><b>${p.arrest ? '--' : v.spo2}</b></div>
      ${wave('resp')}<div class="num rs"${g('mon.rs', p.id)}><small>RESP /min</small><b>${p.arrest ? '--' : v.rr}</b></div>
      <div class="num bp" style="grid-column:1/3;flex-direction:row;gap:26px;align-items:baseline;padding:4px 0"><span${g('mon.bp', p.id)}><small>NIBP mmHg </small><b>${p.arrest ? '--/--' : `${v.sbp}/${v.dbp}`}</b> <small>(${p.arrest ? '--' : map})</small></span><span style="color:#fff"${g('v.temp', p.id)}><small>TEMP &deg;C </small><b>${v.temp.toFixed(1)}</b></span><span style="color:#fff"${g('v.gcs', p.id)}><small>GCS </small><b>${v.gcs}</b></span></div></div>`;
  }
  function pathway(p) {
    const c = E.caseOf(p), block = E.blockers(S, p);
    const stepsHtml = c.steps.map((st, i) => {
      const doneStep = i < p.stepIdx || ['admitted', 'home'].includes(p.status);
      const cur = i === p.stepIdx && p.status === 'active';
      const mark = doneStep ? '<span class="g">&#10003;</span>' : cur ? `<span class="${p.stepState === 'run' ? 'g' : 'a'}">&#9679;</span>` : '<span class="m">&#9675;</span>';
      const right = doneStep ? '<span class="g" style="font-weight:400">done</span>' : cur ? (p.stepState === 'run' ? `<span class="g">${p.stepLeft} min left</span>` : `<span class="a">waiting ${S.t - p.reqAt} min</span>`) : `<span class="m">${st.dur ? `${st.dur} min` : ''}</span>`;
      let needs = '';
      if (cur || (i === p.stepIdx + 1 && p.stepState === 'run') || (p.status === 'waiting' && i === 0)) {
        needs = `<div class="needs">${st.needs.map((n) => {
          const b = cur && p.stepState === 'need' ? block.find((x) => x.need === n) : null;
          const using = cur && p.stepState === 'run' ? [...p.using, p.loc].map((id) => S.units[id]).find((u) => n.split('|').includes(u.kind)) : null;
          const label = n.split('|').map((k) => E.KINDS[k].label).join(' or ');
          return `<span class="need ${b ? 'no' : cur ? 'ok' : ''}" title="${b ? esc(explain(b)) : ''}"${g(b ? 'need.no' : cur ? 'need.ok' : 'need.next', p.id, b ? explain(b) : '')}>${b ? '&#10005;' : cur ? '&#10003;' : ''} ${using ? esc(using.name) : label}</span>`;
        }).join('')}${st.blood ? `<span class="need ${S.stock.prbc < st.blood && !doneStep && p.stepState === 'need' ? 'no' : ''}">${st.blood} units red cells</span>` : ''}${!st.needs.length ? '<span class="need">bed only</span>' : ''}</div>`;
      }
      return `<div class="step ${cur ? 'cur' : ''}"${g('path.step', p.id)}>${mark}<span>${esc(st.label)}</span>${right}${needs}</div>`;
    }).join('');
    const clocks = Object.values(p.clocks).map((k) => {
      const used = k.at !== null ? k.at : S.t - p.arriveAt;
      return `<span class="need ${k.met === true ? 'ok' : k.met === false || used > k.limit ? 'no' : ''}"${g('path.clock', p.id)}>${esc(k.label)}: ${Math.max(0, used)} / ${k.limit} min${k.met === true ? ' met' : k.met === false ? ' missed' : ''}</span>`;

  }
  function advisory(p) {
