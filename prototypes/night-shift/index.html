n it.</td></tr><tr><td><b>Alerts</b></td><td>The number of alerts you have not acknowledged. It flashes red when one is critical.</td><td>Press it to open the full list.</td></tr></tbody></table></div>\n<h2>Alert banner</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Most urgent alert</b></td><td>The single most urgent alert you have not dealt with. Red is critical, amber is a warning.</td><td>Read it first. Then open the patient or acknowledge it.</td></tr><tr><td><b>Open patient</b></td><td>Jumps to the patient this alert is about.</td><td>Press it to see what is wrong and what you can do.</td></tr><tr><td><b>Acknowledge</b></td><td>Says you have seen this alert, so the next one can show. It fixes nothing for the patient.</td><td>Only acknowledge once you have a plan.</td></tr></tbody></table></div>\n<h2>Board tabs</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>All Patients</b></td><td>Everyone on the way, waiting, or being treated.</td><td>Your default view.</td></tr><tr><td><b>Expected</b></td><td>Ambulances on the way that have radioed ahead.</td><td>Use the minutes before they arrive to get a bed and a team ready.</td></tr><tr><td><b>Waiting</b></td><td>People who have arrived and have no bed.</td><td>Look here often. These patients are not being monitored.</td></tr><tr><td><b>In Beds</b></td><td>Patients in an emergency department bed.</td><td>Check who is stuck.</td></tr><tr><td><b>To Be Admitted</b></td><td>Patients finished here and waiting for a bed upstairs. Called boarding. They take up your beds.</td><td>Phone the ICU or bed management to clear them.</td></tr><tr><td><b>Cath / OR</b></td><td>Patients currently in the cath lab, an operating room or another part of the hospital.</td><td>Watch for anyone stuck there with nowhere to go next.</td></tr></tbody></table></div>\n<h2>Activities</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Central Monitor</b></td><td>Live heart traces for every patient on continuous monitoring.</td><td>A flashing red tile means an alarm. Press a tile to open that patient.</td></tr><tr><td><b>Beds &amp; Resources</b></td><td>Every bed, scanner and theatre in the hospital, and who has it.</td><td>Use it to see at a glance what is free and what is jammed.</td></tr><tr><td><b>Staff</b></td><td>Everyone on shift, who they are with, and who is on call at home.</td><td>Check here when a step is waiting for a person.</td></tr><tr><td><b>Alerts</b></td><td>Every alert tonight, newest first.</td><td>Press a line to open the patient.</td></tr><tr><td><b>Shift Review</b></td><td>Your results for the night.</td><td>Read what went wrong and try again.</td></tr></tbody></table></div>\n<h2>Capacity</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>ED beds</b></td><td>Emergency beds in use, out of 21. Hallway stretchers are included.</td><td>When this is full, new patients stay in the waiting room.</td></tr><tr><td><b>Waiting</b></td><td>People with no bed yet. Red above 6.</td><td>Keep it low, sickest first. Some will leave without being seen.</td></tr><tr><td><b>Boarding</b></td><td>Patients done here but stuck in your beds until the hospital has room upstairs.</td><td>Phone the ICU or bed management to free beds.</td></tr><tr><td><b>ICU</b></td><td>Intensive care beds in use, out of 12.</td><td>When full, ask the ICU to step a patient down. Use the phone.</td></tr><tr><td><b>Ward</b></td><td>Ordinary inpatient beds in use, out of 16.</td><td>When full, ask bed management to send someone home early.</td></tr><tr><td><b>OR</b></td><td>Operating rooms in use, out of 2.</td><td>A patient leaving the OR for ICU keeps the OR until an ICU bed exists.</td></tr><tr><td><b>CT</b></td><td>The one CT scanner, and how many patients are queued for it.</td><td>If a stroke is behind a kidney stone, expedite the stroke.</td></tr><tr><td><b>Blood</b></td><td>Units of red cells in the fridge. Red at 2 or fewer.</td><td>Phone the blood bank before you run out. It takes 15 minutes.</td></tr><tr><td><b>Tonight's score</b></td><td>Deaths, people harmed by delay, people who did well, time targets met, and LWBS (left without being seen).</td><td>Deaths matter most, then harm. This decides your grade.</td></tr></tbody></table></div>\n<h2>Track board</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Colour bar</b></td><td>Green: being treated. Amber: waiting for something. Red: in danger or jammed. Blue: boarding. Grey: nothing needed from you.</td><td>Scan for red and amber.</td></tr><tr><td><b>Bed</b></td><td>Where the patient is. EXP: ambulance expected. WR: waiting room. EMS: on an ambulance stretcher. Otherwise a bed code: R resus, T trauma, A acute, FT fast track, BH behavioural, H hallway.</td><td>A patient on WR or EMS has no bed yet.</td></tr><tr><td><b>Acuity (ESI)</b></td><td>How sick triage thinks this patient is. 1 is dying. 2 is high risk. 3 is sick but stable. 4 and 5 are minor.</td><td>Sickest first, most of the time. Triage can be wrong.</td></tr><tr><td><b>Patient</b></td><td>Name and sex. A red triangle means you expedited them.</td><td>Press a row to open the patient below.</td></tr><tr><td><b>Age</b></td><td>Age in years.</td><td>For information.</td></tr><tr><td><b>Complaint</b></td><td>Why they came in, in triage's words. Not always the final diagnosis.</td><td>Watch for vague ones, such as \"abdominal pain\" in a young woman.</td></tr><tr><td><b>LOS</b></td><td>Length of stay: hours and minutes since they arrived.</td><td>A long time with no bed is a warning sign.</td></tr><tr><td><b>MD</b></td><td>The clinician who has seen the patient. Red \"none\" means no doctor yet.</td><td>A sick patient with \"none\" needs a bed and a doctor.</td></tr><tr><td><b>NEWS</b></td><td>Early warning score from the vital signs. 0 to 4 is low. 5 or 6 needs an urgent review. 7 or more is an emergency.</td><td>A rising number means the patient is getting worse.</td></tr><tr><td><b>Lab</b></td><td>Blood tests as [back / ordered / abnormal]. Red means a critical result.</td><td>Open Results to read them.</td></tr><tr><td><b>Dispo</b></td><td>Disposition: where this patient is heading. Home, Ward, ICU or Psych.</td><td>ICU and Ward patients will need a bed upstairs. Plan ahead.</td></tr><tr><td><b>Status</b></td><td>What is happening right now, in plain words, including what the patient is waiting for.</td><td>This is the most useful column on the board.</td></tr></tbody></table></div>\n<h2>Patient report</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Overview</b></td><td>Your working view: complaint, vitals, care pathway and what you can do.</td><td>Stay on this tab most of the time.</td></tr><tr><td><b>Live Monitor</b></td><td>The bedside monitor for this patient, plus how their warning score adds up.</td><td>Use it to see why a patient is scoring high.</td></tr><tr><td><b>Chart and Notes</b></td><td>History, medications, allergies, exam, and a timeline of notes.</td><td>Read it to see the real story behind a vague complaint.</td></tr><tr><td><b>Results</b></td><td>Blood tests and imaging reports. The number is how many are back.</td><td>Red results are abnormal.</td></tr><tr><td><b>Outcome</b></td><td>How this patient's night ended.</td><td>Harm and death here are what your grade is made of.</td></tr></tbody></table></div>\n<h2>Patient header</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Patient name</b></td><td>Who this report belongs to. The square matches their colour on the board.</td><td></td></tr><tr><td><b>MRN</b></td><td>Medical record number: the hospital's ID for this patient.</td><td></td></tr><tr><td><b>Age and sex</b></td><td>Age in years and sex.</td><td></td></tr><tr><td><b>Location</b></td><td>Where they are now.</td><td></td></tr><tr><td><b>ESI</b></td><td>Triage level. 1 is dying, 5 is minor.</td><td></td></tr><tr><td><b>Arrival</b></td><td>When they came in and how: ambulance (EMS) or walk-in.</td><td></td></tr><tr><td><b>Allergies</b></td><td>NKDA means no known drug allergies. Red means they have one.</td><td>For information. You do not prescribe.</td></tr></tbody></table></div>\n<h2>Overview</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Chief Complaint</b></td><td>The triage nurse's note: what happened and what they found.</td><td>Read this first.</td></tr><tr><td><b>Vitals</b></td><td>Current vital signs. Red means out of the safe range.</td><td>Point at each one to learn what it is.</td></tr><tr><td><b>BestPractice Advisory</b></td><td>The system telling you exactly what is blocking this patient and who has it.</td><td>Read this when a patient is stuck.</td></tr><tr><td><b>Charge Actions</b></td><td>Everything you can do for this patient right now. The list changes with the situation.</td><td>A dark button is usually the most urgent one.</td></tr></tbody></table></div>\n<h2>Vitals</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>BP, blood pressure</b></td><td>Pressure in the arteries, top number over bottom. A top number of 90 or below is dangerous.</td><td>Low and falling often means bleeding, sepsis or heart failure.</td></tr><tr><td><b>HR, heart rate</b></td><td>Beats per minute. Normal is about 60 to 100.</td><td>A fast heart can be the body compensating for trouble.</td></tr><tr><td><b>SpO2, oxygen level</b></td><td>Percent of oxygen in the blood. Normal is 95 or more. \"on O2\" means they are on oxygen.</td><td>Below 92 is a concern.</td></tr><tr><td><b>RR, breathing rate</b></td><td>Breaths per minute. Normal is 12 to 20.</td><td>Often the earliest sign that someone is getting sick.</td></tr><tr><td><b>Temp</b></td><td>Body temperature in Celsius.</td><td>High suggests infection.</td></tr><tr><td><b>GCS, consciousness</b></td><td>Glasgow Coma Scale, 3 to 15. 15 is fully awake.</td><td>A falling GCS is an emergency.</td></tr><tr><td><b>NEWS2</b></td><td>One score built from all the vitals. 0 to 4 low, 5 or 6 urgent, 7 or more emergency.</td><td>See the Live Monitor tab for the breakdown.</td></tr><tr><td><b>ESI</b></td><td>Triage level given on arrival. It does not change, even if the patient does.</td><td>Trust the NEWS score over the ESI if they disagree.</td></tr></tbody></table></div>\n<h2>Care pathway</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Care Pathway</b></td><td>The steps this patient must go through, in order. A tick is done, a dot is current.</td><td>Look at the current step. That is where patients get stuck.</td></tr><tr><td><b>Care step</b></td><td>One stage of treatment. It starts only when everything it needs is free at the same moment.</td><td>If it is waiting, look at the chips underneath.</td></tr><tr><td><b>Green chip: ready</b></td><td>This need is met, or is in use by this step.</td><td>Nothing to do.</td></tr><tr><td><b>Red chip: missing</b></td><td>This is what is holding the patient up. The advisory says who has it.</td><td>Call someone in, reserve it, or move someone else out of the way.</td></tr><tr><td><b>Grey chip: needed next</b></td><td>What the next step will need. Nothing has been claimed yet.</td><td>Reserve it or call them in now.</td></tr><tr><td><b>Time target</b></td><td>A real medical deadline, in minutes from arrival, such as door to balloon for a heart attack. Green met, red missed.</td><td>Missing one counts as harm in your review.</td></tr></tbody></table></div>\n<h2>Charge action</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Assign bed</b></td><td>Puts a waiting patient in a bed. Only safe bed types are offered. Blood tests start when they are in a bed.</td><td>Give the sickest the best beds.</td></tr><tr><td><b>Reserve a bed for arrival</b></td><td>Holds a bed for an ambulance that has not arrived yet. If it is in use, it goes to them when it frees up.</td><td>Do this as soon as a critical ambulance radios in.</td></tr><tr><td><b>Bed huddle</b></td><td>Moves patients who each hold what the other needs, all at once. It is the only way to clear a gridlock.</td><td>Use it as soon as you see the word GRIDLOCK.</td></tr><tr><td><b>Call in a team</b></td><td>Brings an on-call team in from home. Button shows how many minutes they take.</td><td>Press it early. Travel time cannot be sped up.</td></tr><tr><td><b>Phone ICU</b></td><td>Asks the ICU to move its most stable patient to a ward. Needs a free ward bed. Frees an ICU bed in 20 minutes.</td><td>You have 7 of these a night.</td></tr><tr><td><b>Phone bed management</b></td><td>Sends a ward patient home early. Frees a ward bed in 30 minutes.</td><td>You have 8 of these a night.</td></tr><tr><td><b>Phone blood bank</b></td><td>Orders 6 units of red cells. They arrive in 15 minutes.</td><td>Order before you run out.</td></tr><tr><td><b>Reserve equipment</b></td><td>Keeps a scanner, cath lab or theatre for this patient, now or as soon as it frees up.</td><td>Use it for the next step of a very sick patient.</td></tr><tr><td><b>Expedite</b></td><td>Puts this patient first in every queue. The normal order is first come, first served.</td><td>Use it sparingly. If everyone is first, nobody is.</td></tr><tr><td><b>Hold</b></td><td>Stops this patient from claiming their next step until you release them.</td><td>Use it to leave scarce staff for someone sicker.</td></tr><tr><td><b>Move</b></td><td>Moves the patient to another bed. Not possible during a procedure. Hallway care is 30% slower and deterioration 20% faster.</td><td>Move stable patients to the hallway to free a monitored bed.</td></tr><tr><td><b>Choose one</b></td><td>The options for the button above. The small text says what kind of place it is.</td><td>Pick the best suitable one.</td></tr></tbody></table></div>\n<h2>Live monitor</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Alarm line</b></td><td>Shows the current rhythm, or an alarm in red. \"Spot check only\" means this bed has no continuous monitor.</td><td>A red line means act now.</td></tr><tr><td><b>ECG trace, green</b></td><td>The electrical activity of the heart.</td><td>Chaotic with no pattern means cardiac arrest.</td></tr><tr><td><b>Pleth trace, blue</b></td><td>The pulse wave from the finger sensor. It gives the oxygen level.</td><td>A flat wave means poor circulation.</td></tr><tr><td><b>Resp trace, yellow</b></td><td>Breathing.</td><td>Fast or flat is bad.</td></tr><tr><td><b>Heart rate</b></td><td>Beats per minute.</td><td>Normal is about 60 to 100.</td></tr><tr><td><b>SpO2</b></td><td>Oxygen level in percent.</td><td>Normal is 95 or more.</td></tr><tr><td><b>Respiratory rate</b></td><td>Breaths per minute.</td><td>Normal is 12 to 20.</td></tr><tr><td><b>NIBP</b></td><td>Blood pressure from the arm cuff. The number in brackets is the average, called MAP.</td><td>A top number of 90 or below is dangerous.</td></tr><tr><td><b>NEWS2 breakdown</b></td><td>Each vital sign scores 0 to 3, and they add up. This shows what is driving the score.</td><td>Score 3 in one vital needs attention even if the total is low.</td></tr></tbody></table></div>\n<h2>Chart</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>History</b></td><td>HPI is the story of this illness. Below it: past illnesses, medicines, allergies, exam and ECG.</td><td>Read it to understand a vague complaint.</td></tr><tr><td><b>Notes and procedures</b></td><td>Timeline of everything done, newest first, including your own orders.</td><td>Good for working out what already happened.</td></tr></tbody></table></div>\n<h2>Results</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Laboratory</b></td><td>Blood results with normal ranges. H is high, L is low, HH or LL is critical.</td><td>Bloods are only drawn once the patient has a bed.</td></tr><tr><td><b>Imaging and procedures</b></td><td>Reports from ECG, X-ray, CT and procedures.</td><td>These often give the real diagnosis.</td></tr></tbody></table></div>\n<h2>Central monitor</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Patient monitor</b></td><td>One patient: heart trace, heart rate, oxygen, blood pressure, breathing. Flashing red is an alarm.</td><td>Press it to open the patient.</td></tr></tbody></table></div>\n<h2>Beds &amp; Resources</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Green tile: free</b></td><td>Nothing is using this.</td><td>Available now.</td></tr><tr><td><b>Yellow tile: in use</b></td><td>A patient has it and is progressing.</td><td>Press it to open the patient.</td></tr><tr><td><b>Red tile: stuck</b></td><td>The patient is here but is waiting for something else. This is how jams look.</td><td>Open the patient and read the advisory.</td></tr><tr><td><b>Blue tile: reserved</b></td><td>Being kept for a particular patient.</td><td>You set this with Reserve.</td></tr><tr><td><b>Grey tile: inpatient</b></td><td>A hospital patient you do not control. Some of these free up overnight.</td><td>Phone the ICU or bed management to clear one.</td></tr><tr><td><b>Blood fridge</b></td><td>Red cell units on hand. Bleeding patients use them.</td><td>Phone the blood bank before it runs out.</td></tr></tbody></table></div>\n<h2>Staff</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>On shift</b></td><td>Each person, their role, and who they are with. Staff are claimed for a step, then released.</td><td>A blocked step usually means everyone of that role is busy here.</td></tr><tr><td><b>On call</b></td><td>Teams at home, and how long they take to arrive.</td><td>Call in here or from a patient's actions.</td></tr></tbody></table></div>\n<h2>Alerts</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Red: critical</b></td><td>Needs you now: Code Blue, major pre-alerts, very high warning score, gridlock, a death.</td><td>Press it to open the patient.</td></tr><tr><td><b>Amber: warning</b></td><td>Going wrong: a target about to be missed, a sick patient with no bed, a critical lab, low blood.</td><td>Deal with these before they turn red.</td></tr><tr><td><b>Blue: information</b></td><td>Good news or status: staff arrived, bed free, blood delivered, a patient revived.</td><td>No action needed.</td></tr><tr><td><b>Acknowledge all</b></td><td>Marks every alert as seen.</td><td>Only when you have read them.</td></tr></tbody></table></div>\n<h2>Shift review</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Grade</b></td><td>A: no deaths and 2 or fewer harmed. B: at most 1 death and 5 harmed. C: at most 3 deaths. D: more than that.</td><td>Try for an A.</td></tr><tr><td><b>Case list</b></td><td>Each patient who did badly and why.</td><td>Press one to see their pathway.</td></tr><tr><td><b>How the house jammed</b></td><td>Counts of the types of hold-up tonight, in computing terms.</td><td>For the curious.</td></tr></tbody></table></div>\n<h2>Desk</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>EMS radio</b></td><td>Ambulances calling ahead, with their arrival time. The red light means someone is inbound.</td><td>Press a line to open that patient.</td></tr><tr><td><b>Shift clock</b></td><td>The shift runs 19:00 to 07:00. One game minute is one real second at 1x.</td><td>Slow down when it gets busy.</td></tr><tr><td><b>Pager</b></td><td>The latest alert, as a text message.</td><td>A quick way to see what just changed.</td></tr><tr><td><b>Desk phone</b></td><td>Three lines: ICU charge nurse, bed management, blood bank. The numbers show calls left tonight.</td><td>Press it to make a call.</td></tr></tbody></table></div>\n<h2>Speed</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Pause</b></td><td>Stops the clock. You can still do everything while paused. Space bar does the same.</td><td>Pause whenever you need to think. There is no penalty.</td></tr><tr><td><b>1x</b></td><td>Normal speed: one game minute per second.</td><td>Use it when things are busy.</td></tr><tr><td><b>3x</b></td><td>Three game minutes per second.</td><td>Use it in quiet spells.</td></tr><tr><td><b>8x</b></td><td>Eight game minutes per second.</td><td>Only when nothing is happening.</td></tr></tbody></table></div>\n<h2>Desk phone</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>ICU charge nurse</b></td><td>Steps the most stable ICU patient down to a ward. Needs a free ward bed. Frees an ICU bed in 20 minutes. 7 per night.</td><td>Call as soon as you see ICU filling up.</td></tr><tr><td><b>Bed management</b></td><td>Sends a ward patient home early. Frees a ward bed in 30 minutes. 8 per night.</td><td>Use it before the ward is full.</td></tr><tr><td><b>Blood bank</b></td><td>Sends 6 units of red cells. Arrives in 15 minutes.</td><td>Call when the fridge is under 4.</td></tr></tbody></table></div>\n<h2>Bottom bar</h2>\n<div class=\"tw\"><table><thead><tr><th>Control</th><th>What it is</th><th>What to do</th></tr></thead><tbody><tr><td><b>Board</b></td><td>The track board: who is here and how they are.</td><td></td></tr><tr><td><b>Monitors</b></td><td>Live heart traces for every monitored patient.</td><td></td></tr><tr><td><b>Beds</b></td><td>Every bed, scanner and theatre.</td><td></td></tr><tr><td><b>Staff</b></td><td>Who is busy, who is free, who is at home.</td><td></td></tr><tr><td><b>Alerts</b></td><td>Everything that has gone off tonight.</td><td></td></tr></tbody></table></div>","text":"Everything on the screen, in the same words Guide Mode uses. Press G in the game to see these on the real thing. Top bar Control What it is What to do PULSE ED The department's tracking software. Every hospital has something like it. You are logged in as the charge nurse. Nothing to press here. The time on the right is the shift clock. Toolbar Control What it is What to do Call In Staff Lists the teams who are at home tonight, and how long each takes to arrive. Call early. A team called when the patient arrives is already too late. Phone Opens the desk phone: ICU charge nurse, bed management, blood bank. Use it when the ICU or wards are full, or blood is low. Ambulance Diversion Tells ambulances to go to another hospital for 60 minutes. Walk ins still come. You can use it again 3 hours later. Save it for when you truly cannot take another sick patient. Each one sent away is counted in your review. Engineer Lens Adds computing terms such as deadlock to alerts. For the curious only. It changes nothing in the hospital. Leave it off unless you want the computer science. Guide Mode Turns the whole screen into an explainer. Point at anything to see what it means. The clock stops while it is on. Press G any time to switch it on or off. Orientation Replays the step by step tutorial on a practice night. Your real shift is saved and comes back afterwards. Use it if you want a refresher. Handbook The full manual: how to play, every move, every condition, plain English glossary. Press ? to open it. Alerts The number of alerts you have not acknowledged. It flashes red when one is critical. Press it to open the full list. Alert banner Control What it is What to do Most urgent alert The single most urgent alert you have not dealt with. Red is critical, amber is a warning. Read it first. Then open the patient or acknowledge it. Open patient Jumps to the patient this alert is about. Press it to see what is wrong and what you can do. Acknowledge Says you have seen this alert, so the next one can show. It fixes nothing for the patient. Only acknowledge once you have a plan. Board tabs Control What it is What to do All Patients Everyone on the way, waiting, or being treated. Your default view. Expected Ambulances on the way that have radioed ahead. Use the minutes before they arrive to get a bed and a team ready. Waiting People who have arrived and have no bed. Look here often. These patients are not being monitored. In Beds Patients in an emergency department bed. Check who is stuck. To Be Admitted Patients finished here and waiting for a bed upstairs. Called boarding. They take up your beds. Phone the ICU or bed management to clear them. Cath / OR Patients currently in the cath lab, an operating room or another part of the hospital. Watch for anyone stuck there with nowhere to go next. Activities Control What it is What to do Central Monitor Live heart traces for every patient on continuous monitoring. A flashing red tile means an alarm. Press a tile to open that patient. Beds & Resources Every bed, scanner and theatre in the hospital, and who has it. Use it to see at a glance what is free and what is jammed. Staff Everyone on shift, who they are with, and who is on call at home. Check here when a step is waiting for a person. Alerts Every alert tonight, newest first. Press a line to open the patient. Shift Review Your results for the night. Read what went wrong and try again. Capacity Control What it is What to do ED beds Emergency beds in use, out of 21. Hallway stretchers are included. When this is full, new patients stay in the waiting room. Waiting People with no bed yet. Red above 6. Keep it low, sickest first. Some will leave without being seen. Boarding Patients done here but stuck in your beds until the hospital has room upstairs. Phone the ICU or bed management to free beds. ICU Intensive care beds in use, out of 12. When full, ask the ICU to step a patient down. Use the phone. Ward Ordinary inpatient beds in use, out of 16. When full, ask bed management to send someone home early. OR Operating rooms in use, out of 2. A patient leaving the OR for ICU keeps the OR until an ICU bed exists. CT The one CT scanner, and how many patients are queued for it. If a stroke is behind a kidney stone, expedite the stroke. Blood Units of red cells in the fridge. Red at 2 or fewer. Phone the blood bank before you run out. It takes 15 minutes. Tonight's score Deaths, people harmed by delay, people who did well, time targets met, and LWBS (left without being seen). Deaths matter most, then harm. This decides your grade. Track board Control What it is What to do Colour bar Green: being treated. Amber: waiting for something. Red: in danger or jammed. Blue: boarding. Grey: nothing needed from you. Scan for red and amber. Bed Where the patient is. EXP: ambulance expected. WR: waiting room. EMS: on an ambulance stretcher. Otherwise a bed code: R resus, T trauma, A acute, FT fast track, BH behavioural, H hallway. A patient on WR or EMS has no bed yet. Acuity (ESI) How sick triage thinks this patient is. 1 is dying. 2 is high risk. 3 is sick but stable. 4 and 5 are minor. Sickest first, most of the time. Triage can be wrong. Patient Name and sex. A red triangle means you expedited them. Press a row to open the patient below. Age Age in years. For information. Complaint Why they came in, in triage's words. Not always the final diagnosis. Watch for vague ones, such as \"abdominal pain\" in a young woman. LOS Length of stay: hours and minutes since they arrived. A long time with no bed is a warning sign. MD The clinician who has seen the patient. Red \"none\" means no doctor yet. A sick patient with \"none\" needs a bed and a doctor. NEWS Early warning score from the vital signs. 0 to 4 is low. 5 or 6 needs an urgent review. 7 or more is an emergency. A rising number means the patient is getting worse. Lab Blood tests as [back / ordered / abnormal]. Red means a critical result. Open Results to read them. Dispo Disposition: where this patient is heading. Home, Ward, ICU or Psych. ICU and Ward patients will need a bed upstairs. Plan ahead. Status What is happening right now, in plain words, including what the patient is waiting for. This is the most useful column on the board. Patient report Control What it is What to do Overview Your working view: complaint, vitals, care pathway and what you can do. Stay on this tab most of the time. Live Monitor The bedside monitor for this patient, plus how their warning score adds up. Use it to see why a patient is scoring high. Chart and Notes History, medications, allergies, exam, and a timeline of notes. Read it to see the real story behind a vague complaint. Results Blood tests and imaging reports. The number is how many are back. Red results are abnormal. Outcome How this patient's night ended. Harm and death here are what your grade is made of. Patient header Control What it is What to do Patient name Who this report belongs to. The square matches their colour on the board. MRN Medical record number: the hospital's ID for this patient. Age and sex Age in years and sex. Location Where they are now. ESI Triage level. 1 is dying, 5 is minor. Arrival When they came in and how: ambulance (EMS) or walk in. Allergies NKDA means no known drug allergies. Red means they have one. For information. You do not prescribe. Overview Control What it is What to do Chief Complaint The triage nurse's note: what happened and what they found. Read this first. Vitals Current vital signs. Red means out of the safe range. Point at each one to learn what it is. BestPractice Advisory The system telling you exactly what is blocking this patient and who has it. Read this when a patient is stuck. Charge Actions Everything you can do for this patient right now. The list changes with the situation. A dark button is usually the most urgent one. Vitals Control What it is What to do BP, blood pressure Pressure in the arteries, top number over bottom. A top number of 90 or below is dangerous. Low and falling often means bleeding, sepsis or heart failure. HR, heart rate Beats per minute. Normal is about 60 to 100. A fast heart can be the body compensating for trouble. SpO2, oxygen level Percent of oxygen in the blood. Normal is 95 or more. \"on O2\" means they are on oxygen. Below 92 is a concern. RR, breathing rate Breaths per minute. Normal is 12 to 20. Often the earliest sign that someone is getting sick. Temp Body temperature in Celsius. High suggests infection. GCS, consciousness Glasgow Coma Scale, 3 to 15. 15 is fully awake. A falling GCS is an emergency. NEWS2 One score built from all the vitals. 0 to 4 low, 5 or 6 urgent, 7 or more emergency. See the Live Monitor tab for the breakdown. ESI Triage level given on arrival. It does not change, even if the patient does. Trust the NEWS score over the ESI if they disagree. Care pathway Control What it is What to do Care Pathway The steps this patient must go through, in order. A tick is done, a dot is current. Look at the current step. That is where patients get stuck. Care step One stage of treatment. It starts only when everything it needs is free at the same moment. If it is waiting, look at the chips underneath. Green chip: ready This need is met, or is in use by this step. Nothing to do. Red chip: missing This is what is holding the patient up. The advisory says who has it. Call someone in, reserve it, or move someone else out of the way. Grey chip: needed next What the next step will need. Nothing has been claimed yet. Reserve it or call them in now. Time target A real medical deadline, in minutes from arrival, such as door to balloon for a heart attack. Green met, red missed. Missing one counts as harm in your review. Charge action Control What it is What to do Assign bed Puts a waiting patient in a bed. Only safe bed types are offered. Blood tests start when they are in a bed. Give the sickest the best beds. Reserve a bed for arrival Holds a bed for an ambulance that has not arrived yet. If it is in use, it goes to them when it frees up. Do this as soon as a critical ambulance radios in. Bed huddle Moves patients who each hold what the other needs, all at once. It is the only way to clear a gridlock. Use it as soon as you see the word GRIDLOCK. Call in a team Brings an on call team in from home. Button shows how many minutes they take. Press it early. Travel time cannot be sped up. Phone ICU Asks the ICU to move its most stable patient to a ward. Needs a free ward bed. Frees an ICU bed in 20 minutes. You have 7 of these a night. Phone bed management Sends a ward patient home early. Frees a ward bed in 30 minutes. You have 8 of these a night. Phone blood bank Orders 6 units of red cells. They arrive in 15 minutes. Order before you run out. Reserve equipment Keeps a scanner, cath lab or theatre for this patient, now or as soon as it frees up. Use it for the next step of a very sick patient. Expedite Puts this patient first in every queue. The normal order is first come, first served. Use it sparingly. If everyone is first, nobody is. Hold Stops this patient from claiming their next step until you release them. Use it to leave scarce staff for someone sicker. Move Moves the patient to another bed. Not possible during a procedure. Hallway care is 30% slower and deterioration 20% faster. Move stable patients to the hallway to free a monitored bed. Choose one The options for the button above. The small text says what kind of place it is. Pick the best suitable one. Live monitor Control What it is What to do Alarm line Shows the current rhythm, or an alarm in red. \"Spot check only\" means this bed has no continuous monitor. A red line means act now. ECG trace, green The electrical activity of the heart. Chaotic with no pattern means cardiac arrest. Pleth trace, blue The pulse wave from the finger sensor. It gives the oxygen level. A flat wave means poor circulation. Resp trace, yellow Breathing. Fast or flat is bad. Heart rate Beats per minute. Normal is about 60 to 100. SpO2 Oxygen level in percent. Normal is 95 or more. Respiratory rate Breaths per minute. Normal is 12 to 20. NIBP Blood pressure from the arm cuff. The number in brackets is the average, called MAP. A top number of 90 or below is dangerous. NEWS2 breakdown Each vital sign scores 0 to 3, and they add up. This shows what is driving the score. Score 3 in one vital needs attention even if the total is low. Chart Control What it is What to do History HPI is the story of this illness. Below it: past illnesses, medicines, allergies, exam and ECG. Read it to understand a vague complaint. Notes and procedures Timeline of everything done, newest first, including your own orders. Good for working out what already happened. Results Control What it is What to do Laboratory Blood results with normal ranges. H is high, L is low, HH or LL is critical. Bloods are only drawn once the patient has a bed. Imaging and procedures Reports from ECG, X ray, CT and procedures. These often give the real diagnosis. Central monitor Control What it is What to do Patient monitor One patient: heart trace, heart rate, oxygen, blood pressure, breathing. Flashing red is an alarm. Press it to open the patient. Beds & Resources Control What it is What to do Green tile: free Nothing is using this. Available now. Yellow tile: in use A patient has it and is progressing. Press it to open the patient. Red tile: stuck The patient is here but is waiting for something else. This is how jams look. Open the patient and read the advisory. Blue tile: reserved Being kept for a particular patient. You set this with Reserve. Grey tile: inpatient A hospital patient you do not control. Some of these free up overnight. Phone the ICU or bed management to clear one. Blood fridge Red cell units on hand. Bleeding patients use them. Phone the blood bank before it runs out. Staff Control What it is What to do On shift Each person, their role, and who they are with. Staff are claimed for a step, then released. A blocked step usually means everyone of that role is busy here. On call Teams at home, and how long they take to arrive. Call in here or from a patient's actions. Alerts Control What it is What to do Red: critical Needs you now: Code Blue, major pre alerts, very high warning score, gridlock, a death. Press it to open the patient. Amber: warning Going wrong: a target about to be missed, a sick patient with no bed, a critical lab, low blood. Deal with these before they turn red. Blue: information Good news or status: staff arrived, bed free, blood delivered, a patient revived. No action needed. Acknowledge all Marks every alert as seen. Only when you have read them. Shift review Control What it is What to do Grade A: no deaths and 2 or fewer harmed. B: at most 1 death and 5 harmed. C: at most 3 deaths. D: more than that. Try for an A. Case list Each patient who did badly and why. Press one to see their pathway. How the house jammed Counts of the types of hold up tonight, in computing terms. For the curious. Desk Control What it is What to do EMS radio Ambulances calling ahead, with their arrival time. The red light means someone is inbound. Press a line to open that patient. Shift clock The shift runs 19:00 to 07:00. One game minute is one real second at 1x. Slow down when it gets busy. Pager The latest alert, as a text message. A quick way to see what just changed. Desk phone Three lines: ICU charge nurse, bed management, blood bank. The numbers show calls left tonight. Press it to make a call. Speed Control What it is What to do Pause Stops the clock. You can still do everything while paused. Space bar does the same. Pause whenever you need to think. There is no penalty. 1x Normal speed: one game minute per second. Use it when things are busy. 3x Three game minutes per second. Use it in quiet spells. 8x Eight game minutes per second. Only when nothing is happening. Desk phone Control What it is What to do ICU charge nurse Steps the most stable ICU patient down to a ward. Needs a free ward bed. Frees an ICU bed in 20 minutes. 7 per night. Call as soon as you see ICU filling up. Bed management Sends a ward patient home early. Frees a ward bed in 30 minutes. 8 per night. Use it before the ward is full. Blood bank Sends 6 units of red cells. Arrives in 15 minutes. Call when the fridge is under 4. Bottom bar Control What it is What to do Board The track board: who is here and how they are. Monitors Live heart traces for every monitored patient. Beds Every bed, scanner and theatre. Staff Who is busy, who is free, who is at home. Alerts Everything that has gone off tonight."},{"id":"cases","title":"Case book","html":"<h1>Case book</h1>\n<p>Every condition in the game. Generated from the same data the simulation runs on.</p>\n<blockquote><p>Spoilers. These are the answers.</p></blockquote>\n<h2>Anterior STEMI</h2>\n<p><b>Arrives as:</b> \"Chest pain, STEMI alert\" by ambulance. <b>ESI 1.</b> <b>Safe beds:</b> Resus / trauma bay, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>12-lead ECG and physician assessment</td><td>ED physician, ED nurse</td><td>6</td></tr><tr><td>Primary PCI in the cath lab</td><td>Cath lab, Interventional cardiology, ED nurse</td><td>50</td></tr><tr><td>Coronary care (ICU) bed</td><td>ICU bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Time targets:</b> Door to ECG, 10 min. Door to balloon, 90 min.</p>\n<p><b>Charge tip:</b> The cath team is on call at night. Call them in the moment EMS pre-alerts, not when the patient arrives.</p>\n<h2>Blunt polytrauma, hemorrhagic shock</h2>\n<p><b>Arrives as:</b> \"Fall from height, hypotensive\" by ambulance. <b>ESI 1.</b> <b>Safe beds:</b> Resus / trauma bay.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Primary survey, chest tube, massive transfusion</td><td>ED physician, Trauma surgeon, ED nurse, Respiratory therapist, 4 units of blood</td><td>15</td></tr><tr><td>Damage-control laparotomy</td><td>Operating room, Trauma surgeon, Anesthesiologist, ED nurse, 4 units of blood</td><td>75</td></tr><tr><td>Surgical ICU bed</td><td>ICU bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Time targets:</b> Arrival to OR, 60 min.</p>\n<p><b>Charge tip:</b> He needs the OR, a surgeon, an anesthesiologist and a nurse at the same moment. One missing piece and he waits holding the trauma bay.</p>\n<h2>Opioid overdose (fentanyl)</h2>\n<p><b>Arrives as:</b> \"Unresponsive, slow breathing\" by ambulance. <b>ESI 1.</b> <b>Safe beds:</b> Resus / trauma bay, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Airway support and IV naloxone</td><td>ED physician, ED nurse, Respiratory therapist</td><td>8</td></tr><tr><td>Observation for re-sedation</td><td>bed only</td><td>75</td></tr><tr><td>Discharge with take-home naloxone</td><td>ED nurse</td><td>6</td></tr></tbody></table></div>\n<h2>Post-operative hemorrhage (ICU inpatient)</h2>\n<p><b>Arrives as:</b> \"ICU patient: drain output rising, hypotensive\" already in the hospital. <b>ESI 1.</b> <b>Safe beds:</b> ICU bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Return to theatre: re-exploration</td><td>Operating room, Trauma surgeon, Anesthesiologist, 2 units of blood</td><td>50</td></tr><tr><td>Back to an ICU bed</td><td>ICU bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Charge tip:</b> He holds an ICU bed and needs an OR. If the patient in the OR is waiting for an ICU bed, each holds what the other needs: a bed huddle swaps them in one move.</p>\n<h2>Acute ischemic stroke (left MCA)</h2>\n<p><b>Arrives as:</b> \"R weakness, aphasia, stroke alert\" by ambulance. <b>ESI 2.</b> <b>Safe beds:</b> Resus / trauma bay, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Stroke assessment (NIHSS, glucose, IV access)</td><td>ED physician, ED nurse</td><td>5</td></tr><tr><td>CT head and CT angiogram</td><td>CT scanner, Porter</td><td>14</td></tr><tr><td>IV thrombolysis</td><td>Neurology, ED nurse</td><td>8</td></tr><tr><td>Neuro ICU bed</td><td>ICU bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Time targets:</b> Door to CT, 25 min. Door to needle, 60 min.</p>\n<p><b>Charge tip:</b> Brain is lost every minute. A low-acuity scan ahead of her in the CT queue is the wrong queue: expedite her.</p>\n<h2>Acute pulmonary edema (heart failure)</h2>\n<p><b>Arrives as:</b> \"Severe shortness of breath\" by ambulance. <b>ESI 2.</b> <b>Safe beds:</b> Acute bed, Resus / trauma bay.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>BiPAP, IV furosemide, nitroglycerin</td><td>ED physician, ED nurse, Respiratory therapist</td><td>15</td></tr><tr><td>Portable chest X-ray</td><td>X-ray</td><td>8</td></tr><tr><td>Telemetry ward bed</td><td>Ward bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<h2>Anaphylaxis (peanut)</h2>\n<p><b>Arrives as:</b> \"Throat tightness, hives\" walking in. <b>ESI 2.</b> <b>Safe beds:</b> Resus / trauma bay, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>IM epinephrine and airway watch</td><td>Physician assistant or ED physician, ED nurse</td><td>6</td></tr><tr><td>Observation for biphasic reaction</td><td>bed only</td><td>90</td></tr><tr><td>Discharge with auto-injector</td><td>ED nurse</td><td>6</td></tr></tbody></table></div>\n<p><b>Time targets:</b> Epinephrine within 15 min, 15 min.</p>\n<p><b>Charge tip:</b> She walked in, so she starts in the waiting room. Sickest first, not first come first served.</p>\n<h2>Diabetic ketoacidosis, new type 1 diabetes</h2>\n<p><b>Arrives as:</b> \"Vomiting, deep fast breathing\" walking in. <b>ESI 2.</b> <b>Safe beds:</b> Acute bed, Resus / trauma bay.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Fluids, potassium check, insulin infusion</td><td>ED physician, ED nurse</td><td>18</td></tr><tr><td>Step-down ward bed (insulin infusion)</td><td>Ward bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<h2>Septic shock, community-acquired pneumonia</h2>\n<p><b>Arrives as:</b> \"Fever, confusion, short of breath\" by ambulance. <b>ESI 2.</b> <b>Safe beds:</b> Resus / trauma bay, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Sepsis hour-1 bundle</td><td>ED physician, ED nurse</td><td>15</td></tr><tr><td>Portable chest X-ray</td><td>X-ray</td><td>8</td></tr><tr><td>Reassessment, central line, norepinephrine</td><td>ED physician, ED nurse</td><td>18</td></tr><tr><td>Medical ICU bed</td><td>ICU bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Time targets:</b> Antibiotics within 1 hour, 60 min.</p>\n<h2>Suicidal ideation, involuntary hold</h2>\n<p><b>Arrives as:</b> \"Agitation, suicidal ideation\" by ambulance. <b>ESI 2.</b> <b>Safe beds:</b> Behavioural health room, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Medical clearance, safety search, 1:1 sitter</td><td>ED physician, ED nurse</td><td>12</td></tr><tr><td>Psychiatric assessment</td><td>Psychiatry</td><td>30</td></tr><tr><td>Inpatient psychiatric bed</td><td>Psychiatric bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Charge tip:</b> The psychiatric unit is full until morning. This patient will board: plan the room around that.</p>\n<h2>Variceal upper GI bleed</h2>\n<p><b>Arrives as:</b> \"Vomiting blood\" by ambulance. <b>ESI 2.</b> <b>Safe beds:</b> Resus / trauma bay, Acute bed.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Resuscitation and transfusion</td><td>ED physician, ED nurse, 2 units of blood</td><td>14</td></tr><tr><td>Emergency endoscopy at the bedside</td><td>Gastroenterology, Anesthesiologist, ED nurse</td><td>35</td></tr><tr><td>Medical ICU bed</td><td>ICU bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Charge tip:</b> Endoscopy needs the gastroenterologist, who is at home. Call in early.</p>\n<h2>Acute appendicitis</h2>\n<p><b>Arrives as:</b> \"Right lower abdominal pain\" walking in. <b>ESI 3.</b> <b>Safe beds:</b> Acute bed, Hallway stretcher.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Assessment and analgesia</td><td>Physician assistant or ED physician, ED nurse</td><td>10</td></tr><tr><td>CT abdomen and pelvis with contrast</td><td>CT scanner, Porter</td><td>14</td></tr><tr><td>Surgical consult, pre-operative antibiotics</td><td>Trauma surgeon</td><td>8</td></tr><tr><td>Laparoscopic appendectomy</td><td>Operating room, Trauma surgeon, Anesthesiologist</td><td>40</td></tr><tr><td>Surgical ward bed</td><td>Ward bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<h2>Displaced femoral neck fracture</h2>\n<p><b>Arrives as:</b> \"Fall, right hip pain\" by ambulance. <b>ESI 3.</b> <b>Safe beds:</b> Acute bed, Hallway stretcher.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Assessment and analgesia</td><td>Physician assistant or ED physician, ED nurse</td><td>10</td></tr><tr><td>X-ray pelvis and right hip</td><td>X-ray</td><td>10</td></tr><tr><td>Fascia iliaca nerve block, orthopedic referral</td><td>Physician assistant or ED physician</td><td>12</td></tr><tr><td>Orthopedic ward bed</td><td>Ward bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<h2>Renal colic (ureteric stone)</h2>\n<p><b>Arrives as:</b> \"Left flank pain\" walking in. <b>ESI 3.</b> <b>Safe beds:</b> Acute bed, Fast track chair, Hallway stretcher.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Assessment and analgesia</td><td>Physician assistant or ED physician, ED nurse</td><td>8</td></tr><tr><td>CT kidneys, ureters, bladder (no contrast)</td><td>CT scanner, Porter</td><td>12</td></tr><tr><td>Discharge</td><td>ED nurse</td><td>6</td></tr></tbody></table></div>\n<h2>Ruptured ectopic pregnancy</h2>\n<p><b>Arrives as:</b> \"Abdominal pain, vomiting\" walking in. <b>ESI 3.</b> <b>Safe beds:</b> Acute bed, Resus / trauma bay.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Assessment, pregnancy test, bedside ultrasound</td><td>ED physician, ED nurse, Ultrasound</td><td>12</td></tr><tr><td>Laparoscopic salpingectomy</td><td>Operating room, Obstetrics / gynecology, Anesthesiologist, ED nurse, 2 units of blood</td><td>55</td></tr><tr><td>Gynecology ward bed</td><td>Ward bed</td><td>until a bed is free</td></tr></tbody></table></div>\n<p><b>Charge tip:</b> Triage scored her ESI 3 on first look. Watch the waiting room: a rising NEWS score there is a patient in the wrong queue.</p>\n<h2>Distal radius buckle fracture (child)</h2>\n<p><b>Arrives as:</b> \"Wrist injury, fell off scooter\" walking in. <b>ESI 4.</b> <b>Safe beds:</b> Fast track chair, Hallway stretcher.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Assessment and analgesia</td><td>Physician assistant or ED physician, ED nurse</td><td>6</td></tr><tr><td>X-ray left wrist</td><td>X-ray</td><td>8</td></tr><tr><td>Splint and discharge</td><td>ED nurse</td><td>8</td></tr></tbody></table></div>\n<h2>Hand laceration</h2>\n<p><b>Arrives as:</b> \"Cut hand, kitchen knife\" walking in. <b>ESI 4.</b> <b>Safe beds:</b> Fast track chair, Hallway stretcher.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Wound exploration and suture</td><td>Physician assistant or ED physician, ED nurse</td><td>18</td></tr><tr><td>Discharge</td><td>ED nurse</td><td>4</td></tr></tbody></table></div>\n<h2>Ankle sprain</h2>\n<p><b>Arrives as:</b> \"Twisted ankle\" walking in. <b>ESI 5.</b> <b>Safe beds:</b> Fast track chair, Hallway stretcher.</p>\n<div class=\"tw\"><table><thead><tr><th>Step</th><th>Needs</th><th>Minutes</th></tr></thead><tbody><tr><td>Assessment (Ottawa ankle rules)</td><td>Physician assistant or ED physician</td><td>6</td></tr><tr><td>X-ray right ankle</td><td>X-ray</td><td>8</td></tr><tr><td>Discharge</td><td>ED nurse</td><td>5</td></tr></tbody></table></div>","text":"Every condition in the game. Generated from the same data the simulation runs on. Spoilers. These are the answers. Anterior STEMI Arrives as: \"Chest pain, STEMI alert\" by ambulance. ESI 1. Safe beds: Resus / trauma bay, Acute bed. Step Needs Minutes 12 lead ECG and physician assessment ED physician, ED nurse 6 Primary PCI in the cath lab Cath lab, Interventional cardiology, ED nurse 50 Coronary care (ICU) bed ICU bed until a bed is free Time targets: Door to ECG  units of blood 55 Gynecology ward bed Ward bed until a bed is free Charge tip: Triage scored her ESI 3 on first look. Watch the waiting room: a rising NEWS score there is a patient in the wrong queue. Distal radius buckle fracture (child) Arrives as: \"Wrist injury, fell off scooter\" walking in. ESI 4. Safe beds: Fast track chair, Hallway stretcher. Step Needs Minutes Assessment and analgesia Physician assistant or ED physician, ED nurse 6 X ray left wrist X ray 8 Splint and discharge ED nurse 8 Hand laceration Arrives as: \"Cut hand, kitchen knife\" walking in. ESI 4. Safe beds: Fast track chair, Hallway stretcher. Step Needs Minutes Wound exploration and suture Physician assistant or ED physician, ED nurse 18 Discharge ED nurse 4 Ankle sprain Arrives as: \"Twisted ankle\" walking in. ESI 5. Safe beds: Fast track chair, Hallway stretcher. Step Needs Minutes Assessment (Ottawa ankle rules) Physician assistant or ED physician 6 X ray right ankle X ray 8 Discharge ED nurse 5"},{"id":"lens","title":"The Engineer Lens","html":"<h1>The Engineer Lens</h1>\n<p>Night Shift began as a way to teach concurrency, which is how computers share things between competing tasks. A hospital turns out to have exactly the same problems, with higher stakes.</p>\n<p>Turn on <b>Engineer Lens</b> to see the computing word on each alert. It changes nothing in the hospital.</p>\n<div class=\"tw\"><table><thead><tr><th>In the hospital</th><th>In a computer</th></tr></thead><tbody><tr><td>A step needs everything at once</td><td>Atomic acquisition</td></tr><tr><td>Keeping your bed until the next is ready</td><td>Hold-and-wait</td></tr><tr><td>Gridlock</td><td>Deadlock</td></tr><tr><td>Bed huddle</td><td>Atomic swap</td></tr><tr><td>Passed over</td><td>Starvation</td></tr><tr><td>Stroke behind a kidney stone</td><td>Priority inversion</td></tr><tr><td>Code team pulled from another patient</td><td>Preemption</td></tr><tr><td>Time targets</td><td>Deadlines</td></tr><tr><td>Reserve</td><td>Reservation</td></tr><tr><td>Call in</td><td>Provisioning lead time</td></tr><tr><td>Ambulance diversion</td><td>Load shedding</td></tr><tr><td>Hold</td><td>Back off</td></tr></tbody></table></div>","text":"Night Shift began as a way to teach concurrency, which is how computers share things between competing tasks. A hospital turns out to have exactly the same problems, with higher stakes. Turn on Engineer Lens to see the computing word on each alert. It changes nothing in the hospital. In the hospital In a computer A step needs everything at once Atomic acquisition Keeping your bed until the next is ready Hold and wait Gridlock Deadlock Bed huddle Atomic swap Passed over Starvation Stroke behind a kidney stone Priority inversion Code team pulled from another patient Preemption Time targets Deadlines Reserve Reservation Call in Provisioning lead time Ambulance diversion Load shedding Hold Back off"},{"id":"limits","title":"Honest limits","html":"<h1>Honest limits</h1>\n<ul><li>The medical content is written from general emergency medicine knowledge to be plausible and consistent. <b>No clinician has reviewed it. It is game content, not medical guidance.</b></li><li>Times are compressed. Real surgery and observation take longer.</li><li>Staff are claimed step by step. Nurse-to-patient ratios, breaks and fatigue are not modelled.</li><li>Each condition has one pathway, and the diagnosis is known. Real medicine is much less certain.</li><li>No bed cleaning, no families, and no sound. Progress is not saved between visits.</li><li>The background is a generated image of an emergency department with animated figures on top.</li></ul>","text":"The medical content is written from general emergency medicine knowledge to be plausible and consistent. No clinician has reviewed it. It is game content, not medical guidance. Times are compressed. Real surgery and observation take longer. Staff are claimed step by step. Nurse to patient ratios, breaks and fatigue are not modelled. Each condition has one pathway, and the diagnosis is known. Real medicine is much less certain. No bed cleaning, no families, and no sound. Progress is not saved between visits. The background is a generated image of an emergency department with animated figures on top."}],"diagrams":{"jam":"<svg xmlns=\"http://www.w3.org/2000/svg\" class=\"ondine ondine-flowchart\" viewBox=\"0 0 550 82\" width=\"550\" height=\"82\" style=\"max-width:100%;height:auto;--_bg:var(--ondine-bg,#fff);--_fg:var(--ondine-fg,#000);--_m:var(--ondine-muted,var(--_fg));--_l:var(--ondine-line,var(--_fg));--_s:var(--ondine-surface,var(--_bg));--_a:var(--ondine-surface-alt,color-mix(in srgb,var(--_fg) 20%,var(--_bg)));--_b:var(--ondine-border,var(--_fg));--_c:var(--ondine-accent,var(--_fg));--_sw:var(--ondine-stroke,2px);stroke-width:var(--_sw);color:var(--_fg);--_r:var(--ondine-radius,0);--_fm:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font:16px monospace;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--ondine-font,ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace);font-kerning:none;font-variant-ligatures:none;text-rendering:geometricPrecision\" fill=\"var(--_fg)\" role=\"graphics-document document\" aria-roledescription=\"flowchart\"><g class=\"ondine-edges\" fill=\"none\" stroke=\"var(--_l)\" stroke-linecap=\"round\"><g class=\"ondine-edge\" data-id=\"L_A_B_0\"><path d=\"M168.8,33L179.3,33C186.05,33 186.05,20.5 192.8,20.5L347.6,20.5C353.98,20.5 353.98,33 360.35,33L364.6,33\"/><path class=\"ondine-marker\" d=\"M371.6,33L363.6,36.36L363.6,29.64Z\" fill=\"var(--_l)\" stroke=\"none\"/></g><g class=\"ondine-edge\" data-id=\"L_B_A_0\"><path d=\"M371.6,49L361.1,49C354.35,49 354.35,61.5 347.6,61.5L192.8,61.5C186.43,61.5 186.43,49 180.05,49L175.8,49\"/><path class=\"ondine-marker\" d=\"M168.8,49L176.8,45.64L176.8,52.36Z\" fill=\"var(--_l)\" stroke=\"n <script>
const Engine = (() => {
/* ---- rng ---- */
/* Seeded randomness. The generator state lives in the game state (state.rng), so a
 * shift replays exactly from its seed and the list of player actions. */
function seedFrom(str) {
  let h = 2166136261 >>> 0;
  for (const ch of String(str)) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619) >>> 0; }
  return h || 1;
}

/** Next float in [0,1). Mutates state.rng (mulberry32). */
function rnd(state) {
  let a = (state.rng = (state.rng + 0x6d2b79f5) >>> 0);
  a = Math.imul(a ^ (a >>> 15), a | 1);
  a ^= a + Math.imul(a ^ (a >>> 7), a | 61);
  return ((a ^ (a >>> 14)) >>> 0) / 4294967296;
}
const rint = (state, lo, hi) => lo + Math.floor(rnd(state) * (hi - lo + 1));
const pick = (state, arr) => arr[Math.floor(rnd(state) * arr.length)];

/** Stateless jitter in [-1,1] from two integers. Used for vital-sign noise, so
 * reading vitals never advances the game's generator. */
function jitter(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) >>> 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
  return ((h ^ (h >>> 16)) >>> 0) / 2147483648 - 1;
}

/* ---- news2 ---- */
/* NEWS2: National Early Warning Score 2 (Royal College of Physicians, 2017).
 * Seven bedside observations, each scored 0-3. Uses SpO2 scale 1.
 * Aggregate 0-4 low, 5-6 medium (urgent review), 7+ high (emergency response).
 * Any single parameter scoring 3 also warrants urgent review. */
const band = (v, table) => { for (const [limit, score] of table) if (v <= limit) return score; return table[table.length - 1][1]; };

function news2(v) {
  const parts = {
    rr: band(v.rr, [[8, 3], [11, 1], [20, 0], [24, 2], [Infinity, 3]]),
    spo2: band(v.spo2, [[91, 3], [93, 2], [95, 1], [Infinity, 0]]),
    o2: v.o2 ? 2 : 0,
    sbp: band(v.sbp, [[90, 3], [100, 2], [110, 1], [219, 0], [Infinity, 3]]),
    hr: band(v.hr, [[40, 3], [50, 1], [90, 0], [110, 1], [130, 2], [Infinity, 3]]),
    avpu: v.gcs < 15 ? 3 : 0,
    temp: band(v.temp, [[35.0, 3], [36.0, 1], [38.0, 0], [39.0, 1], [Infinity, 2]]),
  };
  const score = Object.values(parts).reduce((a, b) => a + b, 0);
  const red = Object.values(parts).some((s) => s === 3);
  const risk = score >= 7 ? 'high' : score >= 5 ? 'medium' : red ? 'low-medium' : 'low';
  return { score, parts, risk, red };
}

/* ---- hospital ---- */
/* Harbourside General: everything the charge nurse can allocate.
 * A "unit" is one indivisible thing: one bed, one scanner, one person.
 * A patient's care step needs a set of units all at once. */

/** kind -> how it behaves and how it is shown. */
const KINDS = {

const U = (id, kind, name, x = {}) => ({ id, kind, name, holder: null, reservedFor: null, ...x });
const many = (n, f) => Array.from({ length: n }, (_, i) => f(i + 1));

/** On-call teams the charge nurse can call in: who, and minutes until they are in house. */
const ON_CALL = {

    U('md3', 'md', 'Dr. Daniel Cho', { role: 'Senior resident (PGY-3)' }),
    U('pa1', 'pa', 'Whitney Park PA-C', { role: 'Physician assistant, fast track' }),
    U('rn1', 'rn', 'Sunita Patel RN', { role: 'Resus nurse' }),
    U('rn2', 'rn', 'Min-jun Kim RN', { role: 'Resus nurse' }),
    U('rn3', 'rn', 'Carmen Diaz RN', { role: 'Acute nurse' }),
    U('rn4', 'rn', 'Emeka Okafor RN', { role: 'Acute nurse' }),

    U('rn6', 'rn', 'Tariq Aziz RN', { role: 'Triage / float nurse' }),

  return Object.fromEntries(units.map((u) => [u.id, u]));
}

const START_STOCK = { prbc: 10 };          // units of O-negative / crossmatched red cells in the ED fridge
const SHIFT_START = 19 * 60;               // 19:00
const SHIFT_MINUTES = 12 * 60;             // 19:00 to 07:00

/** Minutes since shift start -> "HH:MM" wall clock. */
function clock(t) {
  const m = (((SHIFT_START + t) % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
}
const hm = (min) => `${Math.floor(Math.max(0, min) / 60)}:${String(Math.floor(Math.max(0, min) % 60)).padStart(2, '0')}`;

/* ---- casebook ---- */
/* The case book: what walks, rolls or is carried through the doors.
 *
 * Every case is a template the patient generator fills in. Fields:
 *   esi      Emergency Severity Index 1 (dying) to 5 (minor)
 *   bed      ED bed kinds that are safe for this patient, best first
 *   via      'ems' (ambulance, pre-alerted) or 'walk' (through triage to the waiting room)
 *   vit      vital signs when well (s) and at the point of collapse (c); the patient's
 *            "sev" (0 = well, 1 = cardiac arrest) slides between the two
 *   sev0     severity on arrival;  rate  severity gained per minute while untreated
 *   cap      severity ceiling for cases that harm without killing quickly
 *   labs     [name, value, unit, reference range, flag, minutes to result]; flag HH/LL is critical
 *   steps    the care pathway. Each step needs ALL of its `needs` at the same moment.
 *            needs use unit kinds from hospital.mjs; 'pa|md' means either will do.
 *            place: the step moves the patient there (cath lab, OR). end: 'home' | 'admit'.
 *            sev / rate: what the treatment does.  blood: red cell units used.
 *   clocks   real time targets, measured from arrival to the start (or end) of a step
 *
 * Clinical content is written to be plausible and consistent with common emergency
 * medicine teaching. It is game content, not clinical guidance. */

const V = (hr, sbp, dbp, rr, spo2, temp, gcs = 15) => ({ hr, sbp, dbp, rr, spo2, temp, gcs });

const CASES = {

      { key: 'pci', label: 'Primary PCI in the cath lab', needs: ['cath', 'cards', 'rn'], place: 'cath', dur: 50, sev: -0.3, rate: 0, note: 'Transferred to cath lab on monitor.', result: ['Coronary angiography', '100% thrombotic occlusion of the proximal LAD. Drug-eluting stent placed, TIMI 3 flow restored. Mild disease elsewhere. LVEF 40%.'] },

    steps: [
      { key: 'assess', label: 'Stroke assessment (NIHSS, glucose, IV access)', needs: ['md', 'rn'], dur: 5, note: 'NIHSS 14. Glucose normal. No anticoagulants. 18G IV placed. Telestroke neurologist paged.' },

/** How often each case shows up as an unscripted arrival. */
const CASE_WEIGHTS = { colic: 6, laceration: 8, ankle: 8, forearm: 5, appendicitis: 4, hip: 5, chf: 4, dka: 3, sepsis: 4, psych: 2, gibleed: 2, overdose: 3, anaphylaxis: 2, ectopic: 1, stroke: 2, stemi: 2, trauma: 1 };

const NAMES = {
  M: ['Daniel', 'Luis', 'Tyrell', 'Bao', 'Samir', 'Chidi', 'Marek', 'Owen', 'Kenji', 'Rafael', 'Arjun', 'Liam', 'Yusuf', 'Andre', 'Piotr', 'Haruto', 'Mateus', 'Callum'],
  F: ['Margaret', 'Anna', 'Greta', 'Ines', 'Aisha', 'Mei', 'Rosa', 'Fatima', 'Siobhan', 'Nadia', 'Olivia', 'Thandiwe', 'Hana', 'Elif', 'Camille', 'Ngozi', 'Sofia', 'Ruth'],
  L: ['Okonkwo', 'Hale', 'Vasquez', 'Petrov', 'Brooks', 'Lindqvist', 'Nguyen', 'Farouk', 'Morales', 'Abara', 'Kowalski', 'Tanaka', 'Mbeki', 'Castillo', 'Rahman', 'Fraser', 'Yilmaz', 'Santos', 'Dubois', 'Achebe', 'Ivanova', 'Park', 'Hughes', 'Ortega', 'Bianchi', 'Sato', 'Mwangi', 'Lund'],
